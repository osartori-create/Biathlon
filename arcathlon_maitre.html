<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcathlon | Maître</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
</head>
<body class="bg-slate-900 text-white p-4 font-sans h-screen flex flex-col">
    <header class="flex justify-between items-center mb-6 border-b border-slate-700 pb-4 shrink-0">
        <h1 class="text-2xl font-black text-blue-500 uppercase tracking-widest">Arcathlon <span class="text-slate-400 text-sm">| Professeur</span></h1>
        <div class="flex gap-2">
            <button onclick="purgeLive()" class="bg-red-900/50 text-red-400 border border-red-800 px-4 py-2 rounded-lg font-bold text-xs hover:bg-red-800">⚠️ Purger Live</button>
            <label class="bg-emerald-600 px-4 py-2 rounded-lg font-bold text-xs cursor-pointer hover:bg-emerald-500 border border-emerald-500">
                📥 Import CSV (iDoceo)
                <input type="file" id="csvFile" accept=".csv" class="hidden" onchange="handleCSV(event)">
            </label>
            <button onclick="pushConfig()" class="bg-blue-600 px-4 py-2 rounded-lg font-bold text-xs hover:bg-blue-500 border border-blue-500">🚀 Envoyer aux iPads</button>
        </div>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 flex-1 overflow-hidden">
        <!-- Équipes -->
        <div class="col-span-1 bg-slate-800 p-4 rounded-3xl border-2 border-slate-700 flex flex-col h-full overflow-hidden">
            <h2 class="font-black text-emerald-400 mb-4 uppercase shrink-0">Équipes (Génération Auto)</h2>
            <div id="teamsList" class="flex flex-col gap-3 overflow-y-auto pr-2 pb-4"></div>
        </div>
        
        <!-- Live & Globes -->
        <div class="col-span-2 bg-slate-800 p-6 rounded-3xl border-2 border-slate-700 flex flex-col h-full overflow-hidden">
            <h2 class="font-black text-amber-400 mb-6 uppercase shrink-0 text-xl">🏆 Live Score & Classements</h2>
            
            <div class="flex-1 overflow-y-auto pr-2 pb-4">
                <h3 class="font-bold text-slate-300 border-b border-slate-600 pb-2 mb-4 uppercase tracking-widest">Gros Globe (Par Équipe)</h3>
                <div id="grosGlobe" class="grid grid-cols-2 gap-3 mb-8"></div>

                <h3 class="font-bold text-slate-300 border-b border-slate-600 pb-2 mb-4 uppercase tracking-widest">Petits Globes (Individuel par Maillot)</h3>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                    <div id="globeVert" class="bg-green-900/30 p-3 rounded-2xl border-2 border-green-800/50"></div>
                    <div id="globeBleu" class="bg-blue-900/30 p-3 rounded-2xl border-2 border-blue-800/50"></div>
                    <div id="globeJaune" class="bg-yellow-900/30 p-3 rounded-2xl border-2 border-yellow-800/50"></div>
                    <div id="globeRouge" class="bg-red-900/30 p-3 rounded-2xl border-2 border-red-800/50"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            databaseURL: "https://arcathlon-eps-default-rtdb.europe-west1.firebasedatabase.app/"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let equipes = [];
        let configAnonyme = {};

        function handleCSV(e) {
            Papa.parse(e.target.files[0], {
                header: true, skipEmptyLines: true,
                complete: function(results) {
                    let data = results.data;
                    data.sort((a,b) => parseFloat(b.VMA) - parseFloat(a.VMA)); // Tri par VMA
                    
                    let nbEquipes = Math.floor(data.length / 4);
                    if(nbEquipes === 0) return alert("Pas assez d'élèves pour faire des équipes de 4.");
                    
                    equipes = Array.from({length: nbEquipes}, (_, i) => ({ id: `EQ${i+1}`, membres: [], score: 0 }));
                    
                    let couleurs = [
                        { nom: 'Rouge', style: 'text-red-400 bg-red-950 border-red-800' },
                        { nom: 'Jaune', style: 'text-yellow-400 bg-yellow-950 border-yellow-800' },
                        { nom: 'Bleu', style: 'text-blue-400 bg-blue-950 border-blue-800' },
                        { nom: 'Vert', style: 'text-green-400 bg-green-950 border-green-800' }
                    ];

                    let eleveIdx = 0;
                    couleurs.forEach((c) => {
                        for(let i=0; i<nbEquipes; i++) {
                            if(data[eleveIdx]) {
                                let el = data[eleveIdx];
                                let nomCourt = el.Nom ? el.Nom.charAt(0).toUpperCase() + "." : "";
                                equipes[i].membres.push({ prenom: el.Prenom || "Inconnu", nom: nomCourt, vma: el.VMA, maillot: c.nom, style: c.style, scoreIndiv: 0 });
                                
                                if(!configAnonyme[`EQ${i+1}`]) configAnonyme[`EQ${i+1}`] = [];
                                configAnonyme[`EQ${i+1}`].push({ maillot: c.nom, vma: el.VMA });
                                eleveIdx++;
                            }
                        }
                        equipes.reverse(); // Serpentin
                    });
                    renderTeams();
                }
            });
        }

        function renderTeams() {
            document.getElementById('teamsList').innerHTML = equipes.map(eq => `
                <div class="bg-slate-900 p-4 rounded-2xl border-2 border-slate-700 shadow-lg">
                    <div class="font-black text-xl mb-3 text-slate-300">ÉQUIPE ${eq.id}</div>
                    <div class="space-y-2">
                    ${eq.membres.map(m => `
                        <div class="text-sm flex justify-between items-center border border-slate-800 p-2 rounded-lg ${m.style}">
                            <span class="font-black uppercase">${m.maillot}</span> 
                            <span class="font-bold text-white">${m.prenom} ${m.nom} <span class="text-xs text-slate-400 ml-1">(VMA: ${m.vma})</span></span>
                        </div>
                    `).join('')}
                    </div>
                </div>
            `).join('');
        }

        function pushConfig() {
            if(Object.keys(configAnonyme).length === 0) return alert("Importez d'abord le CSV !");
            db.ref('arcathlon/config/equipes').set(configAnonyme);
            alert("Configuration envoyée avec succès aux iPads élèves !");
        }

        function purgeLive() {
            if(confirm("Effacer toutes les performances enregistrées ?")) {
                db.ref('arcathlon/live').remove();
            }
        }

        db.ref('arcathlon/live/passages').on('value', snap => {
            const passages = snap.val() || {};
            equipes.forEach(eq => { eq.score = 0; eq.membres.forEach(m => m.scoreIndiv = 0); });

            Object.values(passages).forEach(p => {
                let eq = equipes.find(e => e.id === p.equipe);
                if(eq) {
                    let membre = eq.membres.find(m => m.maillot === p.maillot);
                    if(membre) {
                        let pts = (p.ptsVMA || 0) + (p.ptsTir || 0);
                        membre.scoreIndiv += pts;
                        eq.score += pts;
                    }
                }
            });
            updateScoresLocally();
        });

        function updateScoresLocally() {
            let eqTriees = [...equipes].sort((a,b) => b.score - a.score);
            document.getElementById('grosGlobe').innerHTML = eqTriees.map((eq, idx) => `
                <div class="bg-slate-900 p-4 rounded-xl border border-slate-700 flex justify-between items-center shadow-md">
                    <span class="font-black text-lg text-slate-300">${idx+1}. ${eq.id}</span>
                    <span class="text-emerald-400 font-black text-2xl">${eq.score} <span class="text-xs text-slate-500">pts</span></span>
                </div>
            `).join('');

            ['Vert', 'Bleu', 'Jaune', 'Rouge'].forEach(c => {
                let joueurs = [];
                equipes.forEach(eq => {
                    let j = eq.membres.find(m => m.maillot === c);
                    if(j) joueurs.push({ prenom: j.prenom, nom: j.nom, eq: eq.id, score: j.scoreIndiv });
                });
                joueurs.sort((a,b) => b.score - a.score);
                
                let textColor = c==='Vert'?'text-green-400':c==='Bleu'?'text-blue-400':c==='Jaune'?'text-yellow-400':'text-red-400';
                
                document.getElementById('globe'+c).innerHTML = `<h4 class="font-black text-center mb-4 uppercase ${textColor} tracking-widest text-lg">${c}</h4>` + 
                    joueurs.map((j, idx) => `
                    <div class="text-sm flex justify-between items-center border-b border-black/30 py-2">
                        <span class="font-bold text-slate-300">${idx+1}. ${j.prenom} <span class="text-[10px] text-slate-500 ml-1">(${j.eq})</span></span> 
                        <span class="font-black ${textColor}">${j.score}</span>
                    </div>`).join('');
            });
        }
    </script>
</body>
</html>
