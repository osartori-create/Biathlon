<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Arcathlon | Maître (Professeur)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { touch-action: manipulation; }
        body { user-select: none; background: #0f172a; color: white; font-family: sans-serif; }
        .tab-active { border-bottom: 4px solid #3b82f6; color: #3b82f6 !important; font-weight: 900; }
        .nav-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
        .photo-preview { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; }
        .alerte-triche { background: #ef4444; color: white; padding: 2px 6px; border-radius: 4px; font-weight: 900; font-size: 0.65rem; }
        .stats-card { background: #111827; border: 1px solid #1f2937; border-radius: 12px; padding: 12px; margin-bottom: 12px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
        .serie-detail { font-size: 0.75rem; color: #94a3b8; line-height: 1.4; }
    </style>
</head>
<body class="p-4 h-screen flex flex-col">

    <!-- En-tête -->
    <header class="flex justify-between items-center mb-3 border-b border-slate-800 pb-3 shrink-0 flex-wrap gap-2">
        <div class="flex items-center gap-3">
            <h1 class="text-2xl font-black italic text-blue-500">Arcathlon</h1>
            <span class="text-[10px] font-black uppercase text-slate-400 border border-slate-700 px-2 py-0.5 rounded-full bg-slate-900">Espace Professeur (RGPD-Local)</span>
        </div>
        <div class="flex items-center gap-3">
            <span id="connDot" class="w-3 h-3 rounded-full bg-slate-600"></span>
            <span id="connLabel" class="text-xs font-bold uppercase text-slate-500">Connexion...</span>
            <select id="selectClasse" onchange="changeClasse(this.value)" class="bg-slate-800 border border-slate-600 rounded px-3 py-1 text-xs font-bold text-white outline-none">
                <option value="">-- Classe --</option>
            </select>
            <button onclick="addClasse()" class="bg-blue-600 px-3 py-1 rounded text-xs font-black uppercase">+ Classe</button>
        </div>
    </header>

    <!-- Navigation -->
    <nav class="nav-scroll flex border-b border-slate-800 mb-4 font-bold text-xs uppercase tracking-widest shrink-0">
        <button id="btnTab1" onclick="switchTab('import')" class="px-4 py-2 text-slate-500 tab-active text-blue-500 whitespace-nowrap">📋 Élèves (Local)</button>
        <button id="btnTab2" onclick="switchTab('equipes')" class="px-4 py-2 text-slate-500 whitespace-nowrap">👥 Composition & Lancement</button>
        <button id="btnTab3" onclick="switchTab('live')" class="px-4 py-2 text-slate-500 whitespace-nowrap">📊 Résultats Direct</button>
        <button id="btnTab4" onclick="switchTab('statistiques')" class="px-4 py-2 text-slate-500 whitespace-nowrap">📈 Statistiques détaillées</button>
        <button id="btnTab5" onclick="switchTab('historique')" class="px-4 py-2 text-slate-500 whitespace-nowrap">📜 Historique Séances</button>
    </nav>

    <div class="flex-1 overflow-hidden relative">
        
        <!-- ONGLET 1 : IMPORT & ELEVES -->
        <div id="viewImport" class="h-full flex flex-col absolute inset-0">
            <div class="flex flex-wrap items-center gap-3 mb-4 shrink-0 bg-slate-800/60 p-3 rounded-2xl border border-slate-700">
                <button onclick="document.getElementById('csvFile').click()" class="bg-emerald-600 px-4 py-2 rounded-xl font-bold text-xs border border-emerald-400">📄 Import CSV VMA</button>
                <input type="file" id="csvFile" accept=".csv" class="hidden">
                <button onclick="document.getElementById('zipFile').click()" class="bg-indigo-600 px-4 py-2 rounded-xl font-bold text-xs border border-indigo-400">📸 Import ZIP Photos</button>
                <input type="file" id="zipFile" accept=".zip" class="hidden">
                <button onclick="addManualEleve()" class="bg-slate-700 px-3 py-2 rounded-xl font-bold text-xs border border-slate-500">+ Élève</button>
                <button onclick="purgeEleves()" class="bg-red-950/60 text-red-400 px-3 py-2 rounded-xl font-bold text-xs border border-red-800">🗑 Purger Classe</button>
                <button onclick="exportData()" class="bg-slate-800 px-3 py-2 rounded-xl font-bold text-xs border border-slate-600">💾 Sauvegarde Prof</button>
                <button onclick="document.getElementById('importDataInput').click()" class="bg-slate-800 px-3 py-2 rounded-xl font-bold text-xs border border-slate-600">📥 Restaurer Prof</button>
                <input type="file" id="importDataInput" accept=".json" class="hidden">
            </div>
            <div id="elevesGrid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 xl:grid-cols-8 gap-3 overflow-y-auto pb-6 pr-1 content-start flex-1"></div>
        </div>

        <!-- ONGLET 2 : ÉQUIPES & CONFIG SÉANCE -->
        <div id="viewEquipes" class="h-full flex flex-col hidden absolute inset-0 overflow-y-auto pr-1">
            <div class="flex flex-wrap items-center justify-between mb-4 gap-3 border-b border-slate-800 pb-3 shrink-0">
                <div class="flex items-center gap-3">
                    <button onclick="generateTeams()" class="bg-orange-600 px-5 py-2.5 rounded-xl font-black uppercase text-xs border border-orange-400">🔄 Générer Équipes (3 coureurs)</button>
                    <span class="text-xs text-slate-400">(par défaut 3 par équipe)</span>
                </div>
            </div>

            <!-- Paramétrage Multimode -->
            <div class="bg-slate-800/80 p-5 rounded-2xl border-2 border-slate-700 mb-6 shadow-lg">
                <h3 class="font-black text-blue-400 uppercase text-sm mb-4">🚀 Configuration & Lancement de l'Épreuve</h3>
                <div class="flex flex-wrap gap-4 mb-4">
                    <div class="flex-1 min-w-[200px]">
                        <label class="block font-bold text-slate-400 uppercase text-xs mb-1">Mode d'épreuve :</label>
                        <select id="modeEpreuve" class="w-full bg-slate-900 border-2 border-slate-600 rounded-xl p-3 text-sm font-bold text-white outline-none">
                            <option value="sprint">🏃 Sprint (Standard)</option>
                            <option value="poursuite">⏱️ Poursuite Inversée (Handicap)</option>
                            <option value="relais">🃏 Relais (Cartes Bonus/Malus)</option>
                            <option value="mille">🎯 Dans le 1000 (18 secondes)</option>
                            <option value="killbill">⚔️ Kill Bill (Duel 2v2)</option>
                        </select>
                    </div>
                    <div class="flex-1 min-w-[150px]">
                        <label class="block font-bold text-slate-400 uppercase text-xs mb-1">Coureurs par équipe</label>
                        <input type="number" id="nbCoureursEquipe" value="3" min="2" max="4" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-center font-bold text-emerald-400">
                    </div>
                </div>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4 text-xs mb-4">
                    <div>
                        <label class="block font-bold text-slate-400 uppercase mb-1">Longueur Piste (m)</label>
                        <input type="number" id="longueurPiste" value="400" min="50" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-center font-bold text-emerald-400">
                    </div>
                    <div>
                        <label class="block font-bold text-slate-400 uppercase mb-1">Tours / Série</label>
                        <select id="nbTours" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-center font-bold text-emerald-400">
                            <option value="1">1 tour</option><option value="2">2 tours</option><option value="3" selected>3 tours</option><option value="4">4 tours</option>
                        </select>
                    </div>
                    <div>
                        <label class="block font-bold text-slate-400 uppercase mb-1">Nombre de Séries</label>
                        <select id="nbSeries" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-center font-bold text-emerald-400">
                            <option value="1">1 série</option><option value="2">2 séries</option><option value="3" selected>3 séries</option>
                        </select>
                    </div>
                    <div>
                        <label class="block font-bold text-slate-400 uppercase mb-1">Flèches / Tir</label>
                        <select id="nbFleches" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-center font-bold text-emerald-400">
                            <option value="1">1 flèche</option><option value="2" selected>2 flèches</option><option value="3">3 flèches</option>
                        </select>
                    </div>
                </div>
                <button onclick="pushConfig()" class="w-full bg-blue-600 py-4 rounded-xl font-black text-lg uppercase tracking-widest text-white border-4 border-blue-400 shadow-[0_0_15px_rgba(59,130,246,0.5)] active:scale-[0.98] transition-transform">
                    📡 Transmettre aux iPads Élèves
                </button>
            </div>

            <div id="teamsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 pb-6 content-start"></div>
        </div>

        <!-- ONGLET 3 : LIVE -->
        <div id="viewLive" class="h-full flex flex-col hidden absolute inset-0">
            <div class="flex justify-between items-center mb-4 shrink-0 bg-slate-800 p-3 rounded-xl border border-slate-700">
                <div class="font-black text-blue-400 uppercase tracking-widest text-sm">Mode Actuel : <span id="liveModeBadge" class="text-white">--</span></div>
                <div class="flex gap-2">
                    <button onclick="exportResults()" class="bg-emerald-600 px-4 py-2 rounded-xl font-bold text-xs uppercase border border-emerald-400">📤 Exporter CSV</button>
                    <button onclick="purgeLive()" class="bg-red-950/60 text-red-400 border border-red-800 px-4 py-2 rounded-xl font-bold text-xs uppercase">⚠️ Purger le Live</button>
                </div>
            </div>
            <div class="flex-1 overflow-y-auto pr-1 space-y-6">
                <div>
                    <h3 class="font-bold text-slate-400 border-b border-slate-800 pb-2 mb-3 text-xs uppercase tracking-widest">Classement par Équipe</h3>
                    <div id="grosGlobe" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3"></div>
                </div>
                <div>
                    <h3 class="font-bold text-slate-400 border-b border-slate-800 pb-2 mb-3 text-xs uppercase tracking-widest">Journal des Passages</h3>
                    <div id="journalPassages" class="flex flex-col gap-2"></div>
                </div>
            </div>
        </div>

        <!-- ONGLET 4 : STATISTIQUES DÉTAILLÉES -->
        <div id="viewStatistiques" class="h-full flex flex-col hidden absolute inset-0 overflow-y-auto pr-1">
            <div class="flex flex-wrap gap-3 mb-4 shrink-0 bg-slate-800 p-3 rounded-xl border border-slate-700">
                <button onclick="loadStats()" class="bg-blue-600 px-6 py-2 rounded-xl font-bold text-xs uppercase tracking-widest">🔍 Charger les stats de la séance</button>
                <button onclick="exportStatsCSV()" class="bg-emerald-600 px-6 py-2 rounded-xl font-bold text-xs uppercase">📥 Exporter CSV détaillé</button>
            </div>
            <div class="stats-card">
                <div class="stats-grid" id="statsSummary"></div>
            </div>
            <div style="height: 300px; margin-bottom: 20px;">
                <canvas id="statsChart"></canvas>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-xs" id="statsDetailTable">
                    <thead>
                        <tr>
                            <th>Équipe</th><th>Maillot</th><th>Série</th>
                            <th>Temps (s)</th><th>Vitesse</th><th>Pts VMA</th>
                            <th>Tir (pts)</th><th>Bonus (s)</th><th>Temps bonifié (s)</th>
                            <th>Total pts</th><th>Alerte</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>

        <!-- ONGLET 5 : HISTORIQUE -->
        <div id="viewHistorique" class="h-full flex flex-col hidden absolute inset-0">
            <div class="flex flex-wrap gap-3 mb-4 shrink-0 bg-slate-800 p-3 rounded-xl border border-slate-700">
                <select id="selectSeance" class="bg-slate-900 border border-slate-600 rounded px-3 py-2 text-xs font-bold text-white outline-none flex-1 max-w-xs">
                    <option value="">-- Sélectionner une séance --</option>
                </select>
                <select id="filterEquipe" class="bg-slate-900 border border-slate-600 rounded px-3 py-2 text-xs font-bold text-white outline-none">
                    <option value="all">Toutes les équipes</option>
                </select>
                <button onclick="loadHistorique()" class="bg-blue-600 px-6 py-2 rounded-xl font-bold text-xs uppercase tracking-widest">🔍 Consulter</button>
            </div>
            <div class="flex-1 overflow-y-auto pr-1"><div id="historiqueContainer" class="space-y-4"></div></div>
        </div>
    </div>

    <script>
        // =====================================================================
        // FIREBASE CONFIG
        // =====================================================================
        const firebaseConfig = { databaseURL: "https://arcathlon-eps-default-rtdb.europe-west1.firebasedatabase.app/" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // =====================================================================
        // STATE
        // =====================================================================
        let state = JSON.parse(localStorage.getItem('arcathlon_state_prof_v9')) || {
            classes: {}, equipes: {}, activeCl: "", seances: {}
        };
        let dbPhotos;
        const request = indexedDB.open("Arcathlon_Prof_DB", 1);
        request.onupgradeneeded = e => {
            dbPhotos = e.target.result;
            if (!dbPhotos.objectStoreNames.contains("eleves")) {
                dbPhotos.createObjectStore("eleves", { keyPath: "id" });
            }
        };
        request.onsuccess = e => {
            dbPhotos = e.target.result;
            initUI();
        };
        request.onerror = e => console.error("IndexedDB error", e);

        function saveToLocal() { localStorage.setItem('arcathlon_state_prof_v9', JSON.stringify(state)); }
        function savePhoto(id, blob) {
            if (!dbPhotos) return;
            const tx = dbPhotos.transaction("eleves", "readwrite");
            tx.objectStore("eleves").put({ id, blob });
        }
        function getPhotoUrl(id) {
            return new Promise(resolve => {
                if (!dbPhotos) return resolve(null);
                const tx = dbPhotos.transaction("eleves", "readonly");
                const req = tx.objectStore("eleves").get(id);
                req.onsuccess = () => resolve(req.result ? URL.createObjectURL(req.result.blob) : null);
                req.onerror = () => resolve(null);
            });
        }
        function clePhoto(nom, prenom) {
            const n = (nom || "").trim().toUpperCase().replace(/\s+/g, "");
            const p = (prenom || "").trim().toUpperCase().charAt(0);
            return n + "_" + p;
        }
        function normalizeText(str) {
            if (!str) return "";
            let s = str.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
            s = s.replace(/╠/g, 'i').replace(/╣/g, 'u').replace(/╔/g, 'e');
            s = s.replace(/[^a-zA-Z\s\-]/g, '');
            return s.trim();
        }

        // =====================================================================
        // INIT UI
        // =====================================================================
        function initUI() {
            updateClSelect();
            if (state.activeCl && state.classes[state.activeCl]) {
                renderEleves();
                renderTeams();
            }
            updateSeancesList();

            db.ref('.info/connected').on('value', snap => {
                document.getElementById('connDot').className = "w-3 h-3 rounded-full " + (snap.val() ? "bg-emerald-500" : "bg-red-500");
                document.getElementById('connLabel').textContent = snap.val() ? "En ligne" : "Hors ligne";
            });
            db.ref('arcathlon/config/mode').on('value', snap => {
                document.getElementById('liveModeBadge').textContent = snap.val() || '--';
            });
            db.ref('arcathlon/live/passages').on('value', snap => {
                updateLiveScores(snap.val() || {});
            });
        }

        // =====================================================================
        // CLASSES
        // =====================================================================
        function updateClSelect() {
            const sel = document.getElementById('selectClasse');
            const current = state.activeCl;
            sel.innerHTML = Object.keys(state.classes).map(c =>
                `<option value="${c}" ${c === current ? 'selected' : ''}>${c}</option>`
            ).join('');
        }
        window.changeClasse = function(val) { state.activeCl = val; saveToLocal(); renderEleves(); renderTeams(); };
        window.addClasse = function() {
            const nom = prompt("Nom de la nouvelle classe ?");
            if (nom && !state.classes[nom]) {
                state.classes[nom] = [];
                state.equipes[nom] = [];
                state.activeCl = nom;
                updateClSelect();
                saveToLocal();
                renderEleves();
                renderTeams();
            }
        };
        window.purgeEleves = function() {
            if (!state.activeCl) return alert("Sélectionnez une classe.");
            if (!confirm(`Supprimer tous les élèves de la classe ${state.activeCl} ?`)) return;
            state.classes[state.activeCl] = [];
            state.equipes[state.activeCl] = [];
            saveToLocal();
            renderEleves();
            renderTeams();
        };
        window.addManualEleve = function() {
            if (!state.activeCl) return alert("Sélectionnez une classe.");
            const prenom = prompt("Prénom ?");
            const nom = prompt("Nom ?");
            const vma = parseFloat(prompt("VMA ?"));
            if (prenom && nom && vma) {
                const id = clePhoto(nom, prenom);
                state.classes[state.activeCl].push({ Nom: nom.toUpperCase(), Prenom: prenom, VMA: vma, idPhoto: id });
                saveToLocal();
                renderEleves();
            }
        };
        window.removeEleve = function(idx) {
            if (!state.activeCl) return;
            state.classes[state.activeCl].splice(idx, 1);
            saveToLocal();
            renderEleves();
        };

        // =====================================================================
        // RENDER ELEVES
        // =====================================================================
        async function renderEleves() {
            const container = document.getElementById('elevesGrid');
            if (!container || !state.activeCl) return;
            const eleves = state.classes[state.activeCl] || [];
            let html = "";
            for (let i = 0; i < eleves.length; i++) {
                const e = eleves[i];
                const url = e.idPhoto ? await getPhotoUrl(e.idPhoto) : null;
                const photoHtml = url ? `<img src="${url}" class="photo-preview">` : `<div class="w-12 h-12 rounded-full bg-slate-700 flex items-center justify-center">👤</div>`;
                html += `
                    <div class="bg-slate-800 rounded-2xl border border-slate-700 p-3 flex flex-col items-center relative">
                        <button onclick="removeEleve(${i})" class="absolute top-2 right-2 text-slate-500 hover:text-red-400 font-bold">&times;</button>
                        ${photoHtml}
                        <p class="font-black text-sm mt-2 text-center leading-tight">${e.Prenom}</p>
                        <p class="text-[9px] text-slate-400 uppercase font-bold">${e.Nom}</p>
                        <span class="mt-2 text-[10px] font-bold text-emerald-400 bg-slate-900 px-2 py-0.5 rounded border border-slate-700">VMA: ${e.VMA}</span>
                    </div>
                `;
            }
            container.innerHTML = html;
        }

        // =====================================================================
        // IMPORT CSV
        // =====================================================================
        document.getElementById('csvFile').addEventListener('change', function(e) {
            if (!state.activeCl) return alert("Sélectionnez une classe.");
            const file = e.target.files[0];
            if (!file) return;
            Papa.parse(file, {
                delimiter: ";", header: false, skipEmptyLines: true,
                complete: function(results) {
                    results.data.forEach(row => {
                        if (!row[0] || row[0].toLowerCase().includes("luc")) return;
                        const parts = row[0].trim().split(" ");
                        const prenom = parts[0];
                        const nom = parts.slice(1).join(" ").toUpperCase();
                        const vma = parseFloat(row[1] ? String(row[1]).replace(",", ".") : 0);
                        if (!vma || !prenom || !nom) return;
                        const cle = clePhoto(nom, prenom);
                        let existing = state.classes[state.activeCl].find(el => clePhoto(el.Nom, el.Prenom) === cle);
                        if (existing) existing.VMA = vma;
                        else state.classes[state.activeCl].push({ Nom: nom, Prenom: prenom, VMA: vma, idPhoto: cle });
                    });
                    saveToLocal();
                    renderEleves();
                    e.target.value = '';
                }
            });
        });

        // =====================================================================
        // IMPORT PHOTOS
        // =====================================================================
        document.getElementById('zipFile').addEventListener('change', function(e) {
            if (!state.activeCl) return alert("Sélectionnez une classe.");
            const file = e.target.files[0];
            if (!file) return;
            JSZip.loadAsync(file).then(function(zip) {
                const promises = [];
                const eleves = state.classes[state.activeCl] || [];
                zip.forEach((relativePath, zipEntry) => {
                    if (!zipEntry.name.match(/\.(jpg|jpeg|png|gif)$/i)) return;
                    promises.push(zipEntry.async('blob').then(blob => {
                        const basename = zipEntry.name.split('/').pop() || '';
                        const match = basename.match(/^_(.+),_(.+)_([MF])\./i);
                        if (!match) { console.warn("Nom non reconnu:", basename); return; }
                        let nomBrut = match[1].trim();
                        let prenomBrut = match[2].trim();
                        const nom = normalizeText(nomBrut);
                        const prenom = normalizeText(prenomBrut);
                        const cle = clePhoto(nom, prenom);
                        let eleve = eleves.find(e => clePhoto(e.Nom, e.Prenom) === cle);
                        if (!eleve) {
                            eleve = eleves.find(e => normalizeText(e.Nom) === nom && normalizeText(e.Prenom) === prenom);
                            if (!eleve) { console.warn("Élève non trouvé:", nom, prenom); return; }
                        }
                        savePhoto(cle, blob);
                        if (!eleve.idPhoto) eleve.idPhoto = cle;
                    }));
                });
                Promise.all(promises).then(() => {
                    alert(`Photos importées (${promises.length} traités)`);
                    saveToLocal();
                    renderEleves();
                });
            }).catch(err => { console.error(err); alert("Erreur ZIP"); });
            e.target.value = '';
        });

        // =====================================================================
        // GENERATE TEAMS (3 coureurs par défaut)
        // =====================================================================
        window.generateTeams = function() {
            if (!state.activeCl) return alert("Sélectionnez une classe.");
            const eleves = state.classes[state.activeCl] || [];
            const nbParEquipe = parseInt(document.getElementById('nbCoureursEquipe').value) || 3;
            if (eleves.length < nbParEquipe) return alert(`Il faut au moins ${nbParEquipe} élèves.`);
            let ordre = [...eleves].sort((a, b) => b.VMA - a.VMA);
            const nbEq = Math.ceil(ordre.length / nbParEquipe);
            let eqList = Array.from({ length: nbEq }, () => ({ membres: [], sumVMA: 0 }));
            ordre.forEach(el => {
                let minIdx = 0, minSum = Infinity;
                eqList.forEach((eq, idx) => {
                    if (eq.membres.length < nbParEquipe && eq.sumVMA < minSum) { minSum = eq.sumVMA; minIdx = idx; }
                });
                eqList[minIdx].membres.push(el);
                eqList[minIdx].sumVMA += el.VMA;
            });
            const couleurs = ['Rouge', 'Jaune', 'Bleu', 'Vert'];
            const styleMap = {
                'Rouge': 'text-red-400 bg-red-950/40 border-red-800',
                'Jaune': 'text-yellow-400 bg-yellow-950/40 border-yellow-800',
                'Bleu': 'text-blue-400 bg-blue-950/40 border-blue-800',
                'Vert': 'text-green-400 bg-green-950/40 border-green-800'
            };
            state.equipes[state.activeCl] = eqList.map((eq, idx) => {
                eq.membres.sort((a, b) => b.VMA - a.VMA);
                return {
                    id: `EQ${idx + 1}`,
                    pin: Math.floor(100 + Math.random() * 900).toString(),
                    sumVMA: eq.sumVMA,
                    membres: eq.membres.map((m, j) => ({
                        prenom: m.Prenom,
                        nom: m.Nom,
                        vma: m.VMA,
                        maillot: couleurs[j % couleurs.length],
                        style: styleMap[couleurs[j % couleurs.length]] || 'bg-slate-800 border-slate-600 text-white',
                        idPhoto: m.idPhoto || clePhoto(m.Nom, m.Prenom),
                        absent: false
                    }))
                };
            });
            saveToLocal();
            renderTeams();
        };

        // =====================================================================
        // RENDER TEAMS
        // =====================================================================
        async function renderTeams() {
            const container = document.getElementById('teamsGrid');
            if (!container || !state.activeCl) return;
            const equipes = state.equipes[state.activeCl] || [];
            container.innerHTML = "";
            for (let eq of equipes) {
                let html = `
                    <div class="bg-slate-900 rounded-2xl border border-slate-800 p-4 flex flex-col" data-team-id="${eq.id}">
                        <div class="flex justify-between items-center mb-3">
                            <h3 class="font-black text-lg text-slate-200">${eq.id}</h3>
                            <span class="text-xs font-bold text-slate-400">PIN: <strong class="text-emerald-400 font-mono">${eq.pin}</strong></span>
                        </div>
                        <div class="team-list flex-1 space-y-2 border border-dashed border-slate-800 rounded-xl p-2">
                `;
                for (let m of eq.membres) {
                    const url = m.idPhoto ? await getPhotoUrl(m.idPhoto) : null;
                    const photo = url ? `<img src="${url}" class="w-8 h-8 rounded-full object-cover">` : `<div class="w-8 h-8 rounded-full bg-slate-700"></div>`;
                    html += `
                        <div class="flex items-center justify-between border border-slate-800 p-2 rounded-lg ${m.style} bg-slate-950">
                            <div class="flex items-center gap-2">
                                ${photo}
                                <div>
                                    <div class="font-bold text-xs text-white">${m.prenom} ${m.nom.charAt(0)}.</div>
                                    <div class="text-[9px] uppercase font-bold tracking-widest text-slate-400">${m.maillot} | VMA ${m.vma}</div>
                                </div>
                            </div>
                            <button onclick="toggleAbsent('${eq.id}','${m.maillot}')" class="text-xs font-bold px-2 py-1 rounded ${m.absent ? 'bg-red-600 text-white' : 'bg-slate-700 text-slate-300'}">
                                ${m.absent ? 'Absent' : 'Présent'}
                            </button>
                        </div>
                    `;
                }
                html += `</div></div>`;
                container.innerHTML += html;
            }
        }

        window.toggleAbsent = function(eqId, maillot) {
            const eq = state.equipes[state.activeCl].find(e => e.id === eqId);
            if (!eq) return;
            const membre = eq.membres.find(m => m.maillot === maillot);
            if (!membre) return;
            membre.absent = !membre.absent;
            saveToLocal();
            renderTeams();
        };

        // =====================================================================
        // PUSH CONFIG
        // =====================================================================
        window.pushConfig = function() {
            if (!state.activeCl || !(state.equipes[state.activeCl] || []).length) {
                return alert("Générez les équipes d'abord.");
            }
            const seanceId = `SEANCE_${Date.now()}`;
            const modeChoisi = document.getElementById('modeEpreuve').value;
            const configObj = {
                seanceId: seanceId,
                mode: modeChoisi,
                longueurPiste: parseInt(document.getElementById('longueurPiste').value) || 400,
                nbTours: parseInt(document.getElementById('nbTours').value) || 3,
                nbSeries: parseInt(document.getElementById('nbSeries').value) || 3,
                nbFleches: parseInt(document.getElementById('nbFleches').value) || 2,
                distanceTotale: (parseInt(document.getElementById('longueurPiste').value) || 400) * (parseInt(document.getElementById('nbTours').value) || 3),
                equipes: {},
                vmaReference: {}
            };
            state.equipes[state.activeCl].forEach(eq => {
                configObj.equipes[eq.id] = {
                    pin: eq.pin,
                    membres: eq.membres.map(m => ({ maillot: m.maillot, vma: m.vma, absent: m.absent || false }))
                };
                eq.membres.forEach(m => {
                    configObj.vmaReference[`${eq.id}-${m.maillot}`] = m.vma;
                });
            });
            if (!state.seances) state.seances = {};
            state.seances[seanceId] = { configObj, date: new Date().toISOString() };
            saveToLocal();
            updateSeancesList();

            db.ref('arcathlon/config').set(configObj)
                .then(() => alert(`🚀 Configuration transmise ! (Mode : ${modeChoisi.toUpperCase()})`))
                .catch(err => { console.error(err); alert("Erreur de transmission."); });
        };

        // =====================================================================
        // LIVE
        // =====================================================================
        function updateLiveScores(passages) {
            const container = document.getElementById('journalPassages');
            const globe = document.getElementById('grosGlobe');
            if (!container) return;
            const entries = Object.entries(passages).sort((a, b) => b[1].timestamp - a[1].timestamp);
            container.innerHTML = entries.slice(0, 20).map(([key, p]) => {
                const h = new Date(p.timestamp).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
                const alerte = p.alerteTriche ? '<span class="alerte-triche">⚠️ Vitesse suspecte</span>' : '';
                return `
                    <div class="flex items-center justify-between text-xs bg-slate-900 border border-slate-800 p-3 rounded-xl shadow-sm">
                        <span class="text-slate-500 font-mono">${h}</span>
                        <span class="font-bold text-slate-200">${p.equipe} — Maillot ${p.maillot}</span>
                        <span class="font-bold text-emerald-400">Course +${p.ptsVMA} | Tir +${p.ptsTir}</span>
                        ${alerte}
                    </div>
                `;
            }).join('');

            const scoresEquipes = {};
            (state.equipes[state.activeCl] || []).forEach(eq => { scoresEquipes[eq.id] = 0; });
            entries.forEach(([key, p]) => {
                if (scoresEquipes[p.equipe] !== undefined) {
                    scoresEquipes[p.equipe] += (p.ptsVMA + p.ptsTir);
                }
            });
            const sorted = Object.entries(scoresEquipes).sort((a, b) => b[1] - a[1]);
            globe.innerHTML = sorted.map(([eqId, score], idx) => `
                <div class="bg-slate-900 p-4 rounded-xl border border-slate-700 flex justify-between items-center">
                    <span class="font-black text-slate-300 text-base">${idx+1}. ${eqId}</span>
                    <span class="text-emerald-400 font-black text-xl">${score} pts</span>
                </div>
            `).join('');
        }

        window.purgeLive = function() {
            if (confirm("Réinitialiser le direct ?")) db.ref('arcathlon/live').remove();
        };

        // =====================================================================
        // STATISTIQUES DÉTAILLÉES
        // =====================================================================
        let statsChart = null;

        window.loadStats = function() {
            db.ref('arcathlon/live/passages').once('value', snap => {
                const passages = snap.val() || {};
                const data = Object.values(passages);
                if (!data.length) { alert("Aucune donnée."); return; }

                // Summary
                const totalLaps = data.length;
                const totalPts = data.reduce((s, p) => s + p.ptsVMA + p.ptsTir, 0);
                const totalTirPts = data.reduce((s, p) => s + p.ptsTir, 0);
                const totalCoursePts = data.reduce((s, p) => s + p.ptsVMA, 0);
                document.getElementById('statsSummary').innerHTML = `
                    <div class="bg-slate-900 p-3 rounded"><span class="text-slate-400">Passages</span><br><span class="text-2xl font-bold">${totalLaps}</span></div>
                    <div class="bg-slate-900 p-3 rounded"><span class="text-slate-400">Total pts</span><br><span class="text-2xl font-bold">${totalPts}</span></div>
                    <div class="bg-slate-900 p-3 rounded"><span class="text-slate-400">Points Tir</span><br><span class="text-2xl font-bold">${totalTirPts}</span></div>
                    <div class="bg-slate-900 p-3 rounded"><span class="text-slate-400">Points Course</span><br><span class="text-2xl font-bold">${totalCoursePts}</span></div>
                `;

                // Table détaillée avec temps et bonus
                const tbody = document.querySelector('#statsDetailTable tbody');
                tbody.innerHTML = data.map(p => {
                    const temps = p.temps ? (p.temps/1000).toFixed(2) : '-';
                    const vitesse = p.vitesse ? p.vitesse.toFixed(1) : '-';
                    const ptsTir = p.ptsTir || 0;
                    // Calcul bonus selon les règles du sprint
                    let bonus = 0;
                    if (ptsTir < 7) bonus = 0;
                    else if (ptsTir < 12) bonus = -10;
                    else if (ptsTir < 16) bonus = -15;
                    else bonus = -20;
                    const tempsBonifie = (temps !== '-') ? (parseFloat(temps) + bonus).toFixed(2) : '-';
                    const alerte = p.alerteTriche ? '⚠️' : '';
                    return `
                        <tr>
                            <td>${p.equipe}</td>
                            <td>${p.maillot}</td>
                            <td>${p.serie || 1}</td>
                            <td>${temps}</td>
                            <td>${vitesse}</td>
                            <td>${p.ptsVMA || 0}</td>
                            <td>${ptsTir}</td>
                            <td>${bonus}</td>
                            <td><strong>${tempsBonifie}</strong></td>
                            <td>${(p.ptsVMA||0) + ptsTir}</td>
                            <td>${alerte}</td>
                        </tr>
                    `;
                }).join('');

                // Chart
                const ctx = document.getElementById('statsChart').getContext('2d');
                if (statsChart) statsChart.destroy();
                const labels = data.map((_, i) => `#${i+1}`);
                const tempsData = data.map(p => p.temps ? p.temps/1000 : 0);
                statsChart = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: labels,
                        datasets: [
                            { label: 'Temps (s)', data: tempsData, backgroundColor: '#4f46e5' },
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: { y: { beginAtZero: true, title: { display: true, text: 'Temps (s)' } } },
                        plugins: { legend: { position: 'top' } }
                    }
                });
            });
        };

        window.exportStatsCSV = function() {
            db.ref('arcathlon/live/passages').once('value', snap => {
                const passages = snap.val() || {};
                const data = Object.values(passages);
                if (!data.length) return alert("Aucune donnée.");
                let csv = "Équipe;Maillot;Série;Temps(s);Vitesse;Pts VMA;Pts Tir;Bonus(s);Temps bonifié(s);Total pts;Alerte\n";
                data.forEach(p => {
                    const temps = p.temps ? (p.temps/1000).toFixed(2) : '-';
                    const vitesse = p.vitesse ? p.vitesse.toFixed(1) : '-';
                    const ptsTir = p.ptsTir || 0;
                    let bonus = 0;
                    if (ptsTir < 7) bonus = 0;
                    else if (ptsTir < 12) bonus = -10;
                    else if (ptsTir < 16) bonus = -15;
                    else bonus = -20;
                    const tempsBonifie = (temps !== '-') ? (parseFloat(temps) + bonus).toFixed(2) : '-';
                    const alerte = p.alerteTriche ? 'Oui' : 'Non';
                    csv += `${p.equipe};${p.maillot};${p.serie||1};${temps};${vitesse};${p.ptsVMA||0};${ptsTir};${bonus};${tempsBonifie};${(p.ptsVMA||0)+ptsTir};${alerte}\n`;
                });
                const blob = new Blob(["\ufeff"+csv], { type: 'text/csv;charset=utf-8;' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = `Arcathlon_stats_${Date.now()}.csv`;
                a.click();
            });
        };

        // =====================================================================
        // HISTORIQUE
        // =====================================================================
        function updateSeancesList() {
            const select = document.getElementById('selectSeance');
            select.innerHTML = '<option value="">-- Sélectionner une séance --</option>' +
                Object.entries(state.seances || {})
                .sort((a, b) => new Date(b[1].date) - new Date(a[1].date))
                .map(([id, s]) => `<option value="${id}">${new Date(s.date).toLocaleString('fr-FR')}</option>`)
                .join('');
        }

        window.loadHistorique = function() {
            const seanceId = document.getElementById('selectSeance').value;
            const filterEq = document.getElementById('filterEquipe').value;
            const container = document.getElementById('historiqueContainer');
            if (!seanceId || !state.seances[seanceId]) {
                container.innerHTML = "<p class='text-slate-500 text-sm'>Sélectionnez une séance.</p>";
                return;
            }
            const data = state.seances[seanceId].configObj;
            let html = `<div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
                <h4 class="font-bold text-blue-400">${seanceId}</h4>
                <p class="text-xs text-slate-400">Mode: ${data.mode} | Séries: ${data.nbSeries} | Flèches: ${data.nbFleches}</p>
                <div class="mt-2 text-xs">
                    <strong>Équipes :</strong>
                    ${Object.keys(data.equipes).map(eqId => {
                        const eq = data.equipes[eqId];
                        const membres = eq.membres.map(m => `${m.maillot} (VMA ${m.vma})`).join(', ');
                        return `<div>${eqId} (PIN ${eq.pin}) : ${membres}</div>`;
                    }).join('')}
                </div>
            </div>`;
            container.innerHTML = html;
        };

        // =====================================================================
        // EXPORT RESULTS (CSV complet)
        // =====================================================================
        window.exportResults = function() {
            db.ref('arcathlon/live/passages').once('value', snap => {
                const passages = snap.val() || {};
                let csv = "Équipe;Maillot;Prénom (Prof);Nom (Prof);Série;Mode;Points Course;Points Tir;Total;Vitesse;Temps total;Temps(s);Bonus(s);Temps bonifié(s);Alerte;Horodatage\n";
                Object.values(passages).forEach(p => {
                    let prenom = "", nom = "";
                    const eqProf = (state.equipes[state.activeCl] || []).find(e => e.id === p.equipe);
                    if (eqProf) {
                        const mProf = eqProf.membres.find(m => m.maillot === p.maillot);
                        if (mProf) { prenom = mProf.prenom; nom = mProf.nom; }
                    }
                    const ptsTir = p.ptsTir || 0;
                    let bonus = 0;
                    if (ptsTir < 7) bonus = 0;
                    else if (ptsTir < 12) bonus = -10;
                    else if (ptsTir < 16) bonus = -15;
                    else bonus = -20;
                    const temps = p.temps ? (p.temps/1000).toFixed(2) : '-';
                    const tempsBonifie = (temps !== '-') ? (parseFloat(temps) + bonus).toFixed(2) : '-';
                    const alerte = p.alerteTriche ? 'Oui' : 'Non';
                    csv += `${p.equipe};${p.maillot};${prenom};${nom};${p.serie};${p.mode};${p.ptsVMA};${p.ptsTir};${p.ptsVMA + p.ptsTir};${p.vitesse ? p.vitesse.toFixed(2) : ''};${p.temps ? (p.temps/1000).toFixed(2) : ''};${temps};${bonus};${tempsBonifie};${alerte};${new Date(p.timestamp).toLocaleString()}\n`;
                });
                const blob = new Blob(["\ufeff"+csv], { type: 'text/csv;charset=utf-8;' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = `Arcathlon_Prof_${state.activeCl}_${Date.now()}.csv`;
                a.click();
            });
        };

        // =====================================================================
        // SAUVEGARDE / RESTAURATION
        // =====================================================================
        window.exportData = function() {
            const blob = new Blob([JSON.stringify(state)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `Arcathlon_Prof_Backup.json`;
            a.click();
        };
        document.getElementById('importDataInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(ev) {
                try { state = JSON.parse(ev.target.result); saveToLocal(); initUI(); alert("Restauré !"); } catch (err) { alert("Fichier invalide."); }
            };
            reader.readAsText(file);
            e.target.value = '';
        });

        // =====================================================================
        // SWITCH TABS
        // =====================================================================
        window.switchTab = function(t) {
            ['viewImport', 'viewEquipes', 'viewLive', 'viewStatistiques', 'viewHistorique'].forEach(id =>
                document.getElementById(id).classList.add('hidden')
            );
            ['btnTab1', 'btnTab2', 'btnTab3', 'btnTab4', 'btnTab5'].forEach(id => {
                document.getElementById(id).classList.remove('tab-active', 'text-blue-500');
                document.getElementById(id).classList.add('text-slate-500');
            });
            const map = { 'import': '1', 'equipes': '2', 'live': '3', 'statistiques': '4', 'historique': '5' };
            document.getElementById('view' + t.charAt(0).toUpperCase() + t.slice(1)).classList.remove('hidden');
            document.getElementById('btnTab' + map[t]).classList.add('tab-active', 'text-blue-500');
            if (t === 'statistiques') loadStats();
        };

        // =====================================================================
        // INIT
        // =====================================================================
        console.log("Arcathlon professeur chargé - Version avec alertes, 3 coureurs, temps bonifié");
    </script>
</body>
</html>
