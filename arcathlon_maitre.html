<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Arcathlon | Maître</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>
    <style>
        img.team-photo {
            width: 40px;
            height: 40px;
            object-fit: cover;
            border-radius: 50%;
        }
    </style>
</head>
<body class="bg-slate-900 text-white p-4 font-sans h-screen flex flex-col">
    <!-- En-tête et interface utilisateur inchangés -->
    <!-- ... -->
    <script>
        // Initialisation Firebase
        const firebaseConfig = {
            databaseURL: "https://arcathlon-eps-default-rtdb.europe-west1.firebasedatabase.app/"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Variables globales
        let equipes = [];
        let configAnonyme = {};
        let eleves = [];
        let photosEleve = {};

        // Basculer entre les modes
        document.getElementById('toggleImportMode').addEventListener('click', function() {
            const importSection = document.querySelector('input[type="file"]#csvFile').parentElement;
            const manualPanel = document.getElementById('manualInputPanel');
            const teamsPanel = document.getElementById('teamsPanel');

            if (manualPanel.classList.contains('hidden')) {
                importSection.classList.add('hidden');
                manualPanel.classList.remove('hidden');
                teamsPanel.classList.add('hidden');
                this.textContent = "📥 Basculer en mode import CSV";
                renderManualVmaTable();
            } else {
                importSection.classList.remove('hidden');
                manualPanel.classList.add('hidden');
                teamsPanel.classList.remove('hidden');
                this.textContent = "🔄 Basculer en mode saisie manuelle";
            }
        });

        // Ajouter un élève au tableau manuel
        document.getElementById('addStudentBtn').addEventListener('click', function() {
            const tbody = document.querySelector('#manualVmaTable tbody');
            const newRow = document.createElement('tr');
            newRow.className = 'border-b border-slate-800';
            newRow.innerHTML = `
                <td class="p-2"><input type="text" class="bg-slate-900 border border-slate-700 rounded px-2 py-1 w-full" placeholder="Prénom"></td>
                <td class="p-2"><input type="text" class="bg-slate-900 border border-slate-700 rounded px-2 py-1 w-full" placeholder="Nom"></td>
                <td class="p-2"><input type="number" class="bg-slate-900 border border-slate-700 rounded px-2 py-1 w-full" placeholder="VMA" step="0.1"></td>
                <td class="p-2"><input type="file" accept="image/*" class="w-full" onchange="handleManualPhoto(this)"></td>
            `;
            tbody.appendChild(newRow);
        });

        // Gérer les photos en saisie manuelle
        function handleManualPhoto(input) {
            const row = input.closest('tr');
            const file = input.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = document.createElement('img');
                    img.src = e.target.result;
                    img.className = "w-10 h-10 rounded-full object-cover mt-1";
                    row.querySelector('td:last-child').innerHTML = '';
                    row.querySelector('td:last-child').appendChild(img);
                };
                reader.readAsDataURL(file);
            }
        }

        // Enregistrer les élèves saisis manuellement
        document.getElementById('saveManualVmaBtn').addEventListener('click', function() {
            eleves = [];
            const rows = document.querySelectorAll('#manualVmaTable tbody tr');
            rows.forEach(row => {
                const inputs = row.querySelectorAll('input[type="text"], input[type="number"]');
                const fileInput = row.querySelector('input[type="file"]');
                const prenom = inputs[0].value.trim();
                const nom = inputs[1].value.trim().toUpperCase(); // Normaliser en majuscules
                const vma = parseFloat(inputs[2].value);

                if (prenom && nom && !isNaN(vma)) {
                    const eleve = {
                        Prenom: prenom,
                        Nom: nom,
                        VMA: vma
                    };

                    // Ajouter la photo si elle a été sélectionnée
                    if (fileInput.files.length > 0) {
                        const reader = new FileReader();
                        reader.onload = function(e) {
                            eleve.photo = e.target.result;
                        };
                        reader.readAsDataURL(fileInput.files[0]);
                    }

                    // Clé simplifiée : uniquement le nom
                    const eleveKey = nom;
                    if (photosEleve[eleveKey]) {
                        eleve.photo = photosEleve[eleveKey];
                    }

                    eleves.push(eleve);
                }
            });

            if (eleves.length > 0) {
                alert(`Données enregistrées pour ${eleves.length} élèves.`);
                generateTeamsFromManualInput();
            } else {
                alert("Aucun élève valide saisi. Vérifiez les données.");
            }
        });

        // Générer les équipes à partir de la saisie manuelle
        function generateTeamsFromManualInput() {
            eleves.sort((a, b) => b.VMA - a.VMA);
            let nbEquipes = Math.floor(eleves.length / 4);
            if (nbEquipes === 0) return alert("Pas assez d'élèves pour faire des équipes de 4.");

            equipes = Array.from({ length: nbEquipes }, (_, i) => ({ id: `EQ${i + 1}`, membres: [], score: 0 }));

            let couleurs = [
                { nom: 'Rouge', style: 'text-red-400 bg-red-950 border-red-800' },
                { nom: 'Jaune', style: 'text-yellow-400 bg-yellow-950 border-yellow-800' },
                { nom: 'Bleu', style: 'text-blue-400 bg-blue-950 border-blue-800' },
                { nom: 'Vert', style: 'text-green-400 bg-green-950 border-green-800' }
            ];

            let eleveIdx = 0;
            couleurs.forEach((c) => {
                for (let i = 0; i < nbEquipes; i++) {
                    if (eleves[eleveIdx]) {
                        let el = eleves[eleveIdx];
                        let nomCourt = el.Nom ? el.Nom.charAt(0).toUpperCase() + "." : "";
                        equipes[i].membres.push({
                            prenom: el.Prenom,
                            nom: nomCourt,
                            vma: el.VMA,
                            maillot: c.nom,
                            style: c.style,
                            scoreIndiv: 0,
                            photo: el.photo
                        });

                        if (!configAnonyme[`EQ${i + 1}`]) configAnonyme[`EQ${i + 1}`] = [];
                        configAnonyme[`EQ${i + 1}`].push({ maillot: c.nom, vma: el.VMA });
                        eleveIdx++;
                    }
                }
                equipes.reverse(); // Serpentin
            });
            renderTeams();
        }

        // Remplir le tableau manuel avec les élèves existants
        function renderManualVmaTable() {
            const tbody = document.querySelector('#manualVmaTable tbody');
            tbody.innerHTML = '';

            if (eleves.length > 0) {
                eleves.forEach(eleve => {
                    const newRow = document.createElement('tr');
                    newRow.className = 'border-b border-slate-800';
                    newRow.innerHTML = `
                        <td class="p-2"><input type="text" class="bg-slate-900 border border-slate-700 rounded px-2 py-1 w-full" value="${eleve.Prenom}"></td>
                        <td class="p-2"><input type="text" class="bg-slate-900 border border-slate-700 rounded px-2 py-1 w-full" value="${eleve.Nom}"></td>
                        <td class="p-2"><input type="number" class="bg-slate-900 border border-slate-700 rounded px-2 py-1 w-full" value="${eleve.VMA}" step="0.1"></td>
                        <td class="p-2">
                            ${eleve.photo ? `<img src="${eleve.photo}" class="w-10 h-10 rounded-full object-cover">` : '<input type="file" accept="image/*" class="w-full" onchange="handleManualPhoto(this)">'}
                        </td>
                    `;
                    tbody.appendChild(newRow);
                });
            }
        }

        // Importer un fichier CSV
        function handleCSV(e) {
            Papa.parse(e.target.files[0], {
                delimiter: ";",
                header: false,
                skipEmptyLines: true,
                complete: function(results) {
                    let data = results.data.slice(1); // Ignorer la première ligne

                    eleves = data.map(row => {
                        if (row.length >= 2) {
                            const nomComplet = row[0].trim().split(" ");
                            const prenom = nomComplet[0];
                            const nom = nomComplet.slice(1).join(" ").toUpperCase(); // Normaliser en majuscules
                            const vma = parseFloat(row[1].trim().replace(",", "."));

                            // Clé simplifiée : uniquement le nom
                            const eleveKey = nom;
                            const photo = photosEleve[eleveKey] || "";

                            return { Nom: nom, Prenom: prenom, VMA: vma, photo: photo };
                        }
                        return null;
                    }).filter(eleve => eleve !== null);

                    console.log("Élèves importés :", eleves.map(e => `${e.Nom}, ${e.Prenom}, VMA: ${e.VMA}`));

                    // Générer les équipes
                    eleves.sort((a, b) => b.VMA - a.VMA);
                    let nbEquipes = Math.floor(eleves.length / 4);
                    if (nbEquipes === 0) return alert("Pas assez d'élèves pour faire des équipes de 4.");

                    equipes = Array.from({ length: nbEquipes }, (_, i) => ({ id: `EQ${i + 1}`, membres: [], score: 0 }));

                    let couleurs = [
                        { nom: 'Rouge', style: 'text-red-400 bg-red-950 border-red-800' },
                        { nom: 'Jaune', style: 'text-yellow-400 bg-yellow-950 border-yellow-800' },
                        { nom: 'Bleu', style: 'text-blue-400 bg-blue-950 border-blue-800' },
                        { nom: 'Vert', style: 'text-green-400 bg-green-950 border-green-800' }
                    ];

                    let eleveIdx = 0;
                    couleurs.forEach((c) => {
                        for (let i = 0; i < nbEquipes; i++) {
                            if (eleves[eleveIdx]) {
                                let el = eleves[eleveIdx];
                                let nomCourt = el.Nom ? el.Nom.charAt(0).toUpperCase() + "." : "";
                                equipes[i].membres.push({
                                    prenom: el.Prenom,
                                    nom: nomCourt,
                                    vma: el.VMA,
                                    maillot: c.nom,
                                    style: c.style,
                                    scoreIndiv: 0,
                                    photo: el.photo
                                });

                                if (!configAnonyme[`EQ${i + 1}`]) configAnonyme[`EQ${i + 1}`] = [];
                                configAnonyme[`EQ${i + 1}`].push({ maillot: c.nom, vma: el.VMA });
                                eleveIdx++;
                            }
                        }
                        equipes.reverse(); // Serpentin
                    });

                    renderTeams();
                }
            });
        }

        // Importer un fichier ZIP de photos
        async function handleZIP(e) {
            const file = e.target.files[0];
            if (!file) {
                alert("Aucun fichier sélectionné.");
                return;
            }

            try {
                console.log("Début de l'import du ZIP...");
                const zip = await JSZip.loadAsync(file);
                const files = Object.keys(zip.files);
                console.log("Fichiers dans le ZIP :", files);

                let photosCount = 0;
                for (const filename of files) {
                    if (!filename.endsWith('/')) {
                        // Regex adaptée au format "_NOM,_Prénom_Sexe.jpg"
                        const match = filename.match(/^_([^,]+),_[^_]+_([FM])\.jpg$/i);
                        if (match) {
                            const nom = match[1].trim().toUpperCase(); // Ex: "DOREZ-JACQUIN"
                            console.log(`Trouvé : ${nom} (fichier : ${filename})`);

                            const fileData = await zip.files[filename].async('blob');
                            const photoURL = URL.createObjectURL(fileData);
                            photosEleve[nom] = photoURL; // Clé simplifiée : uniquement le nom
                            photosCount++;
                        } else {
                            console.warn(`Fichier ignoré (format invalide) : ${filename}`);
                        }
                    }
                }

                console.log(`Photos importées : ${photosCount}`, photosEleve);
                alert(`Photos importées avec succès pour ${photosCount} élèves.`);

                // Réassocier les photos aux élèves déjà importés
                if (eleves.length > 0) {
                    eleves.forEach(eleve => {
                        const eleveKey = eleve.Nom.toUpperCase(); // Clé simplifiée : uniquement le nom
                        if (photosEleve[eleveKey]) {
                            eleve.photo = photosEleve[eleveKey];
                        }
                    });
                    renderTeams();
                }
            } catch (error) {
                console.error("Erreur lors de l'import du ZIP :", error);
                alert(`Erreur : ${error.message}. Vérifiez le fichier ZIP.`);
            }
        }

        // Afficher les équipes
        function renderTeams() {
            document.getElementById('teamsList').innerHTML = equipes.map(eq => `
                <div class="bg-slate-900 p-4 rounded-2xl border-2 border-slate-700 shadow-lg">
                    <div class="font-black text-xl mb-3 text-slate-300">ÉQUIPE ${eq.id}</div>
                    <div class="space-y-2">
                        ${eq.membres.map(m => {
                            let photoSrc = m.photo ? m.photo : "";
                            return `
                                <div class="text-sm flex items-center gap-2 border border-slate-800 p-2 rounded-lg ${m.style}">
                                    ${photoSrc ? `<img src="${photoSrc}" class="team-photo">` : '<div class="team-photo bg-slate-700"></div>'}
                                    <span class="font-black uppercase">${m.maillot}</span>
                                    <span class="font-bold text-white">${m.prenom} ${m.nom} <span class="text-xs text-slate-400 ml-1">(VMA: ${m.vma})</span></span>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `).join('');
        }

        // Envoyer la configuration aux iPads
        function pushConfig() {
            if (Object.keys(configAnonyme).length === 0) return alert("Importez d'abord le CSV ou saisissez les élèves !");
            db.ref('arcathlon/config/equipes').set(configAnonyme);
            alert("Configuration envoyée avec succès aux iPads élèves !");
        }

        // Purger les données live
        function purgeLive() {
            if (confirm("Effacer toutes les performances enregistrées ?")) {
                db.ref('arcathlon/live').remove();
            }
        }

        // Écouter les mises à jour des scores
        db.ref('arcathlon/live/passages').on('value', snap => {
            const passages = snap.val() || {};
            equipes.forEach(eq => { eq.score = 0; eq.membres.forEach(m => m.scoreIndiv = 0); });

            Object.values(passages).forEach(p => {
                let eq = equipes.find(e => e.id === p.equipe);
                if (eq) {
                    let membre = eq.membres.find(m => m.maillot === p.maillot);
                    if (membre) {
                        let pts = (p.ptsVMA || 0) + (p.ptsTir || 0);
                        membre.scoreIndiv += pts;
                        eq.score += pts;
                    }
                }
            });
            updateScoresLocally();
        });

        // Mettre à jour les scores localement
        function updateScoresLocally() {
            let eqTriees = [...equipes].sort((a, b) => b.score - a.score);
            document.getElementById('grosGlobe').innerHTML = eqTriees.map((eq, idx) => `
                <div class="bg-slate-900 p-4 rounded-xl border border-slate-700 flex justify-between items-center shadow-md">
                    <span class="font-black text-lg text-slate-300">${idx + 1}. ${eq.id}</span>
                    <span class="text-emerald-400 font-black text-2xl">${eq.score} <span class="text-xs text-slate-500">pts</span></span>
                </div>
            `).join('');

            ['Vert', 'Bleu', 'Jaune', 'Rouge'].forEach(c => {
                let joueurs = [];
                equipes.forEach(eq => {
                    let j = eq.membres.find(m => m.maillot === c);
                    if (j) joueurs.push({ prenom: j.prenom, nom: j.nom, eq: eq.id, score: j.scoreIndiv });
                });
                joueurs.sort((a, b) => b.score - a.score);

                let textColor = c === 'Vert' ? 'text-green-400' : c === 'Bleu' ? 'text-blue-400' : c === 'Jaune' ? 'text-yellow-400' : 'text-red-400';

                document.getElementById('globe' + c).innerHTML = `<h4 class="font-black text-center mb-4 uppercase ${textColor} tracking-widest text-lg">${c}</h4>` +
                    joueurs.map((j, idx) => `
                        <div class="text-sm flex justify-between items-center border-b border-black/30 py-2">
                            <span class="font-bold text-slate-300">${idx + 1}. ${j.prenom} <span class="text-[10px] text-slate-500 ml-1">(${j.eq})</span></span>
                            <span class="font-black ${textColor}">${j.score}</span>
                        </div>
                    `).join('');
            });
        }
    </script>
</body>
</html>
