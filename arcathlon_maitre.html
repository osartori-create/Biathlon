<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Arcathlon | Maître</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <style>
        img.team-photo {
            width: 40px;
            height: 40px;
            object-fit: cover;
            border-radius: 50%;
        }
        .team-container {
            min-height: 100px;
            border: 2px dashed #4b5563;
            border-radius: 10px;
            padding: 10px;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body class="bg-slate-900 text-white p-4 font-sans h-screen flex flex-col">
    <header class="flex justify-between items-center mb-6 border-b border-slate-700 pb-4 shrink-0">
        <h1 class="text-2xl font-black text-blue-500 uppercase tracking-widest">Arcathlon | Maître</h1>
        <div class="flex gap-2">
            <button id="purgeLiveBtn" class="bg-red-900/50 text-red-400 border border-red-800 px-4 py-2 rounded-lg font-bold text-xs hover:bg-red-800">⚠️ Purger Live</button>
            <label class="bg-emerald-600 px-4 py-2 rounded-lg font-bold text-xs cursor-pointer hover:bg-emerald-500 border border-emerald-500">
                📥 Import CSV (iDoceo)
                <input type="file" id="csvFile" accept=".csv" class="hidden">
            </label>
            <label class="bg-indigo-600 px-4 py-2 rounded-lg font-bold text-xs cursor-pointer hover:bg-indigo-500 border border-indigo-500">
                📸 Importer photos (ZIP iDoceo)
                <input type="file" id="zipFile" accept=".zip" class="hidden">
            </label>
            <button id="toggleImportMode" class="bg-purple-600 px-4 py-2 rounded-lg font-bold text-xs hover:bg-purple-500 border border-purple-500">
                🔄 Basculer en mode saisie manuelle
            </button>
            <button id="generateTeamsBtn" class="bg-orange-600 px-4 py-2 rounded-lg font-bold text-xs hover:bg-orange-500 border border-orange-500">
                🔄 Générer les équipes
            </button>
            <button id="pushConfigBtn" class="bg-blue-600 px-4 py-2 rounded-lg font-bold text-xs hover:bg-blue-500 border border-blue-500">🚀 Envoyer aux iPads</button>
        </div>
    </header>

    <div class="grid grid-cols-1 gap-6 flex-1 overflow-hidden">
        <!-- Panneau de saisie manuelle -->
        <div id="manualInputPanel" class="bg-slate-800 p-4 rounded-3xl border-2 border-slate-700 flex flex-col h-full overflow-hidden hidden">
            <h2 class="font-black text-purple-400 mb-4 uppercase shrink-0">Saisie Manuelle des Élèves</h2>
            <div class="flex flex-col gap-3 overflow-y-auto pr-2 pb-4">
                <table id="manualVmaTable" class="w-full text-sm">
                    <thead>
                        <tr class="border-b border-slate-700">
                            <th class="p-2 text-left font-bold text-slate-300">Prénom</th>
                            <th class="p-2 text-left font-bold text-slate-300">Nom</th>
                            <th class="p-2 text-left font-bold text-slate-300">VMA (km/h)</th>
                            <th class="p-2 text-left font-bold text-slate-300">Photo</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Les lignes seront ajoutées dynamiquement -->
                    </tbody>
                </table>
            </div>
            <div class="mt-4 flex gap-2">
                <button id="addStudentBtn" class="bg-blue-600 px-4 py-2 rounded-lg font-bold text-xs hover:bg-blue-500 border border-blue-500">
                    ✚ Ajouter un élève
                </button>
                <button id="saveManualVmaBtn" class="bg-green-600 px-4 py-2 rounded-lg font-bold text-xs hover:bg-green-500 border border-green-500">
                    ✓ Enregistrer les élèves
                </button>
            </div>
        </div>

        <!-- Équipes -->
        <div id="teamsPanel" class="bg-slate-800 p-4 rounded-3xl border-2 border-slate-700 flex flex-col h-full overflow-hidden">
            <h2 class="font-black text-emerald-400 mb-4 uppercase shrink-0">Équipes</h2>
            <div id="teamsContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 overflow-y-auto pr-2 pb-4"></div>
            <div class="mt-4 flex gap-2">
                <button id="editTeamsBtn" class="bg-yellow-600 px-4 py-2 rounded-lg font-bold text-xs hover:bg-yellow-500 border border-yellow-500 hidden">
                    ✏️ Modifier les équipes
                </button>
                <button id="saveTeamsBtn" class="bg-green-600 px-4 py-2 rounded-lg font-bold text-xs hover:bg-green-500 border border-green-500 hidden">
                    ✓ Sauvegarder les équipes
                </button>
            </div>
        </div>
    </div>

    <!-- Live & Globes -->
    <div class="bg-slate-800 p-6 rounded-3xl border-2 border-slate-700 flex flex-col h-full overflow-hidden mt-6">
        <h2 class="font-black text-amber-400 mb-6 uppercase shrink-0 text-xl">🏆 Live Score & Classements</h2>
        <div class="flex-1 overflow-y-auto pr-2 pb-4">
            <h3 class="font-bold text-slate-300 border-b border-slate-600 pb-2 mb-4 uppercase tracking-widest">Gros Globe (Par Équipe)</h3>
            <div id="grosGlobe" class="grid grid-cols-2 gap-3 mb-8"></div>
            <h3 class="font-bold text-slate-300 border-b border-slate-600 pb-2 mb-4 uppercase tracking-widest">Petits Globes (Individuel par Maillot)</h3>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <div id="globeVert" class="bg-green-900/30 p-3 rounded-2xl border-2 border-green-800/50"></div>
                <div id="globeBleu" class="bg-blue-900/30 p-3 rounded-2xl border-2 border-blue-800/50"></div>
                <div id="globeJaune" class="bg-yellow-900/30 p-3 rounded-2xl border-2 border-yellow-800/50"></div>
                <div id="globeRouge" class="bg-red-900/30 p-3 rounded-2xl border-2 border-red-800/50"></div>
            </div>
        </div>
    </div>

    <script>
        // Variables globales
        let equipes = [];
        let configAnonyme = {};
        let eleves = [];
        let photosEleve = {};
        let isEditingTeams = false;

        document.addEventListener('DOMContentLoaded', function() {
            // Initialisation Firebase
            const firebaseConfig = {
                databaseURL: "https://arcathlon-eps-default-rtdb.europe-west1.firebasedatabase.app/"
            };
            firebase.initializeApp(firebaseConfig);
            const db = firebase.database();

            // Définir les fonctions globales
            window.purgeLive = function() {
                if (confirm("Effacer toutes les performances enregistrées ?")) {
                    db.ref('arcathlon/live').remove();
                }
            };

            window.pushConfig = function() {
                if (Object.keys(configAnonyme).length === 0) {
                    alert("Générez d'abord les équipes !");
                    return;
                }
                db.ref('arcathlon/config/equipes').set(configAnonyme)
                    .then(() => alert("Configuration envoyée avec succès aux iPads élèves !"))
                    .catch(err => alert("Erreur d'envoi : " + err.message));
            };

            // Basculer entre les modes
            document.getElementById('toggleImportMode').addEventListener('click', function() {
                const manualPanel = document.getElementById('manualInputPanel');
                const teamsPanel = document.getElementById('teamsPanel');

                if (manualPanel.classList.contains('hidden')) {
                    manualPanel.classList.remove('hidden');
                    teamsPanel.classList.add('hidden');
                    this.textContent = "📥 Basculer en mode import";
                    renderManualVmaTable();
                } else {
                    manualPanel.classList.add('hidden');
                    teamsPanel.classList.remove('hidden');
                    this.textContent = "🔄 Basculer en mode saisie manuelle";
                }
            });

            // Ajouter un élève au tableau manuel
            document.getElementById('addStudentBtn').addEventListener('click', function() {
                const tbody = document.querySelector('#manualVmaTable tbody');
                const newRow = document.createElement('tr');
                newRow.className = 'border-b border-slate-800';
                newRow.innerHTML = `
                    <td class="p-2"><input type="text" class="bg-slate-900 border border-slate-700 rounded px-2 py-1 w-full" placeholder="Prénom"></td>
                    <td class="p-2"><input type="text" class="bg-slate-900 border border-slate-700 rounded px-2 py-1 w-full" placeholder="Nom"></td>
                    <td class="p-2"><input type="number" class="bg-slate-900 border border-slate-700 rounded px-2 py-1 w-full" placeholder="VMA" step="0.1"></td>
                    <td class="p-2"><input type="file" accept="image/*" class="w-full" onchange="handleManualPhoto(this)"></td>
                `;
                tbody.appendChild(newRow);
            });

            // Gérer les photos en saisie manuelle
            window.handleManualPhoto = function(input) {
                const row = input.closest('tr');
                const file = input.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        const img = document.createElement('img');
                        img.src = e.target.result;
                        img.className = "w-10 h-10 rounded-full object-cover mt-1";
                        row.querySelector('td:last-child').innerHTML = '';
                        row.querySelector('td:last-child').appendChild(img);
                    };
                    reader.readAsDataURL(file);
                }
            };

            // Remplir le tableau manuel avec les élèves existants
            function renderManualVmaTable() {
                const tbody = document.querySelector('#manualVmaTable tbody');
                tbody.innerHTML = '';

                if (eleves.length > 0) {
                    eleves.forEach(eleve => {
                        const newRow = document.createElement('tr');
                        newRow.className = 'border-b border-slate-800';
                        newRow.innerHTML = `
                            <td class="p-2"><input type="text" class="bg-slate-900 border border-slate-700 rounded px-2 py-1 w-full" value="${eleve.Prenom}"></td>
                            <td class="p-2"><input type="text" class="bg-slate-900 border border-slate-700 rounded px-2 py-1 w-full" value="${eleve.Nom}"></td>
                            <td class="p-2"><input type="number" class="bg-slate-900 border border-slate-700 rounded px-2 py-1 w-full" value="${eleve.VMA}" step="0.1"></td>
                            <td class="p-2">
                                ${eleve.photo ? `<img src="${eleve.photo}" class="w-10 h-10 rounded-full object-cover">` : '<input type="file" accept="image/*" class="w-full" onchange="handleManualPhoto(this)">'}
                            </td>
                        `;
                        tbody.appendChild(newRow);
                    });
                } else {
                    // Ajouter une ligne vide si aucun élève n'est présent
                    const newRow = document.createElement('tr');
                    newRow.className = 'border-b border-slate-800';
                    newRow.innerHTML = `
                        <td class="p-2"><input type="text" class="bg-slate-900 border border-slate-700 rounded px-2 py-1 w-full" placeholder="Prénom"></td>
                        <td class="p-2"><input type="text" class="bg-slate-900 border border-slate-700 rounded px-2 py-1 w-full" placeholder="Nom"></td>
                        <td class="p-2"><input type="number" class="bg-slate-900 border border-slate-700 rounded px-2 py-1 w-full" placeholder="VMA" step="0.1"></td>
                        <td class="p-2"><input type="file" accept="image/*" class="w-full" onchange="handleManualPhoto(this)"></td>
                    `;
                    tbody.appendChild(newRow);
                }
            }

            // Enregistrer les élèves saisis manuellement
            document.getElementById('saveManualVmaBtn').addEventListener('click', function() {
                eleves = [];
                const rows = document.querySelectorAll('#manualVmaTable tbody tr');
                rows.forEach(row => {
                    const inputs = row.querySelectorAll('input[type="text"], input[type="number"]');
                    const fileInput = row.querySelector('input[type="file"]');
                    const prenom = inputs[0].value.trim();
                    const nom = inputs[1].value.trim().toUpperCase();
                    const vma = parseFloat(inputs[2].value);

                    if (prenom && nom && !isNaN(vma)) {
                        const eleve = {
                            Prenom: prenom,
                            Nom: nom,
                            VMA: vma
                        };

                        if (fileInput && fileInput.files.length > 0) {
                            const reader = new FileReader();
                            reader.onload = function(e) {
                                eleve.photo = e.target.result;
                            };
                            reader.readAsDataURL(fileInput.files[0]);
                        }

                        const eleveKey = nom;
                        if (photosEleve[eleveKey]) {
                            eleve.photo = photosEleve[eleveKey];
                        }

                        eleves.push(eleve);
                    }
                });

                if (eleves.length > 0) {
                    alert(`Données enregistrées pour ${eleves.length} élèves.`);
                    generateTeams(); // Appel explicite pour générer les équipes
                } else {
                    alert("Aucun élève valide saisi. Vérifiez les données.");
                }
            });

            // Importer un fichier CSV
            document.getElementById('csvFile').addEventListener('change', handleCSV);

            function handleCSV(e) {
                Papa.parse(e.target.files[0], {
                    delimiter: ";",
                    header: false,
                    skipEmptyLines: true,
                    complete: function(results) {
                        let data = results.data;

                        // Filtrer les lignes vides ou invalides
                        data = data.filter(row => {
                            if (row.length < 2) return false;
                            const nomComplet = row[0].trim();
                            const vma = row[1].trim();
                            return nomComplet !== "" && !isNaN(parseFloat(vma.replace(",", ".")));
                        });

                        // Ignorer la première ligne (en-têtes)
                        data = data.slice(1);

                        eleves = data.map(row => {
                            const nomComplet = row[0].trim().split(" ");
                            const prenom = nomComplet[0];
                            const nom = nomComplet.slice(1).join(" ").toUpperCase();
                            const vma = parseFloat(row[1].trim().replace(",", "."));

                            const eleveKey = nom;
                            const photo = photosEleve[eleveKey] || "";

                            return { Nom: nom, Prenom: prenom, VMA: vma, photo: photo };
                        });

                        console.log("Élèves importés :", eleves.map(e => `${e.Nom}, ${e.Prenom}, VMA: ${e.VMA}`));
                        generateTeams(); // Appel explicite pour générer les équipes
                    }
                });
            }

            // Importer un fichier ZIP de photos
            document.getElementById('zipFile').addEventListener('change', handleZIP);

            window.handleZIP = async function(e) {
                const file = e.target.files[0];
                if (!file) {
                    alert("Aucun fichier sélectionné.");
                    return;
                }

                try {
                    console.log("Début de l'import du ZIP...");
                    const zip = await JSZip.loadAsync(file);
                    const files = Object.keys(zip.files);
                    console.log("Fichiers dans le ZIP :", files);

                    let photosCount = 0;
                    for (const filename of files) {
                        if (!filename.endsWith('/')) {
                            const match = filename.match(/^_([^,]+),_[^_]+_([FM])\.jpg$/i);
                            if (match) {
                                const nom = match[1].trim().toUpperCase();
                                console.log(`Trouvé : ${nom} (fichier : ${filename})`);

                                const fileData = await zip.files[filename].async('blob');
                                const photoURL = URL.createObjectURL(fileData);
                                photosEleve[nom] = photoURL;
                                photosCount++;
                            } else {
                                console.warn(`Fichier ignoré (format invalide) : ${filename}`);
                            }
                        }
                    }

                    console.log(`Photos importées : ${photosCount}`, photosEleve);
                    alert(`Photos importées avec succès pour ${photosCount} élèves.`);

                    if (eleves.length > 0) {
                        eleves.forEach(eleve => {
                            const eleveKey = eleve.Nom.toUpperCase();
                            if (photosEleve[eleveKey]) {
                                eleve.photo = photosEleve[eleveKey];
                            }
                        });
                        if (!document.getElementById('manualInputPanel').classList.contains('hidden')) {
                            renderManualVmaTable();
                        } else {
                            generateTeams(); // Appel explicite pour générer les équipes
                        }
                    }
                } catch (error) {
                    console.error("Erreur lors de l'import du ZIP :", error);
                    alert(`Erreur : ${error.message}. Vérifiez le fichier ZIP.`);
                }
            };

            // Générer les équipes avec équilibrage des VMA
            window.generateTeams = function() {
                // Filtrer les élèves avec VMA valide
                eleves = eleves.filter(eleve => eleve && !isNaN(eleve.VMA));

                if (eleves.length === 0) {
                    alert("Aucun élève avec une VMA valide.");
                    return;
                }

                // Tri des élèves par VMA décroissante
                eleves.sort((a, b) => b.VMA - a.VMA);

                // Calcul du nombre d'équipes
                const nbEquipes = Math.floor(eleves.length / 4);
                if (nbEquipes === 0) {
                    alert("Pas assez d'élèves pour former des équipes de 4.");
                    return;
                }

                // Initialisation des équipes
                equipes = Array.from({ length: nbEquipes }, (_, i) => ({
                    id: `EQ${i + 1}`,
                    membres: [],
                    score: 0,
                    sumVMA: 0
                }));

                // Algorithme d'équilibrage des VMA
                for (let i = 0; i < nbEquipes * 4 && i < eleves.length; i++) {
                    const equipeIndex = i % nbEquipes;
                    const eleve = eleves[i];
                    equipes[equipeIndex].membres.push({
                        prenom: eleve.Prenom,
                        nom: eleve.Nom.charAt(0) + ".",
                        vma: eleve.VMA,
                        maillot: "",
                        style: "",
                        scoreIndiv: 0,
                        photo: eleve.photo
                    });
                    equipes[equipeIndex].sumVMA += eleve.VMA;
                }

                // Attribution des couleurs de maillots
                const couleurs = [
                    { nom: 'Rouge', style: 'text-red-400 bg-red-950 border-red-800' },
                    { nom: 'Jaune', style: 'text-yellow-400 bg-yellow-950 border-yellow-800' },
                    { nom: 'Bleu', style: 'text-blue-400 bg-blue-950 border-blue-800' },
                    { nom: 'Vert', style: 'text-green-400 bg-green-950 border-green-800' }
                ];

                // Attribution des couleurs en serpentin pour favoriser la mixité
                for (let i = 0; i < nbEquipes; i++) {
                    for (let j = 0; j < 4; j++) {
                        if (equipes[i] && equipes[i].membres[j]) {
                            const couleurIndex = (i * 4 + j) % 4;
                            equipes[i].membres[j].maillot = couleurs[couleurIndex].nom;
                            equipes[i].membres[j].style = couleurs[couleurIndex].style;
                        }
                    }
                }

                // Mise à jour de la configuration anonyme pour Firebase
                configAnonyme = {};
                equipes.forEach((eq, eqIndex) => {
                    configAnonyme[eq.id] = eq.membres.map(m => ({
                        maillot: m.maillot,
                        vma: m.vma
                    }));
                });

                renderTeams(); // Appel explicite pour afficher les équipes
            };

            // Afficher les équipes
            function renderTeams() {
                const teamsContainer = document.getElementById('teamsContainer');
                teamsContainer.innerHTML = '';

                if (isEditingTeams) {
                    document.getElementById('editTeamsBtn').classList.add('hidden');
                    document.getElementById('saveTeamsBtn').classList.remove('hidden');
                } else {
                    document.getElementById('editTeamsBtn').classList.remove('hidden');
                    document.getElementById('saveTeamsBtn').classList.add('hidden');
                }

                if (equipes.length === 0) {
                    teamsContainer.innerHTML = '<p class="text-slate-500 text-center py-8">Aucune équipe générée. Importez d\'abord un fichier CSV ou ajoutez des élèves manuellement.</p>';
                    return;
                }

                equipes.forEach(eq => {
                    const teamDiv = document.createElement('div');
                    teamDiv.className = 'bg-slate-900 p-4 rounded-2xl border-2 border-slate-700 shadow-lg';
                    teamDiv.id = `team-${eq.id}`;

                    const teamHeader = document.createElement('div');
                    teamHeader.className = 'font-black text-xl mb-3 text-slate-300 flex justify-between items-center';
                    teamHeader.innerHTML = `
                        <span>ÉQUIPE ${eq.id}</span>
                        <span class="text-emerald-400 font-black">${eq.sumVMA.toFixed(1)} <span class="text-xs text-slate-500">VMA</span></span>
                    `;
                    teamDiv.appendChild(teamHeader);

                    const membersDiv = document.createElement('div');
                    membersDiv.className = 'space-y-2';

                    eq.membres.forEach((m, index) => {
                        const memberDiv = document.createElement('div');
                        memberDiv.className = `text-sm flex items-center gap-2 border border-slate-800 p-2 rounded-lg ${m.style} ${isEditingTeams ? 'draggable' : ''}`;
                        memberDiv.draggable = isEditingTeams;
                        memberDiv.dataset.teamId = eq.id;
                        memberDiv.dataset.memberIndex = index;

                        if (isEditingTeams) {
                            memberDiv.addEventListener('dragstart', handleDragStart);
                        }

                        memberDiv.innerHTML = `
                            ${m.photo ? `<img src="${m.photo}" class="team-photo">` : '<div class="team-photo bg-slate-700"></div>'}
                            <span class="font-black uppercase">${m.maillot}</span>
                            <span class="font-bold text-white">${m.prenom} ${m.nom} <span class="text-xs text-slate-400 ml-1">(VMA: ${m.vma})</span></span>
                        `;
                        membersDiv.appendChild(memberDiv);
                    });

                    if (isEditingTeams) {
                        const dropZone = document.createElement('div');
                        dropZone.className = 'border-2 border-dashed border-slate-700 p-2 mt-2 rounded-lg text-center text-slate-500';
                        dropZone.textContent = 'Déposer ici';
                        dropZone.dataset.teamId = eq.id;
                        dropZone.addEventListener('dragover', handleDragOver);
                        dropZone.addEventListener('drop', handleDrop);
                        membersDiv.appendChild(dropZone);
                    }

                    teamDiv.appendChild(membersDiv);
                    teamsContainer.appendChild(teamDiv);
                });

                // Activer le bouton de modification des équipes si des équipes existent
                if (equipes.length > 0) {
                    document.getElementById('editTeamsBtn').classList.remove('hidden');
                }
            }

            // Activer le mode édition des équipes
            document.getElementById('editTeamsBtn').addEventListener('click', function() {
                isEditingTeams = true;
                renderTeams();
            });

            // Sauvegarder les équipes modifiées
            document.getElementById('saveTeamsBtn').addEventListener('click', function() {
                isEditingTeams = false;
                renderTeams();
                alert("Modifications sauvegardées.");
            });

            // Gérer le drag and drop pour réorganiser les équipes
            let draggedMember = null;
            let draggedFromTeam = null;
            let draggedMemberIndex = null;

            function handleDragStart(e) {
                const teamId = this.dataset.teamId;
                const memberIndex = this.dataset.memberIndex;
                draggedMember = equipes.find(eq => eq.id === teamId).membres[memberIndex];
                draggedFromTeam = teamId;
                draggedMemberIndex = memberIndex;
                e.dataTransfer.setData('text/plain', 'drag-member');
            }

            function handleDragOver(e) {
                e.preventDefault();
            }

            function handleDrop(e) {
                e.preventDefault();
                const targetTeamId = this.dataset.teamId;

                if (draggedMember && targetTeamId) {
                    // Retirer le membre de l'équipe d'origine
                    const fromTeam = equipes.find(eq => eq.id === draggedFromTeam);
                    fromTeam.membres.splice(draggedMemberIndex, 1);
                    fromTeam.sumVMA -= draggedMember.vma;

                    // Ajouter le membre à la nouvelle équipe
                    const toTeam = equipes.find(eq => eq.id === targetTeamId);
                    toTeam.membres.push(draggedMember);
                    toTeam.sumVMA += draggedMember.vma;

                    // Réattribuer les couleurs pour maintenir l'équilibre
                    reassignColors();

                    renderTeams();
                }
            }

            // Réattribuer les couleurs pour maintenir l'équilibre
            function reassignColors() {
                const couleurs = [
                    { nom: 'Rouge', style: 'text-red-400 bg-red-950 border-red-800' },
                    { nom: 'Jaune', style: 'text-yellow-400 bg-yellow-950 border-yellow-800' },
                    { nom: 'Bleu', style: 'text-blue-400 bg-blue-950 border-blue-800' },
                    { nom: 'Vert', style: 'text-green-400 bg-green-950 border-green-800' }
                ];

                equipes.forEach((eq, eqIndex) => {
                    eq.membres.forEach((membre, membreIndex) => {
                        const couleurIndex = (eqIndex * 4 + membreIndex) % 4;
                        membre.maillot = couleurs[couleurIndex].nom;
                        membre.style = couleurs[couleurIndex].style;
                    });
                });
            }

            // Bouton pour générer les équipes
            document.getElementById('generateTeamsBtn').addEventListener('click', generateTeams);

            // Écouter les mises à jour des scores
            db.ref('arcathlon/live/passages').on('value', snap => {
                const passages = snap.val() || {};
                equipes.forEach(eq => { eq.score = 0; eq.membres.forEach(m => m.scoreIndiv = 0); });

                Object.values(passages).forEach(p => {
                    let eq = equipes.find(e => e.id === p.equipe);
                    if (eq) {
                        let membre = eq.membres.find(m => m.maillot === p.maillot);
                        if (membre) {
                            let pts = (p.ptsVMA || 0) + (p.ptsTir || 0);
                            membre.scoreIndiv += pts;
                            eq.score += pts;
                        }
                    }
                });
                updateScoresLocally();
            });

            // Mettre à jour les scores localement
            function updateScoresLocally() {
                let eqTriees = [...equipes].sort((a, b) => b.score - a.score);
                document.getElementById('grosGlobe').innerHTML = eqTriees.map((eq, idx) => `
                    <div class="bg-slate-900 p-4 rounded-xl border border-slate-700 flex justify-between items-center shadow-md">
                        <span class="font-black text-lg text-slate-300">${idx + 1}. ${eq.id}</span>
                        <span class="text-emerald-400 font-black text-2xl">${eq.score} <span class="text-xs text-slate-500">pts</span></span>
                    </div>
                `).join('');

                ['Vert', 'Bleu', 'Jaune', 'Rouge'].forEach(c => {
                    let joueurs = [];
                    equipes.forEach(eq => {
                        let j = eq.membres.find(m => m.maillot === c);
                        if (j) joueurs.push({ prenom: j.prenom, nom: j.nom, eq: eq.id, score: j.scoreIndiv });
                    });
                    joueurs.sort((a, b) => b.score - a.score);

                    let textColor = c === 'Vert' ? 'text-green-400' : c === 'Bleu' ? 'text-blue-400' : c === 'Jaune' ? 'text-yellow-400' : 'text-red-400';

                    document.getElementById('globe' + c).innerHTML = `<h4 class="font-black text-center mb-4 uppercase ${textColor} tracking-widest text-lg">${c}</h4>` +
                        joueurs.map((j, idx) => `
                            <div class="text-sm flex justify-between items-center border-b border-black/30 py-2">
                                <span class="font-bold text-slate-300">${idx + 1}. ${j.prenom} <span class="text-[10px] text-slate-500 ml-1">(${j.eq})</span></span>
                                <span class="font-black ${textColor}">${j.score}</span>
                            </div>
                        `).join('');
                });
            }

            // Initialiser Eruda
            eruda.init();
        });
    </script>
</body>
</html>
