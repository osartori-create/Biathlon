<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Arcathlon | Élève</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
    <style>
        body { user-select: none; touch-action: manipulation; background: #0f172a; }
        .btn-arrow:active { transform: scale(0.95); }
        .cible-circle { cursor: pointer; transition: opacity 0.2s; }
        .cible-circle:active { opacity: 0.7; }
        @keyframes pulse-impact { 0% { transform: scale(1); stroke-width: 0; } 50% { transform: scale(1.05); stroke-width: 4px; stroke: white; } 100% { transform: scale(1); stroke-width: 0; } }
        .impact { animation: pulse-impact 0.3s ease-out; }
        .disabled { opacity: 0.5; pointer-events: none; filter: grayscale(0.6); }
        .score-badge { background: #1e293b; border-radius: 999px; padding: 2px 12px; font-size: 0.7rem; font-weight: bold; color: #a5b4fc; border: 1px solid #4f46e5; }
        .icone-statut { font-size: 1.2rem; margin: 0 1px; }
        .alerte-triche { color: #ef4444; font-weight: 900; background: rgba(239,68,68,0.2); padding: 4px 8px; border-radius: 8px; border: 1px solid #ef4444; }
    </style>
</head>
<body class="text-white p-4 h-screen flex flex-col font-sans">
    <!-- Statut -->
    <div class="flex justify-between items-center mb-2 shrink-0 px-2">
        <div id="connStatus" class="flex items-center gap-2 text-xs font-bold uppercase tracking-widest text-slate-500">
            <span id="connDot" class="w-3 h-3 rounded-full bg-slate-600"></span>
            <span id="connLabel">Connexion...</span>
        </div>
        <div id="modeBadge" class="text-xs font-black uppercase tracking-widest text-blue-400 border border-blue-800 px-3 py-1 rounded-full bg-blue-950/30">
            Mode: Sprint | <span id="seanceInfo">Séance non chargée</span>
        </div>
    </div>

    <!-- ZONE PRINCIPALE -->
    <div class="bg-slate-900 border-4 border-slate-800 p-6 rounded-[3rem] shadow-2xl flex-1 flex flex-col max-w-4xl mx-auto w-full relative overflow-hidden">
        <!-- ECRAN 1 : CHOIX EQUIPE & PIN -->
        <div id="ecranLogin" class="flex flex-col items-center">
            <h1 class="text-5xl font-black text-center text-blue-500 uppercase tracking-widest mb-10 italic">Arcathlon</h1>
            <select id="selEquipe" onchange="checkTeamSelection()" class="w-full max-w-md bg-black p-6 rounded-2xl text-3xl font-black uppercase text-center border-4 border-slate-700 outline-none mb-6">
                <option value="">-- CHOISIR L'ÉQUIPE --</option>
            </select>
            <div id="numpad" class="hidden flex-col items-center">
                <div class="text-sm font-bold text-slate-400 mb-2 uppercase tracking-widest">Saisir le PIN (3 chiffres)</div>
                <div id="pinDisplay" class="bg-slate-950 border-2 border-slate-700 w-48 h-16 rounded-xl flex items-center justify-center text-3xl font-mono tracking-[1em] mb-4 text-emerald-400 shadow-inner"></div>
                <div class="grid grid-cols-3 gap-3">
                    <script>for(let i=1; i<=9; i++) document.write(`<button onclick="addPin(${i})" class="bg-slate-800 w-16 h-16 rounded-xl text-2xl font-black active:bg-blue-600">${i}</button>`);</script>
                    <button onclick="clearPin()" class="bg-red-900/50 text-red-400 w-16 h-16 rounded-xl text-sm font-black uppercase border border-red-800 active:bg-red-800">Effacer</button>
                    <button onclick="addPin(0)" class="bg-slate-800 w-16 h-16 rounded-xl text-2xl font-black active:bg-blue-600">0</button>
                    <button onclick="validatePin()" class="bg-emerald-600 text-white w-16 h-16 rounded-xl text-sm font-black uppercase border-2 border-emerald-400 active:bg-emerald-700">OK</button>
                </div>
            </div>
        </div>

        <!-- ECRAN 2 : CHOIX COUREUR -->
        <div id="ecranCoureurs" class="hidden flex-col">
            <button onclick="resetLogin()" class="text-slate-500 font-bold text-sm uppercase tracking-widest text-left mb-6">↩ Changer d'équipe</button>
            <h2 id="titreEquipe" class="text-4xl font-black text-center text-slate-200 uppercase tracking-widest mb-8">Équipe X</h2>
            <div id="maillotsGrid" class="grid grid-cols-2 gap-4"></div>
            <div class="mt-8 pt-6 border-t border-slate-800 text-center">
                <button onclick="toggleHistorique()" class="bg-slate-800 px-6 py-3 rounded-xl font-bold text-sm text-slate-400 uppercase tracking-widest border border-slate-700 active:bg-slate-700">📜 Historique</button>
            </div>
        </div>

        <!-- ECRAN 3 : CHRONOMÉTRAGE (départ manuel pour la première série) -->
        <div id="ecranChrono" class="hidden flex-col h-full">
            <button onclick="retourCoureurs()" class="text-slate-500 font-bold text-sm uppercase tracking-widest text-left mb-2 shrink-0">↩ Retour</button>
            <div class="text-center font-black text-2xl text-slate-300 mb-4 bg-slate-950 py-3 rounded-xl border-2 border-slate-800 shrink-0">
                <span id="coureurLabel" class="text-blue-400">Coureur : Maillot Rouge</span>
                <div class="text-sm font-bold text-slate-400 mt-1">VMA: <span id="vmaCoureur">12.0</span> km/h</div>
            </div>
            <div class="flex-1 flex flex-col items-center justify-center gap-6">
                <div class="text-6xl font-mono font-bold tabular-nums" id="chronoDisplay">00:00.00</div>
                <div class="flex gap-4">
                    <button id="btnDepart" onclick="demarrerChrono()" class="bg-green-600 text-white w-32 h-20 rounded-2xl font-black text-2xl uppercase tracking-widest shadow-xl active:bg-green-700">Départ</button>
                    <button id="btnArrivee" onclick="arreterChrono()" class="bg-red-600 text-white w-32 h-20 rounded-2xl font-black text-2xl uppercase tracking-widest shadow-xl active:bg-red-700" disabled>Arrivée</button>
                </div>
                <div class="w-full max-w-md bg-slate-800 p-4 rounded-2xl border-2 border-slate-700">
                    <div class="flex justify-between mb-2"><span class="font-bold text-slate-400">Série :</span><span id="serieActuelle" class="font-bold text-emerald-400">1/3</span></div>
                    <div class="flex justify-between mb-2"><span class="font-bold text-slate-400">Tours :</span><span id="toursInfo" class="font-bold text-emerald-400">3 tours (1200 m)</span></div>
                    <div class="flex justify-between mb-2"><span class="font-bold text-slate-400">Temps :</span><span id="tempsAffiche" class="font-bold text-emerald-400">00:00.00</span></div>
                    <div class="flex justify-between"><span class="font-bold text-slate-400">Vitesse :</span><span id="vitesseAffiche" class="font-bold text-emerald-400">0 km/h</span></div>
                </div>
            </div>
        </div>

        <!-- ECRAN 4 : SAISIE TIR -->
        <div id="ecranSaisie" class="hidden flex-col h-full">
            <button onclick="retourCoureurs()" class="text-slate-500 font-bold text-sm uppercase tracking-widest text-left mb-2 shrink-0">↩ Retour</button>
            <div class="text-center font-black text-2xl text-slate-300 mb-4 bg-slate-950 py-3 rounded-xl border-2 border-slate-800 shrink-0" id="labelCoureur"></div>
            <div class="flex-1 flex gap-6 min-h-0">
                <!-- Cible -->
                <div class="flex-1 bg-black rounded-3xl border-2 border-slate-800 p-4 flex flex-col items-center justify-center relative shadow-inner">
                    <span class="absolute top-4 text-xs font-black text-slate-500 uppercase tracking-widest">Touchez la cible 🎯</span>
                    <svg viewBox="0 0 100 100" class="w-full max-w-[250px] md:max-w-xs mx-auto drop-shadow-2xl">
                        <circle cx="50" cy="50" r="45" fill="#3b82f6" class="cible-circle" onclick="marquerTir(6, 'Bleu')" />
                        <circle cx="50" cy="50" r="30" fill="#ef4444" class="cible-circle" onclick="marquerTir(8, 'Rouge')" />
                        <circle cx="50" cy="50" r="15" fill="#eab308" class="cible-circle" onclick="marquerTir(10, 'Jaune')" />
                    </svg>
                    <div class="grid grid-cols-2 gap-2 mt-4 w-full">
                        <button onclick="marquerTir(5, 'Bord')" class="bg-slate-800 text-xs font-bold py-3 rounded-xl border border-slate-600 text-slate-300 active:bg-slate-700">+5 (Bord)</button>
                        <button onclick="marquerTir(0, 'Manqué')" class="bg-red-950/40 text-xs font-bold py-3 rounded-xl border border-red-900 text-red-400 active:bg-red-900">0 (Manqué)</button>
                    </div>
                </div>
                <!-- Flèches et validation -->
                <div class="flex-1 flex flex-col gap-3">
                    <div class="bg-slate-900 p-4 rounded-2xl border-2 border-slate-700 flex flex-col gap-2" id="flechesContainer"></div>
                    <button id="btnValider" onclick="validerPassage()" disabled class="bg-emerald-600 border-4 border-emerald-400 py-6 rounded-2xl font-black text-2xl uppercase tracking-widest text-white shadow-xl opacity-50 transition-opacity">
                        Valider <span id="totalPreview" class="text-lg"></span>
                    </button>
                    <button onclick="annulerTir()" class="bg-yellow-600/40 border-2 border-yellow-600 py-3 rounded-xl font-bold text-sm uppercase text-yellow-400 active:bg-yellow-800">↩ Annuler le tir</button>
                </div>
            </div>
        </div>

        <!-- ECRAN HISTORIQUE -->
        <div id="ecranHistorique" class="hidden flex-col h-full absolute inset-0 bg-slate-950/95 p-8 z-50 backdrop-blur-sm">
            <div class="flex justify-between items-center border-b border-slate-700 pb-4 mb-4">
                <h2 class="text-2xl font-black text-blue-400 uppercase tracking-widest italic">Historique Équipe</h2>
                <button onclick="toggleHistorique()" class="bg-slate-800 px-4 py-2 rounded-xl font-bold uppercase text-xs">Fermer</button>
            </div>
            <div id="listHistorique" class="flex flex-col gap-3 overflow-y-auto"></div>
        </div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://arcathlon-eps-default-rtdb.europe-west1.firebasedatabase.app/" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let equipesConfig = {};
        let configMode = "sprint";
        let currentEq = "", currentPin = "", currentMaillot = "";
        let inputPin = "";
        let seanceConfig = {};
        let passageActuel = 1;
        let tirs = [];
        let scoresCoureur = {};
        let chronoInterval = null;
        let tempsDepart = 0;
        let tempsEcoule = 0;
        let currentSerie = 0;
        let currentVitesse = 0;
        let currentPointsCourse = 0;
        let isFirstSerie = true;

        db.ref('.info/connected').on('value', snap => {
            document.getElementById('connDot').className = "w-3 h-3 rounded-full " + (snap.val() ? "bg-emerald-500" : "bg-red-500");
            document.getElementById('connLabel').textContent = snap.val() ? "En ligne" : "Hors ligne";
        });

        db.ref('arcathlon/config').on('value', snap => {
            const config = snap.val() || {};
            equipesConfig = config.equipes || {};
            configMode = config.mode || "sprint";
            seanceConfig = {
                seanceId: config.seanceId,
                longueurPiste: config.longueurPiste || 400,
                nbTours: config.nbTours || 3,
                nbSeries: config.nbSeries || 3,
                nbFleches: config.nbFleches || 2,
                distanceTotale: config.distanceTotale || 1200,
                vmaReference: config.vmaReference || {}
            };
            document.getElementById('seanceInfo').textContent = `Séance ${seanceConfig.seanceId ? seanceConfig.seanceId.substring(0, 8) : 'non chargée'}`;
            document.getElementById('toursInfo').textContent = `${seanceConfig.nbTours} tours (${seanceConfig.distanceTotale} m)`;

            // Initialisation des scores
            scoresCoureur = {};
            Object.keys(equipesConfig).forEach(eq => {
                const membres = equipesConfig[eq].membres || [];
                membres.forEach(m => {
                    const key = `${eq}-${m.maillot}`;
                    let nbSeries = seanceConfig.nbSeries;
                    if (m.remplaceAbsent) nbSeries = seanceConfig.nbSeries + 1;
                    if (m.absent) nbSeries = 0;
                    scoresCoureur[key] = {
                        series: Array(nbSeries).fill().map(() => ({ course: 0, tir: 0, temps: 0, vitesse: 0 })),
                        complet: false
                    };
                });
            });

            const sel = document.getElementById('selEquipe');
            const valActuelle = sel.value;
            sel.innerHTML = "<option value=\"\">-- CHOISIR L'ÉQUIPE --</option>" +
                Object.keys(equipesConfig).map(eq => `<option value="${eq}">ÉQUIPE ${eq}</option>`).join('');
            if (valActuelle && equipesConfig[valActuelle]) sel.value = valActuelle;

            if (currentEq && !equipesConfig[currentEq]) resetLogin();
            else if (currentEq && currentMaillot) buildCoureursGrid();
        });

        db.ref('arcathlon/live/passages').on('value', snap => {
            const passages = snap.val() || {};
            if (!document.getElementById('ecranHistorique').classList.contains('hidden')) {
                renderHistorique(passages);
            }
        });

        window.checkTeamSelection = function() {
            const val = document.getElementById('selEquipe').value;
            if (val) {
                currentEq = val;
                currentPin = equipesConfig[val].pin;
                inputPin = "";
                document.getElementById('pinDisplay').textContent = "";
                document.getElementById('numpad').classList.remove('hidden');
                document.getElementById('numpad').classList.add('flex');
            } else {
                document.getElementById('numpad').classList.add('hidden');
                document.getElementById('numpad').classList.remove('flex');
            }
        };

        window.addPin = function(num) {
            if (inputPin.length < 3) { inputPin += num; document.getElementById('pinDisplay').textContent = inputPin.replace(/./g, '•'); }
        };
        window.clearPin = function() { inputPin = ""; document.getElementById('pinDisplay').textContent = ""; };

        window.validatePin = function() {
            if (inputPin === currentPin) {
                document.getElementById('ecranLogin').classList.add('hidden');
                document.getElementById('ecranLogin').classList.remove('flex');
                document.getElementById('ecranCoureurs').classList.remove('hidden');
                document.getElementById('ecranCoureurs').classList.add('flex');
                document.getElementById('titreEquipe').textContent = `Équipe ${currentEq}`;
                buildCoureursGrid();
            } else {
                alert("Code PIN incorrect. Demandez-le au professeur.");
                clearPin();
            }
        };

        window.resetLogin = function() {
            clearInterval(chronoInterval);
            isFirstSerie = true;
            currentEq = ""; inputPin = ""; currentMaillot = "";
            document.getElementById('selEquipe').value = "";
            document.getElementById('numpad').classList.add('hidden');
            document.getElementById('numpad').classList.remove('flex');
            document.getElementById('ecranCoureurs').classList.add('hidden');
            document.getElementById('ecranCoureurs').classList.remove('flex');
            document.getElementById('ecranChrono').classList.add('hidden');
            document.getElementById('ecranChrono').classList.remove('flex');
            document.getElementById('ecranSaisie').classList.add('hidden');
            document.getElementById('ecranSaisie').classList.remove('flex');
            document.getElementById('ecranLogin').classList.remove('hidden');
            document.getElementById('ecranLogin').classList.add('flex');
            passageActuel = 1; tirs = []; currentSerie = 0;
            document.getElementById('btnDepart').style.display = 'block';
        };

        function buildCoureursGrid() {
            const grid = document.getElementById('maillotsGrid');
            const membres = equipesConfig[currentEq]?.membres || [];
            let html = "";
            const colorMap = {
                'Rouge': 'bg-red-950 border-red-600 text-red-400',
                'Jaune': 'bg-yellow-950 border-yellow-600 text-yellow-400',
                'Bleu': 'bg-blue-950 border-blue-600 text-blue-400',
                'Vert': 'bg-green-950 border-green-600 text-green-400'
            };
            membres.forEach(m => {
                if (m.absent) {
                    const cClass = 'bg-slate-800 border-slate-600 text-slate-400';
                    html += `
                    <div class="border-4 py-8 rounded-3xl flex flex-col items-center justify-center ${cClass} opacity-50">
                        <span class="font-black text-2xl uppercase tracking-widest">${m.maillot}</span>
                        <span class="text-sm font-bold mt-1 text-slate-400">VMA: ${m.vma}</span>
                        <div class="text-xs font-bold text-red-400 mt-1">⚠️ Absent</div>
                    </div>`;
                    return;
                }
                const key = `${currentEq}-${m.maillot}`;
                const scores = scoresCoureur[key] || { series: [], complet: false };
                const serieActuelle = scores.series.findIndex(s => s.course === 0);
                const serieMax = scores.series.length;
                const complet = serieActuelle === -1 || serieActuelle >= serieMax;
                const totalCourse = scores.series.reduce((acc, s) => acc + s.course, 0);
                const totalTir = scores.series.reduce((acc, s) => acc + s.tir, 0);
                const total = totalCourse + totalTir;

                let icones = '';
                for (let i = 0; i < scores.series.length; i++) {
                    const s = scores.series[i];
                    let icone = '⬜';
                    if (s.course > 0) {
                        icone = s.course >= 2 ? '✅' : '❌';
                    }
                    icones += `<span class="icone-statut" title="Série ${i+1}">${icone}</span>`;
                }

                const cClass = colorMap[m.maillot] || 'bg-slate-800 border-slate-600 text-white';
                const disabledClass = complet ? 'opacity-50 disabled' : 'active:bg-slate-900';
                const scoreDisplay = total > 0 ? `<span class="score-badge">${total} pts</span>` : '';
                const remplaceBadge = m.remplaceAbsent ? ' ⭐ (remplace absent)' : '';
                html += `
                <button onclick="${complet ? '' : `openChrono('${m.maillot}')`}"
                        class="btn-arrow ${cClass} border-4 py-8 rounded-3xl flex flex-col items-center justify-center shadow-lg ${disabledClass}">
                    <span class="font-black text-2xl uppercase tracking-widest">${m.maillot}${remplaceBadge}</span>
                    <span class="text-sm font-bold mt-1 text-slate-300">VMA: ${m.vma}</span>
                    <div class="flex items-center gap-1 mt-2">${icones}</div>
                    ${scoreDisplay}
                    ${complet ? `<div class="text-xs font-bold text-green-400 mt-1">✓ Terminé</div>` : ''}
                </button>`;
            });
            grid.innerHTML = html;
        }

        window.openChrono = function(maillot) {
            currentMaillot = maillot;
            const key = `${currentEq}-${maillot}`;
            const serieActuelle = scoresCoureur[key].series.findIndex(s => s.course === 0);
            currentSerie = serieActuelle;
            isFirstSerie = true;
            document.getElementById('ecranCoureurs').classList.add('hidden');
            document.getElementById('ecranCoureurs').classList.remove('flex');
            document.getElementById('ecranChrono').classList.remove('hidden');
            document.getElementById('ecranChrono').classList.add('flex');
            const colorTexte = {'Vert':'text-green-400','Bleu':'text-blue-400','Jaune':'text-yellow-400','Rouge':'text-red-400'}[maillot];
            document.getElementById('coureurLabel').innerHTML = `
                <span class="${colorTexte}">${maillot}</span>
                <div class="text-sm font-bold text-slate-400 mt-1">
                    Série ${serieActuelle + 1}/${scoresCoureur[key].series.length} |
                    VMA: <span id="vmaCoureur">${seanceConfig.vmaReference[key] || 'N/A'}</span> km/h
                </div>`;
            document.getElementById('serieActuelle').textContent = `${serieActuelle + 1}/${scoresCoureur[key].series.length}`;
            resetChrono();
            document.getElementById('btnDepart').style.display = 'block';
            document.getElementById('btnDepart').disabled = false;
        };

        // Fonction pour lancer une série suivante immédiatement (sans décompte)
        function lancerSerieSuivante(maillot) {
            currentMaillot = maillot;
            const key = `${currentEq}-${maillot}`;
            const serieActuelle = scoresCoureur[key].series.findIndex(s => s.course === 0);
            currentSerie = serieActuelle;
            document.getElementById('ecranTransition').classList.add('hidden');
            document.getElementById('ecranTransition').classList.remove('flex');
            document.getElementById('ecranCoureurs').classList.add('hidden');
            document.getElementById('ecranCoureurs').classList.remove('flex');
            document.getElementById('ecranChrono').classList.remove('hidden');
            document.getElementById('ecranChrono').classList.add('flex');
            const colorTexte = {'Vert':'text-green-400','Bleu':'text-blue-400','Jaune':'text-yellow-400','Rouge':'text-red-400'}[maillot];
            document.getElementById('coureurLabel').innerHTML = `
                <span class="${colorTexte}">${maillot}</span>
                <div class="text-sm font-bold text-slate-400 mt-1">
                    Série ${serieActuelle + 1}/${scoresCoureur[key].series.length} |
                    VMA: <span id="vmaCoureur">${seanceConfig.vmaReference[key] || 'N/A'}</span> km/h
                </div>`;
            document.getElementById('serieActuelle').textContent = `${serieActuelle + 1}/${scoresCoureur[key].series.length}`;
            resetChrono();
            document.getElementById('btnDepart').style.display = 'none';
            // Démarrer immédiatement
            demarrerChrono();
        }

        window.retourCoureurs = function() {
            clearInterval(chronoInterval);
            isFirstSerie = true;
            document.getElementById('ecranChrono').classList.add('hidden');
            document.getElementById('ecranChrono').classList.remove('flex');
            document.getElementById('ecranSaisie').classList.add('hidden');
            document.getElementById('ecranSaisie').classList.remove('flex');
            document.getElementById('ecranCoureurs').classList.remove('hidden');
            document.getElementById('ecranCoureurs').classList.add('flex');
            buildCoureursGrid();
            document.getElementById('btnDepart').style.display = 'block';
        };

        function demarrerChrono() {
            tempsDepart = Date.now() - tempsEcoule;
            chronoInterval = setInterval(mettreAJourChrono, 10);
            document.getElementById('btnDepart').disabled = true;
            document.getElementById('btnArrivee').disabled = false;
        }

        function mettreAJourChrono() {
            tempsEcoule = Date.now() - tempsDepart;
            const temps = new Date(tempsEcoule);
            const minutes = temps.getUTCMinutes().toString().padStart(2, '0');
            const secondes = temps.getUTCSeconds().toString().padStart(2, '0');
            const centiemes = Math.floor(temps.getUTCMilliseconds() / 10).toString().padStart(2, '0');
            document.getElementById('chronoDisplay').textContent = `${minutes}:${secondes}.${centiemes}`;
        }

        function arreterChrono() {
            clearInterval(chronoInterval);
            const temps = new Date(tempsEcoule);
            const secondesTotales = temps.getUTCMinutes() * 60 + temps.getUTCSeconds() + temps.getUTCMilliseconds() / 1000;
            currentVitesse = (seanceConfig.distanceTotale / 1000) / (secondesTotales / 3600);
            document.getElementById('tempsAffiche').textContent = document.getElementById('chronoDisplay').textContent;
            document.getElementById('vitesseAffiche').textContent = `${currentVitesse.toFixed(1)} km/h`;

            let alerteTriche = false;
            if (currentVitesse > 17) {
                alerteTriche = true;
                alert("⚠️ Vitesse anormalement élevée ! Une alerte a été envoyée au professeur.");
            }

            const key = `${currentEq}-${currentMaillot}`;
            const vmaEleve = seanceConfig.vmaReference[key] || 12;
            let pointsVMA = 0;
            if (currentVitesse >= vmaEleve + 1) pointsVMA = 3;
            else if (currentVitesse >= vmaEleve - 0.5) pointsVMA = 2;
            else if (currentVitesse >= vmaEleve - 1) pointsVMA = 1;
            currentPointsCourse = pointsVMA;

            if (currentSerie !== -1) {
                scoresCoureur[key].series[currentSerie].course = pointsVMA;
                scoresCoureur[key].series[currentSerie].vitesse = currentVitesse;
                scoresCoureur[key].series[currentSerie].temps = tempsEcoule;
            }

            document.getElementById('btnArrivee').disabled = true;
            setTimeout(() => {
                document.getElementById('ecranChrono').classList.add('hidden');
                document.getElementById('ecranChrono').classList.remove('flex');
                document.getElementById('ecranSaisie').classList.remove('hidden');
                document.getElementById('ecranSaisie').classList.add('flex');
                const colorTexte = {'Vert':'text-green-400','Bleu':'text-blue-400','Jaune':'text-yellow-400','Rouge':'text-red-400'}[currentMaillot];
                document.getElementById('labelCoureur').innerHTML = `
                    <span class="${colorTexte}">${currentMaillot}</span>
                    <div class="text-sm font-bold text-slate-400 mt-1">
                        Série ${currentSerie + 1}/${scoresCoureur[key].series.length} |
                        Vitesse: ${currentVitesse.toFixed(1)} km/h (${pointsVMA} pts)
                        ${alerteTriche ? '<span class="alerte-triche ml-2">⚠️ Triche suspectée</span>' : ''}
                    </div>`;
                genererZonesFleches();
                resetChrono();
                document.getElementById('btnDepart').style.display = 'block';
                window._alerteTriche = alerteTriche;
            }, 500);
        }

        function resetChrono() {
            clearInterval(chronoInterval);
            tempsEcoule = 0;
            document.getElementById('chronoDisplay').textContent = "00:00.00";
            document.getElementById('btnDepart').disabled = false;
            document.getElementById('btnArrivee').disabled = true;
            document.getElementById('tempsAffiche').textContent = "00:00.00";
            document.getElementById('vitesseAffiche').textContent = "0 km/h";
        }

        function genererZonesFleches() {
            const container = document.getElementById('flechesContainer');
            let html = '';
            for (let i = 0; i < seanceConfig.nbFleches; i++) {
                html += `<div id="affF${i+1}" class="bg-black text-slate-500 font-black text-xl py-4 rounded-xl text-center border-2 border-slate-800">Flèche ${i+1} : --</div>`;
            }
            container.innerHTML = html;
            tirs = [];
            updateTotal();
        }

        window.marquerTir = function(pts, zoneName) {
            if (tirs.length >= seanceConfig.nbFleches) return;
            tirs.push(pts);
            const aff = document.getElementById(`affF${tirs.length}`);
            aff.className = "bg-slate-800 text-white font-black text-xl py-4 rounded-xl text-center border-4 border-slate-500 shadow-lg impact";
            aff.innerHTML = `Flèche ${tirs.length} : <span class="text-blue-400">${pts} pts</span><span class="text-[10px] block uppercase text-slate-400">${zoneName}</span>`;
            updateTotal();
        };

        window.annulerTir = function() {
            if (tirs.length === 0) return;
            tirs.pop();
            const idx = tirs.length + 1;
            const aff = document.getElementById(`affF${idx}`);
            aff.className = "bg-black text-slate-500 font-black text-xl py-4 rounded-xl text-center border-2 border-slate-800";
            aff.textContent = `Flèche ${idx} : --`;
            updateTotal();
        };

        window.updateTotal = function() {
            const btn = document.getElementById('btnValider');
            if (tirs.length === seanceConfig.nbFleches) {
                const ptsTir = tirs.reduce((a, b) => a + b, 0);
                btn.disabled = false;
                btn.classList.remove('opacity-50');
                document.getElementById('totalPreview').textContent = `(${ptsTir} pts)`;
            } else {
                btn.disabled = true;
                btn.classList.add('opacity-50');
                document.getElementById('totalPreview').textContent = `(Tirez ${seanceConfig.nbFleches} flèches)`;
            }
        };

        window.validerPassage = function() {
            const btn = document.getElementById('btnValider');
            btn.disabled = true;
            const key = `${currentEq}-${currentMaillot}`;
            const ptsTir = tirs.reduce((a, b) => a + b, 0);
            scoresCoureur[key].series[currentSerie].tir = ptsTir;

            // Vérifier si toutes les séries (y compris bonus) sont terminées
            const complet = scoresCoureur[key].series.every(s => s.course > 0 && s.tir > 0);
            if (complet) scoresCoureur[key].complet = true;

            const passageData = {
                equipe: currentEq,
                maillot: currentMaillot,
                ptsVMA: currentPointsCourse,
                ptsTir: ptsTir,
                vitesse: currentVitesse,
                temps: tempsEcoule,
                passage: passageActuel,
                serie: currentSerie + 1,
                timestamp: Date.now(),
                seanceId: seanceConfig.seanceId,
                alerteTriche: window._alerteTriche || false
            };

            const ref = db.ref('arcathlon/live/passages').push();
            ref.set(passageData).then(() => {
                // Si le coureur est un remplaçant et a terminé ses séries obligatoires (nbSeries), on le renvoie à la grille
                const nbSeriesObligatoires = seanceConfig.nbSeries;
                const estRemplacant = equipesConfig[currentEq].membres.find(m => m.maillot === currentMaillot)?.remplaceAbsent || false;
                const seriesTerminees = scoresCoureur[key].series.filter(s => s.course > 0 && s.tir > 0).length;
                if (seriesTerminees === nbSeriesObligatoires && estRemplacant && !complet) {
                    // Il reste la série bonus, on retourne à la grille pour laisser les autres passer
                    document.body.classList.add('bg-yellow-900');
                    setTimeout(() => {
                        document.body.classList.remove('bg-yellow-900');
                        retourCoureurs();
                    }, 500);
                    return;
                }

                if (complet) {
                    document.body.classList.add('bg-emerald-900');
                    setTimeout(() => {
                        document.body.classList.remove('bg-emerald-900');
                        resetLogin();
                        passageActuel = 1;
                    }, 500);
                } else {
                    passageActuel++;
                    lancerSerieSuivante(currentMaillot);
                }
            }).catch(() => {
                alert("Erreur d'envoi. Vérifiez la connexion.");
                btn.disabled = false;
            });
        };

        window.toggleHistorique = function() {
            const panel = document.getElementById('ecranHistorique');
            if (panel.classList.contains('hidden')) {
                panel.classList.remove('hidden');
                panel.classList.add('flex');
                renderHistorique();
            } else {
                panel.classList.add('hidden');
                panel.classList.remove('flex');
            }
        };

        function renderHistorique() {
            const container = document.getElementById('listHistorique');
            const coureurKey = `${currentEq}-${currentMaillot}`;
            const scores = scoresCoureur[coureurKey] || { series: [] };
            if (!scores.series.length) {
                container.innerHTML = '<p class="text-slate-500 text-center py-4">Aucun passage enregistré pour ce coureur.</p>';
                return;
            }
            let html = `<div class="bg-slate-800 p-4 rounded-xl mb-4"><h3 class="font-black text-blue-400 text-lg mb-2">${currentMaillot}</h3><div class="grid grid-cols-1 gap-2">`;
            scores.series.forEach((serie, idx) => {
                const totalSerie = serie.course + serie.tir;
                const valid = serie.course >= 2 ? '✅' : '❌';
                html += `
                <div class="bg-slate-900 p-3 rounded-lg border border-slate-700">
                    <div class="flex justify-between"><span class="font-bold text-slate-300">Série ${idx + 1}</span><span class="text-emerald-400 font-bold">${totalSerie} pts</span></div>
                    <div class="flex justify-between text-xs text-slate-400 mt-1">
                        <span>Course: ${serie.course} pts ${valid}</span>
                        <span>Tir: ${serie.tir} pts</span>
                        <span>Vit: ${serie.vitesse ? serie.vitesse.toFixed(1) : '-'} km/h</span>
                    </div>
                </div>`;
            });
            html += `</div></div>`;
            container.innerHTML = html;
        }
    </script>
</body>
</html>
