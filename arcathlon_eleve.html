<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Arcathlon | Élève</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
    <style>
        * { touch-action: manipulation; user-select: none; -webkit-user-select: none; }
        body { background: #0f172a; font-family: sans-serif; }
        .btn-tap:active { transform: scale(0.96); }
        .cible-circle { cursor: pointer; transition: opacity 0.15s; }
        .cible-circle:active { opacity: 0.6; }
        @keyframes pulse-impact {
            0% { transform: scale(1); stroke-width: 0; }
            50% { transform: scale(1.05); stroke-width: 4px; stroke: #fff; }
            100% { transform: scale(1); stroke-width: 0; }
        }
        .impact { animation: pulse-impact 0.3s ease-out; }
        .phase-panel { border-radius: 16px; padding: 14px 18px; color: #0a0f1a; transition: background 0.3s; }
        .panel-course { background: #cfe4ff; }
        .panel-tir    { background: #ffe1b3; }
        .panel-pen    { background: #e1d0ff; }
        .phase-title { font-weight: 1000; text-transform: uppercase; letter-spacing: 0.6px; font-size: 1.4rem; opacity: 0.95; animation: phasePulse 1.5s ease-in-out infinite; transform-origin: left center; }
        @keyframes phasePulse {
            0%   { transform: scale(1);    opacity: .95 }
            50%  { transform: scale(1.20); opacity: .65 }
            100% { transform: scale(1);    opacity: .95 }
        }
        @media (prefers-reduced-motion: reduce) { .phase-title { animation: none; } }
        .phase-clock { font-size: 2rem; font-weight: 1000; line-height: 1; margin-top: 4px; font-variant-numeric: tabular-nums; }
        .chip { display: inline-flex; align-items: center; gap: 8px; padding: 4px 12px; border-radius: 999px; border: 1px solid rgba(0,0,0,0.15); background: rgba(255,255,255,0.5); color: #0a0f1a; font-weight: 700; font-size: 0.9rem; }
        .btn-action {
            width: 100%; padding: 20px 16px; font-size: 1.5rem; border-radius: 16px; font-weight: 900; letter-spacing: 0.3px;
            border: none; color: #0a0f1a; cursor: pointer; transition: transform 0.1s, box-shadow 0.2s;
        }
        .btn-action:active { transform: scale(0.97); }
        .btn-action.course { background: linear-gradient(180deg, #5b57f1, #4f46e5); color: #fff; }
        .btn-action.tir    { background: linear-gradient(180deg, #ffcc80, #f59e0b); color: #1b1200; }
        .btn-action.pen    { background: linear-gradient(180deg, #b197ff, #9f86ff); color: #1b1200; }
        .btn-action.done   { background: #22c55e; color: #07150b; }
        .penlaps { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
        .penlap {
            min-width: 60px; height: 48px; padding: 0 12px; border-radius: 12px; display: grid; place-items: center;
            cursor: pointer; border: 2px solid rgba(0,0,0,0.15); background: #9f86ff; color: #0a0f1a; font-weight: 900;
            transition: background 0.2s;
        }
        .penlap.done { background: #bbf7d0; border-color: #16a34a; cursor: default; }
        .error-msg { background: #ef4444; color: white; padding: 8px 12px; border-radius: 8px; font-weight: bold; margin-top: 8px; display: none; }
        .tir-container { display: flex; flex-direction: column; height: 100%; min-height: 300px; }
        .tir-row { display: flex; flex: 1; gap: 16px; align-items: stretch; }
        .tir-target { flex: 1; background: #0a0f1a; border-radius: 24px; border: 2px solid #1f2937; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 12px; }
        .tir-target svg { width: 100%; max-width: 220px; height: auto; }
        .tir-shots { flex: 1; display: flex; flex-direction: column; gap: 8px; }
        .tir-shots .shot-box { background: #111827; padding: 8px; border-radius: 12px; border: 1px solid #1f2937; text-align: center; font-weight: bold; }
        .shot-box .shot-score { color: #60a5fa; }
        .valid-btn { margin-top: 8px; }
    </style>
</head>
<body class="text-white p-4 h-screen flex flex-col">

    <!-- En-tête -->
    <div class="flex justify-between items-center mb-3 shrink-0 px-2">
        <div id="connStatus" class="flex items-center gap-2 text-xs font-bold uppercase tracking-widest text-slate-400">
            <span id="connDot" class="w-3 h-3 rounded-full bg-slate-600"></span>
            <span id="connLabel">Connexion...</span>
        </div>
        <div class="text-xs font-black uppercase tracking-widest text-blue-400 border border-blue-800 px-3 py-1 rounded-full bg-blue-950/40">
            Mode: <span id="labelModeActuel">Sprint</span> | <span id="seanceInfo">--</span>
        </div>
    </div>

    <!-- ZONE PRINCIPALE -->
    <div class="bg-slate-900 border-4 border-slate-800 p-6 rounded-[2.5rem] shadow-2xl flex-1 flex flex-col max-w-4xl mx-auto w-full relative overflow-hidden">
        
        <!-- LOGIN -->
        <div id="ecranLogin" class="flex flex-col items-center justify-center flex-1">
            <h1 class="text-5xl font-black text-center text-blue-500 uppercase tracking-widest mb-8 italic">Arcathlon</h1>
            <select id="selEquipe" onchange="checkTeamSelection()" class="w-full max-w-md bg-black p-5 rounded-2xl text-2xl font-black uppercase text-center border-4 border-slate-700 outline-none mb-6 text-white">
                <option value="">-- CHOISIR L'ÉQUIPE --</option>
            </select>
            <div id="numpad" class="hidden flex-col items-center">
                <div class="text-xs font-bold text-slate-400 mb-2 uppercase tracking-widest">Code PIN (3 chiffres)</div>
                <div id="pinDisplay" class="bg-slate-950 border-2 border-slate-700 w-48 h-14 rounded-xl flex items-center justify-center text-3xl font-mono tracking-[0.6em] mb-4 text-emerald-400 shadow-inner"></div>
                <div class="grid grid-cols-3 gap-3">
                    <script>
                        for(let i=1; i<=9; i++) document.write(`<button onclick="addPin(${i})" class="btn-tap bg-slate-800 w-16 h-16 rounded-xl text-2xl font-black active:bg-blue-600">${i}</button>`);
                    </script>
                    <button onclick="clearPin()" class="btn-tap bg-red-950 text-red-400 w-16 h-16 rounded-xl text-xs font-black uppercase border border-red-800 active:bg-red-800">Effacer</button>
                    <button onclick="addPin(0)" class="btn-tap bg-slate-800 w-16 h-16 rounded-xl text-2xl font-black active:bg-blue-600">0</button>
                    <button onclick="validatePin()" class="btn-tap bg-emerald-600 text-white w-16 h-16 rounded-xl text-xs font-black uppercase border-2 border-emerald-400 active:bg-emerald-700">OK</button>
                </div>
            </div>
        </div>

        <!-- GRILLE -->
        <div id="ecranCoureurs" class="hidden flex-col flex-1">
            <button onclick="resetLogin()" class="text-slate-400 font-bold text-sm uppercase tracking-widest text-left mb-4">↩ Changer d'équipe</button>
            <h2 id="titreEquipe" class="text-3xl font-black text-center text-slate-200 uppercase tracking-widest mb-6">Équipe X</h2>
            <div id="maillotsGrid" class="grid grid-cols-2 gap-4 flex-1 content-center"></div>
        </div>

        <!-- ACTION -->
        <div id="ecranAction" class="hidden flex-col h-full">
            <button onclick="retourCoureurs()" class="text-slate-400 font-bold text-sm uppercase tracking-widest text-left mb-2 shrink-0">↩ Retour</button>
            
            <!-- Phase Panel -->
            <div id="phasePanel" class="phase-panel panel-course" style="margin-bottom:12px">
                <div style="display:flex; align-items:end; justify-content:space-between; gap:12px; flex-wrap:wrap">
                    <div>
                        <div id="phaseName" class="phase-title">COURSE</div>
                        <div id="phaseClock" class="phase-clock">00:00.00</div>
                    </div>
                    <div class="chip">Série <span id="currentSerieChip">1</span>/<span id="totalSeriesChip">3</span> | <span id="distanceChip">400m</span></div>
                </div>
            </div>

            <!-- Infos -->
            <div class="text-center font-black text-xl text-slate-300 mb-2 bg-slate-950 py-2 rounded-xl border-2 border-slate-800 shrink-0 flex justify-center items-center gap-4 flex-wrap">
                <span id="coureurLabel">Maillot</span>
                <span id="infoSerieVMA" class="text-sm font-bold text-slate-400"></span>
            </div>

            <!-- Message d'erreur -->
            <div id="errorMessage" class="error-msg"></div>

            <!-- RELAIS Cartes -->
            <div id="moduleRelais" class="hidden flex-col items-center mb-3">
                <button id="btnTirerCarte" onclick="tirerCarteRelais()" class="bg-purple-600 px-6 py-2 rounded-xl font-black text-base uppercase shadow-lg shadow-purple-900/50 btn-tap border-2 border-purple-400">🃏 Tirer une Carte</button>
                <div id="carteAffichee" class="text-lg font-bold text-center bg-slate-800 p-3 rounded-xl border-2 border-purple-500 hidden text-purple-300 mt-2 w-full max-w-md"></div>
            </div>

            <!-- Giant Action Button -->
            <button id="giantActionBtn" class="btn-action course" onclick="onGiantAction()">Démarrer la course</button>

            <!-- Phase Content -->
            <div id="phaseContent" class="flex-1 mt-3 overflow-y-auto" style="min-height: 200px;">
                
                <!-- TIR -->
                <div id="moduleSaisieTir" class="tir-container" style="display:none;">
                    <div class="tir-row">
                        <div class="tir-target">
                            <svg viewBox="0 0 100 100" style="width:100%; max-width:220px; height:auto;">
                                <circle cx="50" cy="50" r="45" fill="#3b82f6" class="cible-circle" onclick="marquerTir(6)" />
                                <circle cx="50" cy="50" r="30" fill="#ef4444" class="cible-circle" onclick="marquerTir(8)" />
                                <circle cx="50" cy="50" r="15" fill="#eab308" class="cible-circle" onclick="marquerTir(10)" />
                            </svg>
                            <div style="display:flex; gap:8px; margin-top:8px; width:100%; justify-content:center;">
                                <button onclick="marquerTir(5)" class="btn-tap bg-slate-700 text-xs font-bold py-2 px-4 rounded-xl border border-slate-500">+5 (Bord)</button>
                                <button onclick="marquerTir(0)" class="btn-tap bg-red-900/50 text-xs font-bold py-2 px-4 rounded-xl border border-red-700">0 (Manqué)</button>
                            </div>
                            <div class="text-xs text-slate-400 mt-1">Cliquez sur la cible ou les boutons</div>
                        </div>

                        <div class="tir-shots">
                            <div id="flechesContainer" style="flex:1; display:flex; flex-direction:column; gap:6px;"></div>
                            <div id="resultatTirSpecifique" class="text-center font-black text-sm uppercase text-yellow-400"></div>
                            <button id="btnValider" onclick="validerTir()" disabled class="valid-btn btn-tap bg-emerald-600 border-2 border-emerald-400 py-3 rounded-2xl font-black text-lg uppercase tracking-widest text-white shadow-xl opacity-40 transition-opacity">
                                Valider le tir
                            </button>
                            <button onclick="annulerTir()" class="btn-tap bg-slate-800 border border-slate-600 py-2 rounded-xl font-bold text-xs uppercase text-slate-400">↩ Annuler flèche</button>
                        </div>
                    </div>
                </div>

                <!-- PÉNALITÉ -->
                <div id="modulePenalite" class="hidden flex-col items-center">
                    <div class="text-center font-bold text-lg">Pénalités à effectuer</div>
                    <div class="penlaps" id="penlapsRow"></div>
                    <div class="chip mt-2">Requis : <span id="penReq">0</span> &nbsp;|&nbsp; Faits : <span id="penDone">0</span></div>
                    <div class="text-xs text-slate-400 mt-2">Cliquez sur chaque tour après l'avoir couru.</div>
                </div>
            </div>

            <!-- KILL BILL -->
            <div id="moduleKillBill" class="hidden flex-1 flex-col gap-3 mt-2">
                <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700 text-center">
                    <div class="text-sm font-bold text-slate-400">Adversaire : <span id="adversaireLabel" class="text-white">--</span></div>
                    <div class="flex justify-around mt-2 text-2xl font-black">
                        <span>Nous : <span id="scoreNous" class="text-emerald-400">0</span></span>
                        <span>Eux : <span id="scoreEux" class="text-red-400">0</span></span>
                    </div>
                    <div id="messageDuel" class="text-sm font-bold text-yellow-400 mt-2">Tire une flèche</div>
                </div>
                <div class="flex-1 bg-black rounded-3xl border-2 border-slate-800 p-2 flex flex-col items-center justify-center">
                    <svg viewBox="0 0 100 100" class="w-full max-w-[200px] mx-auto drop-shadow-2xl">
                        <circle cx="50" cy="50" r="45" fill="#3b82f6" class="cible-circle" onclick="tirerDuel(6)" />
                        <circle cx="50" cy="50" r="30" fill="#ef4444" class="cible-circle" onclick="tirerDuel(8)" />
                        <circle cx="50" cy="50" r="15" fill="#eab308" class="cible-circle" onclick="tirerDuel(10)" />
                    </svg>
                    <div class="flex gap-2 mt-4 w-full px-2">
                        <button onclick="tirerDuel(5)" class="flex-1 btn-tap bg-slate-800 text-xs font-bold py-3 rounded-xl border border-slate-600 text-slate-300">+5</button>
                        <button onclick="tirerDuel(0)" class="flex-1 btn-tap bg-red-950/50 text-xs font-bold py-3 rounded-xl border border-red-900 text-red-400">0</button>
                    </div>
                </div>
                <button id="btnValiderDuel" onclick="validerDuel()" disabled class="btn-tap bg-emerald-600 border-2 border-emerald-400 py-3 rounded-2xl font-black text-lg uppercase tracking-widest text-white shadow-xl opacity-40 transition-opacity">
                    Valider le Duel
                </button>
                <button onclick="annulerDuel()" class="btn-tap bg-slate-800 border border-slate-600 py-2 rounded-xl font-bold text-xs uppercase text-slate-400">↩ Annuler</button>
            </div>

            <!-- MILLE -->
            <div id="moduleMille" class="hidden flex-1 flex-col items-center justify-center gap-4">
                <div id="chrono18s" class="text-8xl font-mono font-black text-emerald-400 bg-black px-12 py-8 rounded-3xl border-4 border-slate-700">18</div>
                <button id="btnStart18" onclick="startTimer18()" class="btn-tap bg-blue-600 px-12 py-6 rounded-2xl font-black text-3xl uppercase border-4 border-blue-400 shadow-xl">Top Départ</button>
            </div>
        </div>
    </div>

    <script>
        // =====================================================================
        // CONFIG & STATE
        // =====================================================================
        const firebaseConfig = { databaseURL: "https://arcathlon-eps-default-rtdb.europe-west1.firebasedatabase.app/" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let equipesConfig = {}, seanceConfig = {}, scoresCoureur = {};
        let currentEq = "", currentPin = "", currentMaillot = "", inputPin = "";
        let passageActuel = 1, currentSerie = 0;
        let modeActuel = "sprint";
        let nbFlechesActuel = 2;
        let currentPhase = 'course';
        let phaseStartTime = null, phaseAccum = 0, globalAccum = 0, isRunning = false, tickHandle = null;
        let lapData = { courseMs: 0, tirMs: 0, penaliteMs: 0, shots: [], penReq: 0, penDone: 0 };
        let effetCarte = null;
        const cartesRelais = [
            { nom: "Tir mauvaise main !", effet: () => { nbFlechesActuel = 1; updateInfoFleches(); } },
            { nom: "1 tour effacé !", effet: () => {} },
            { nom: "Cible éloignée (7m50)", effet: () => {} },
            { nom: "Départ retardé (+10s)", effet: () => { globalAccum += 10000; } },
            { nom: "Volée > 10 pts = 0 pénalité", effet: () => { effetCarte = 'noPenalty'; } },
            { nom: "Cible Scarface (Moitié compte)", effet: () => { effetCarte = 'halfScore'; } }
        ];
        let killBillState = { equipeAdverse: "", scoreNous: 0, scoreEux: 0, tirsNous: 0, tirsEux: 0, maxTirs: 2 };
        let timer18Interval = null;

        // =====================================================================
        // FIREBASE LISTENER
        // =====================================================================
        db.ref('arcathlon/config').on('value', snap => {
            const config = snap.val() || {};
            equipesConfig = config.equipes || {};
            modeActuel = config.mode || "sprint";
            seanceConfig = {
                seanceId: config.seanceId,
                distanceTotale: config.distanceTotale || 1200,
                nbSeries: config.nbSeries || 3,
                nbFleches: config.nbFleches || 2,
                vmaReference: config.vmaReference || {}
            };
            document.getElementById('labelModeActuel').textContent = modeActuel;
            document.getElementById('seanceInfo').textContent = seanceConfig.seanceId ? seanceConfig.seanceId.substring(7, 15) : '--';
            document.getElementById('totalSeriesChip').textContent = seanceConfig.nbSeries;
            document.getElementById('distanceChip').textContent = seanceConfig.distanceTotale + 'm';

            scoresCoureur = {};
            Object.keys(equipesConfig).forEach(eq => {
                (equipesConfig[eq].membres || []).forEach(m => {
                    scoresCoureur[`${eq}-${m.maillot}`] = {
                        series: Array(seanceConfig.nbSeries).fill(0).map(() => ({ course: 0, tir: 0, temps: 0, vitesse: 0 })),
                        complet: false
                    };
                });
            });
            const sel = document.getElementById('selEquipe');
            const valActuelle = sel.value;
            sel.innerHTML = `<option value="">-- CHOISIR L'ÉQUIPE --</option>` + Object.keys(equipesConfig).map(eq => `<option value="${eq}">ÉQUIPE ${eq}</option>`).join('');
            if (valActuelle && equipesConfig[valActuelle]) sel.value = valActuelle;
            if (currentEq && currentMaillot) buildCoureursGrid();
        });

        // =====================================================================
        // LOGIN / GRILLE
        // =====================================================================
        window.checkTeamSelection = function() {
            const val = document.getElementById('selEquipe').value;
            if (val) { currentEq = val; currentPin = equipesConfig[val].pin; inputPin = ""; document.getElementById('pinDisplay').textContent = ""; document.getElementById('numpad').classList.remove('hidden'); document.getElementById('numpad').classList.add('flex'); } 
            else { document.getElementById('numpad').classList.add('hidden'); }
        };
        window.addPin = function(num) { if (inputPin.length < 3) { inputPin += num; document.getElementById('pinDisplay').textContent = "•".repeat(inputPin.length); } };
        window.clearPin = function() { inputPin = ""; document.getElementById('pinDisplay').textContent = ""; };
        window.validatePin = function() {
            if (inputPin === currentPin) {
                document.getElementById('ecranLogin').classList.add('hidden');
                document.getElementById('ecranCoureurs').classList.remove('hidden');
                document.getElementById('ecranCoureurs').classList.add('flex');
                document.getElementById('titreEquipe').textContent = `Équipe ${currentEq}`;
                buildCoureursGrid();
            } else { alert("Code PIN incorrect."); clearPin(); }
        };
        window.resetLogin = function() { stopAllTimers(); currentEq = ""; inputPin = ""; currentMaillot = ""; document.getElementById('selEquipe').value = ""; document.getElementById('numpad').classList.add('hidden'); document.getElementById('ecranCoureurs').classList.add('hidden'); document.getElementById('ecranAction').classList.add('hidden'); document.getElementById('ecranLogin').classList.remove('hidden'); document.getElementById('ecranLogin').classList.add('flex'); };
        function buildCoureursGrid() {
            const grid = document.getElementById('maillotsGrid');
            const membres = equipesConfig[currentEq]?.membres || [];
            let html = "";
            const colorMap = { 'Rouge': 'bg-red-950/80 border-red-600 text-red-400', 'Jaune': 'bg-yellow-950/80 border-yellow-600 text-yellow-400', 'Bleu': 'bg-blue-950/80 border-blue-600 text-blue-400', 'Vert': 'bg-green-950/80 border-green-600 text-green-400' };
            membres.forEach(m => {
                if (m.absent) return;
                const key = `${currentEq}-${m.maillot}`;
                const scores = scoresCoureur[key] || { series: [], complet: false };
                const complet = scores.complet || scores.series.every(s => s.course > 0 || s.tir > 0);
                const cClass = colorMap[m.maillot] || 'bg-slate-800 border-slate-600 text-white';
                const disabledClass = complet ? 'opacity-50 pointer-events-none' : 'btn-tap';
                html += `<button onclick="${complet ? '' : `openAction('${m.maillot}')`}" class="${cClass} border-4 py-8 rounded-3xl flex flex-col items-center justify-center shadow-lg ${disabledClass}"><span class="font-black text-2xl uppercase tracking-widest">${m.maillot}</span><span class="text-xs font-bold mt-1 text-slate-300">VMA: ${m.vma || '12'}</span>${complet ? `<div class="text-xs font-bold text-emerald-400 mt-2">✓ Terminé</div>` : ''}</button>`;
            });
            grid.innerHTML = html;
        }

        // =====================================================================
        // OPEN ACTION
        // =====================================================================
        window.openAction = function(maillot) {
            currentMaillot = maillot;
            const key = `${currentEq}-${maillot}`;
            currentSerie = scoresCoureur[key].series.findIndex(s => s.course === 0);
            if(currentSerie === -1) currentSerie = 0; // déjà terminé, mais on prend la dernière

            document.getElementById('ecranCoureurs').classList.add('hidden');
            document.getElementById('ecranAction').classList.remove('hidden');
            document.getElementById('ecranAction').classList.add('flex');
            document.getElementById('errorMessage').style.display = 'none';
            
            const colorTexte = {'Vert':'text-green-400','Bleu':'text-blue-400','Jaune':'text-yellow-400','Rouge':'text-red-400'}[maillot] || 'text-white';
            document.getElementById('coureurLabel').innerHTML = `<span class="${colorTexte}">${maillot}</span>`;
            document.getElementById('infoSerieVMA').textContent = `Série ${currentSerie + 1}/${seanceConfig.nbSeries} | VMA: ${seanceConfig.vmaReference[key] || '?'}`;
            document.getElementById('currentSerieChip').textContent = currentSerie + 1;

            resetLap();
            currentPhase = 'course';
            nbFlechesActuel = (modeActuel === 'killbill') ? 1 : seanceConfig.nbFleches;
            effetCarte = null;
            updateInfoFleches();

            // Cacher tous les modules
            document.getElementById('moduleSaisieTir').style.display = 'none';
            document.getElementById('modulePenalite').classList.add('hidden');
            document.getElementById('moduleKillBill').classList.add('hidden');
            document.getElementById('moduleMille').classList.add('hidden');
            document.getElementById('moduleRelais').classList.add('hidden');

            if (modeActuel === 'relais') {
                document.getElementById('moduleRelais').classList.remove('hidden');
                document.getElementById('moduleRelais').classList.add('flex');
                document.getElementById('btnTirerCarte').classList.remove('hidden');
                document.getElementById('carteAffichee').classList.add('hidden');
            }

            if (modeActuel === 'mille') {
                document.getElementById('moduleMille').classList.remove('hidden');
                document.getElementById('moduleMille').classList.add('flex');
                document.getElementById('chrono18s').textContent = "18";
                document.getElementById('btnStart18').classList.remove('hidden');
                document.getElementById('giantActionBtn').style.display = 'none';
            } else if (modeActuel === 'killbill') {
                document.getElementById('moduleKillBill').classList.remove('hidden');
                document.getElementById('moduleKillBill').classList.add('flex');
                initKillBill();
                document.getElementById('giantActionBtn').style.display = 'none';
            } else {
                document.getElementById('giantActionBtn').style.display = 'block';
                setPhase('course');
                // Mise à jour du texte du bouton avec la série
                document.getElementById('giantActionBtn').textContent = `Démarrer la course (Série ${currentSerie+1})`;
            }
            document.getElementById('phasePanel').classList.remove('hidden');
        };

        window.retourCoureurs = function() {
            stopAllTimers();
            document.getElementById('ecranAction').classList.add('hidden');
            document.getElementById('ecranCoureurs').classList.remove('hidden');
            document.getElementById('ecranCoureurs').classList.add('flex');
            buildCoureursGrid();
        };

        // =====================================================================
        // PHASE MANAGEMENT
        // =====================================================================
        function setPhase(phase) {
            currentPhase = phase;
            const panel = document.getElementById('phasePanel');
            const name = document.getElementById('phaseName');
            const clock = document.getElementById('phaseClock');
            const giant = document.getElementById('giantActionBtn');

            phaseAccum = 0;
            phaseStartTime = isRunning ? Date.now() : null;
            clock.textContent = '00:00.00';

            panel.className = 'phase-panel';
            if (phase === 'course') {
                panel.classList.add('panel-course');
                name.textContent = 'COURSE';
                giant.textContent = isRunning ? 'Arrivée au tir' : `Démarrer la course (Série ${currentSerie+1})`;
                giant.className = 'btn-action course';
                document.getElementById('moduleSaisieTir').style.display = 'none';
                document.getElementById('modulePenalite').classList.add('hidden');
            } else if (phase === 'tir') {
                panel.classList.add('panel-tir');
                name.textContent = 'TIR';
                giant.textContent = 'Valider le tir';
                giant.className = 'btn-action tir';
                document.getElementById('moduleSaisieTir').style.display = 'flex';
                document.getElementById('modulePenalite').classList.add('hidden');
                genererZonesFleches();
            } else if (phase === 'penalite') {
                panel.classList.add('panel-pen');
                name.textContent = 'PÉNALITÉ';
                giant.textContent = 'Effectuer les pénalités';
                giant.className = 'btn-action pen';
                document.getElementById('moduleSaisieTir').style.display = 'none';
                document.getElementById('modulePenalite').classList.remove('hidden');
                document.getElementById('modulePenalite').classList.add('flex');
                renderPenalites();
            }
            document.getElementById('currentSerieChip').textContent = currentSerie + 1;
            document.getElementById('errorMessage').style.display = 'none';
        }

        function resetLap() {
            lapData = { courseMs: 0, tirMs: 0, penaliteMs: 0, shots: [], penReq: 0, penDone: 0 };
            globalAccum = 0; phaseAccum = 0; isRunning = false;
            if (tickHandle) cancelAnimationFrame(tickHandle);
            tickHandle = null;
            document.getElementById('phaseClock').textContent = '00:00.00';
            document.getElementById('giantActionBtn').textContent = `Démarrer la course (Série ${currentSerie+1})`;
            document.getElementById('giantActionBtn').className = 'btn-action course';
            genererZonesFleches();
        }

        function startTimer() {
            if (isRunning) return;
            const now = Date.now();
            phaseStartTime = now;
            isRunning = true;
            tickLoop();
            updateGiantButton();
        }

        function stopTimer() {
            if (!isRunning) return;
            const now = Date.now();
            if (phaseStartTime) {
                phaseAccum += (now - phaseStartTime);
                phaseStartTime = null;
            }
            isRunning = false;
            if (tickHandle) cancelAnimationFrame(tickHandle);
            tickHandle = null;
            updateGiantButton();
        }

        function tickLoop() {
            const update = () => {
                if (!isRunning) return;
                const now = Date.now();
                let phaseElapsed = phaseAccum + (phaseStartTime ? (now - phaseStartTime) : 0);
                document.getElementById('phaseClock').textContent = formatTime(phaseElapsed);
                if (currentPhase === 'course') lapData.courseMs = phaseElapsed;
                else if (currentPhase === 'tir') lapData.tirMs = phaseElapsed;
                else if (currentPhase === 'penalite') lapData.penaliteMs = phaseElapsed;
                tickHandle = requestAnimationFrame(update);
            };
            tickHandle = requestAnimationFrame(update);
        }

        function formatTime(ms) {
            ms = Math.max(0, Math.round(ms));
            const cs = Math.floor((ms % 1000) / 10);
            const s = Math.floor(ms / 1000) % 60;
            const m = Math.floor(ms / 60000);
            const pad = (n, l = 2) => String(n).padStart(l, '0');
            return `${pad(m)}:${pad(s)}.${pad(cs)}`;
        }

        function stopAllTimers() {
            if (isRunning) stopTimer();
            if (tickHandle) cancelAnimationFrame(tickHandle);
            tickHandle = null;
        }

        function updateGiantButton() {
            const btn = document.getElementById('giantActionBtn');
            if (currentPhase === 'course') { btn.textContent = isRunning ? 'Arrivée au tir' : `Démarrer la course (Série ${currentSerie+1})`; btn.className = 'btn-action course'; }
            else if (currentPhase === 'tir') { btn.textContent = 'Valider le tir'; btn.className = 'btn-action tir'; }
            else if (currentPhase === 'penalite') { btn.textContent = 'Effectuer les pénalités'; btn.className = 'btn-action pen'; }
        }

        // =====================================================================
        // GIANT ACTION
        // =====================================================================
        window.onGiantAction = function() {
            if (modeActuel === 'mille' || modeActuel === 'killbill') return;
            if (currentPhase === 'course') {
                if (!isRunning) startTimer();
                else {
                    stopTimer();
                    lapData.courseMs = phaseAccum;
                    setPhase('tir');
                }
            } else if (currentPhase === 'tir') {
                validerTir();
            }
        };

        // =====================================================================
        // TIR MODULE
        // =====================================================================
        function genererZonesFleches() {
            const container = document.getElementById('flechesContainer');
            let html = '';
            for (let i = 0; i < nbFlechesActuel; i++) {
                html += `<div class="shot-box">Flèche ${i+1} : <span id="shotLabel${i+1}" class="shot-score">--</span></div>`;
            }
            container.innerHTML = html;
            document.getElementById('resultatTirSpecifique').textContent = "";
            lapData.shots = [];
            document.getElementById('btnValider').disabled = true;
            document.getElementById('btnValider').classList.add('opacity-40');
            document.getElementById('btnValider').textContent = 'Valider le tir';
            document.getElementById('errorMessage').style.display = 'none';
        }

        window.marquerTir = function(pts) {
            if (lapData.shots.length >= nbFlechesActuel) return;
            if (effetCarte === 'halfScore') pts = Math.floor(pts / 2);
            lapData.shots.push(pts);
            const label = document.getElementById(`shotLabel${lapData.shots.length}`);
            if (label) label.textContent = pts;
            updateTirUI();
        };

        window.annulerTir = function() {
            if (lapData.shots.length === 0) return;
            const idx = lapData.shots.length;
            lapData.shots.pop();
            const label = document.getElementById(`shotLabel${idx}`);
            if (label) label.textContent = '--';
            updateTirUI();
        };

        function updateTirUI() {
            const btn = document.getElementById('btnValider');
            if (lapData.shots.length === nbFlechesActuel) {
                btn.disabled = false;
                btn.classList.remove('opacity-40');
                const ptsTir = lapData.shots.reduce((a, b) => a + b, 0);
                const resDiv = document.getElementById('resultatTirSpecifique');
                if (modeActuel === 'poursuite' || modeActuel === 'relais') {
                    let pen = (ptsTir < 7) ? 3 : (ptsTir < 12) ? 2 : (ptsTir < 16) ? 1 : 0;
                    if (effetCarte === 'noPenalty' && ptsTir > 10) pen = 0;
                    lapData.penReq = pen;
                    resDiv.innerHTML = `Pénalité : <span class="text-red-400 text-lg">${pen} tour(s)</span>`;
                    btn.textContent = pen > 0 ? 'Valider & pénalités' : 'Valider le tir';
                } else if (modeActuel === 'sprint') {
                    let bonus = (ptsTir < 7) ? 0 : (ptsTir < 12) ? 10 : (ptsTir < 16) ? 15 : 20;
                    resDiv.innerHTML = `Bonus : <span class="text-emerald-400 text-lg">-${bonus} sec</span>`;
                    btn.textContent = 'Valider le tir';
                } else {
                    resDiv.innerHTML = `Total : <span class="text-blue-400 text-lg">${ptsTir} pts</span>`;
                    btn.textContent = 'Valider le tir';
                }
            } else {
                btn.disabled = true;
                btn.classList.add('opacity-40');
                document.getElementById('resultatTirSpecifique').textContent = "";
                btn.textContent = 'Valider le tir';
                const errorDiv = document.getElementById('errorMessage');
                errorDiv.textContent = `❗ Vous devez tirer ${nbFlechesActuel} flèche(s) avant de valider. (Actuellement : ${lapData.shots.length})`;
                errorDiv.style.display = 'block';
            }
        }

        // =====================================================================
        // VALIDER TIR
        // =====================================================================
        window.validerTir = function() {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.style.display = 'none';

            if (lapData.shots.length !== nbFlechesActuel) {
                errorDiv.textContent = `❗ Vous devez tirer ${nbFlechesActuel} flèche(s) avant de valider. (Actuellement : ${lapData.shots.length})`;
                errorDiv.style.display = 'block';
                return;
            }

            if (isRunning) stopTimer();
            lapData.tirMs = phaseAccum;

            if (modeActuel === 'mille') {
                finishMille();
                return;
            }

            if (lapData.penReq > 0 && (modeActuel === 'poursuite' || modeActuel === 'relais')) {
                setPhase('penalite');
                renderPenalites();
                return;
            }

            finishLap();
        };

        // =====================================================================
        // FINISH LAP (avec enchaînement des séries)
        // =====================================================================
        function finishLap() {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.style.display = 'none';
            try {
                const totalLap = lapData.courseMs + lapData.tirMs + lapData.penaliteMs;
                const ptsTir = lapData.shots.reduce((a, b) => a + b, 0);
                let vitesse = 0, ptsVMA = 0;
                const key = `${currentEq}-${currentMaillot}`;
                const vmaRef = seanceConfig.vmaReference[key] || 12;
                if (lapData.courseMs > 0) {
                    const distanceKm = seanceConfig.distanceTotale / 1000;
                    const tempsHeures = (lapData.courseMs / 1000) / 3600;
                    if (tempsHeures > 0) {
                        vitesse = distanceKm / tempsHeures;
                        ptsVMA = (vitesse >= vmaRef + 1) ? 3 : (vitesse >= vmaRef - 0.5) ? 2 : (vitesse >= vmaRef - 1) ? 1 : 0;
                    }
                }
                if (!isFinite(vitesse)) vitesse = 0;
                if (!isFinite(ptsVMA)) ptsVMA = 0;

                const passageData = {
                    equipe: currentEq, maillot: currentMaillot,
                    ptsVMA: Math.round(ptsVMA), ptsTir: Math.round(ptsTir),
                    vitesse: Math.round(vitesse * 10) / 10,
                    temps: Math.round(totalLap),
                    courseMs: Math.round(lapData.courseMs),
                    tirMs: Math.round(lapData.tirMs),
                    penaliteMs: Math.round(lapData.penaliteMs),
                    shots: lapData.shots.map(s => Math.round(s)),
                    penReq: lapData.penReq, penDone: lapData.penDone,
                    serie: currentSerie + 1, timestamp: Date.now(), mode: modeActuel
                };

                db.ref('arcathlon/live/passages').push().set(passageData)
                    .then(() => {
                        // Mise à jour locale
                        if (scoresCoureur[key]) {
                            scoresCoureur[key].series[currentSerie] = {
                                course: passageData.ptsVMA,
                                tir: passageData.ptsTir,
                                temps: passageData.temps,
                                vitesse: passageData.vitesse
                            };
                        }
                        // Vérifier s'il reste des séries
                        const nextSerie = currentSerie + 1;
                        if (nextSerie < seanceConfig.nbSeries) {
                            // Passer à la série suivante
                            currentSerie = nextSerie;
                            document.getElementById('currentSerieChip').textContent = currentSerie + 1;
                            document.getElementById('infoSerieVMA').textContent = `Série ${currentSerie + 1}/${seanceConfig.nbSeries} | VMA: ${seanceConfig.vmaReference[key] || '?'}`;
                            // Réinitialiser le tour et repasser en phase course
                            resetLap(); // remet le chrono et le bouton à zéro
                            setPhase('course');
                            document.getElementById('giantActionBtn').textContent = `Démarrer la course (Série ${currentSerie+1})`;
                            // On laisse l'élève démarrer la prochaine course
                        } else {
                            // Toutes les séries sont terminées
                            if (scoresCoureur[key]) scoresCoureur[key].complet = true;
                            passageActuel++;
                            retourCoureurs();
                        }
                    })
                    .catch(() => {
                        errorDiv.textContent = "❌ Erreur réseau. Retour à la grille.";
                        errorDiv.style.display = 'block';
                        setTimeout(() => retourCoureurs(), 2000);
                    });
            } catch (e) {
                errorDiv.textContent = "❌ Erreur interne. Retour à la grille.";
                errorDiv.style.display = 'block';
                setTimeout(() => retourCoureurs(), 2000);
            }
        }

        function finishMille() {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.style.display = 'none';
            try {
                const ptsTir = lapData.shots.reduce((a, b) => a + b, 0);
                const totalLap = 18000 + lapData.tirMs + lapData.penaliteMs;
                const passageData = {
                    equipe: currentEq, maillot: currentMaillot,
                    ptsVMA: 0, ptsTir: Math.round(ptsTir),
                    vitesse: 0, temps: Math.round(totalLap),
                    courseMs: 18000, tirMs: Math.round(lapData.tirMs), penaliteMs: Math.round(lapData.penaliteMs),
                    shots: lapData.shots.map(s => Math.round(s)),
                    penReq: 0, penDone: 0,
                    serie: currentSerie + 1, timestamp: Date.now(), mode: 'mille'
                };
                db.ref('arcathlon/live/passages').push().set(passageData)
                    .then(() => {
                        const key = `${currentEq}-${currentMaillot}`;
                        if (scoresCoureur[key]) {
                            scoresCoureur[key].series[currentSerie] = { course: 0, tir: ptsTir, temps: totalLap, vitesse: 0 };
                        }
                        const nextSerie = currentSerie + 1;
                        if (nextSerie < seanceConfig.nbSeries) {
                            currentSerie = nextSerie;
                            document.getElementById('currentSerieChip').textContent = currentSerie + 1;
                            document.getElementById('infoSerieVMA').textContent = `Série ${currentSerie + 1}/${seanceConfig.nbSeries} | VMA: ${seanceConfig.vmaReference[key] || '?'}`;
                            resetLap();
                            setPhase('course');
                            document.getElementById('giantActionBtn').textContent = `Démarrer la course (Série ${currentSerie+1})`;
                        } else {
                            if (scoresCoureur[key]) scoresCoureur[key].complet = true;
                            passageActuel++;
                            retourCoureurs();
                        }
                    })
                    .catch(() => {
                        errorDiv.textContent = "❌ Erreur réseau. Retour à la grille.";
                        errorDiv.style.display = 'block';
                        setTimeout(() => retourCoureurs(), 2000);
                    });
            } catch (e) {
                errorDiv.textContent = "❌ Erreur interne. Retour à la grille.";
                errorDiv.style.display = 'block';
                setTimeout(() => retourCoureurs(), 2000);
            }
        }

        // =====================================================================
        // PENALITE (identique)
        // =====================================================================
        function renderPenalites() {
            const row = document.getElementById('penlapsRow');
            row.innerHTML = '';
            for (let i = 0; i < lapData.penReq; i++) {
                const btn = document.createElement('button');
                btn.className = 'penlap' + (i < lapData.penDone ? ' done' : '');
                btn.textContent = `Tour ${i+1}`;
                btn.onclick = () => clickPenalty(i);
                row.appendChild(btn);
            }
            document.getElementById('penReq').textContent = lapData.penReq;
            document.getElementById('penDone').textContent = lapData.penDone;
            if (!isRunning) startTimer();
            document.getElementById('giantActionBtn').textContent = 'Effectuer les pénalités';
            document.getElementById('giantActionBtn').className = 'btn-action pen';
        }

        function clickPenalty(index) {
            const btns = document.querySelectorAll('#penlapsRow .penlap');
            if (index >= btns.length || btns[index].classList.contains('done')) return;
            btns[index].classList.add('done');
            lapData.penDone++;
            document.getElementById('penDone').textContent = lapData.penDone;
            if (lapData.penDone >= lapData.penReq) {
                if (isRunning) stopTimer();
                lapData.penaliteMs = phaseAccum;
                finishLap();
            }
        }

        // =====================================================================
        // RELAIS CARTES
        // =====================================================================
        window.tirerCarteRelais = function() {
            const carte = cartesRelais[Math.floor(Math.random() * cartesRelais.length)];
            document.getElementById('btnTirerCarte').classList.add('hidden');
            const affichage = document.getElementById('carteAffichee');
            affichage.textContent = carte.nom;
            affichage.classList.remove('hidden');
            if (carte.effet) carte.effet();
        };

        function updateInfoFleches() {
            let span = document.getElementById('infoFleches');
            if (!span) { span = document.createElement('span'); span.id = 'infoFleches'; span.className = 'text-xs font-bold text-slate-400 ml-2'; document.getElementById('infoSerieVMA').appendChild(span); }
            span.textContent = `Flèches : ${nbFlechesActuel}`;
        }

        // =====================================================================
        // MILLE
        // =====================================================================
        window.startTimer18 = function() {
            let timeLeft = 18;
            document.getElementById('btnStart18').classList.add('hidden');
            const display = document.getElementById('chrono18s');
            display.textContent = timeLeft;
            display.classList.replace('text-emerald-400', 'text-yellow-400');
            timer18Interval = setInterval(() => {
                timeLeft--;
                display.textContent = timeLeft;
                if (timeLeft <= 5) display.classList.replace('text-yellow-400', 'text-red-500');
                if (timeLeft <= 0) {
                    clearInterval(timer18Interval);
                    display.classList.replace('text-red-500', 'text-emerald-400');
                    display.textContent = "TIR !";
                    document.getElementById('moduleMille').classList.add('hidden');
                    currentPhase = 'tir';
                    document.getElementById('moduleSaisieTir').style.display = 'flex';
                    genererZonesFleches();
                    const panel = document.getElementById('phasePanel');
                    panel.className = 'phase-panel panel-tir';
                    document.getElementById('phaseName').textContent = 'TIR';
                    document.getElementById('phaseClock').textContent = '00:00.00';
                    phaseAccum = 0;
                    phaseStartTime = Date.now();
                    isRunning = true;
                    tickLoop();
                    document.getElementById('giantActionBtn').style.display = 'block';
                    document.getElementById('giantActionBtn').textContent = 'Valider le tir';
                    document.getElementById('giantActionBtn').className = 'btn-action tir';
                    document.getElementById('btnValider').textContent = 'Valider le tir (Mille)';
                }
            }, 1000);
        };

        // =====================================================================
        // KILL BILL (identique)
        // =====================================================================
        function initKillBill() {
            const autres = Object.keys(equipesConfig).filter(eq => eq !== currentEq);
            killBillState.equipeAdverse = autres.length ? autres[0] : 'Équipe X';
            document.getElementById('adversaireLabel').textContent = killBillState.equipeAdverse;
            killBillState.scoreNous = 0; killBillState.scoreEux = 0; killBillState.tirsNous = 0; killBillState.tirsEux = 0;
            killBillState.maxTirs = seanceConfig.nbFleches || 2;
            document.getElementById('scoreNous').textContent = '0'; document.getElementById('scoreEux').textContent = '0';
            document.getElementById('messageDuel').textContent = `Tire une flèche pour ton équipe (1/${killBillState.maxTirs})`;
            document.getElementById('btnValiderDuel').disabled = true;
            document.getElementById('btnValiderDuel').classList.add('opacity-40');
        }
        window.tirerDuel = function(pts) {
            if (killBillState.tirsNous < killBillState.maxTirs) {
                killBillState.scoreNous += pts; killBillState.tirsNous++;
                document.getElementById('scoreNous').textContent = killBillState.scoreNous;
                document.getElementById('messageDuel').textContent = killBillState.tirsNous < killBillState.maxTirs ? 
                    `Tire une flèche pour ton équipe (${killBillState.tirsNous+1}/${killBillState.maxTirs})` : 
                    `Tire maintenant pour l'équipe adverse (1/${killBillState.maxTirs})`;
            } else if (killBillState.tirsEux < killBillState.maxTirs) {
                killBillState.scoreEux += pts; killBillState.tirsEux++;
                document.getElementById('scoreEux').textContent = killBillState.scoreEux;
                document.getElementById('messageDuel').textContent = killBillState.tirsEux < killBillState.maxTirs ? 
                    `Tire pour l'adversaire (${killBillState.tirsEux+1}/${killBillState.maxTirs})` : 
                    "Duel terminé ! Clique sur Valider";
                if (killBillState.tirsEux >= killBillState.maxTirs) {
                    document.getElementById('btnValiderDuel').disabled = false;
                    document.getElementById('btnValiderDuel').classList.remove('opacity-40');
                }
            }
        };
        window.annulerDuel = function() { initKillBill(); };
        window.validerDuel = function() {
            const diff = killBillState.scoreNous - killBillState.scoreEux;
            let penalite = (diff < 0) ? (Math.abs(diff) < 5 ? 2 : 3) : (diff > 0 ? (diff < 5 ? 0 : 1) : 0);
            const ptsTir = killBillState.scoreNous;
            const passageData = {
                equipe: currentEq, maillot: currentMaillot,
                ptsVMA: 0, ptsTir: ptsTir,
                penalites: penalite,
                vitesse: 0, temps: 0,
                serie: currentSerie + 1, timestamp: Date.now(), mode: 'killbill'
            };
            db.ref('arcathlon/live/passages').push().set(passageData)
                .then(() => {
                    const key = `${currentEq}-${currentMaillot}`;
                    if (scoresCoureur[key]) scoresCoureur[key].series[currentSerie].tir = ptsTir;
                    const nextSerie = currentSerie + 1;
                    if (nextSerie < seanceConfig.nbSeries) {
                        currentSerie = nextSerie;
                        document.getElementById('currentSerieChip').textContent = currentSerie + 1;
                        document.getElementById('infoSerieVMA').textContent = `Série ${currentSerie + 1}/${seanceConfig.nbSeries} | VMA: ${seanceConfig.vmaReference[key] || '?'}`;
                        resetLap();
                        setPhase('course');
                        document.getElementById('giantActionBtn').textContent = `Démarrer la course (Série ${currentSerie+1})`;
                    } else {
                        if (scoresCoureur[key]) scoresCoureur[key].complet = true;
                        passageActuel++;
                        retourCoureurs();
                    }
                })
                .catch(() => { alert("Erreur réseau. Retour à la grille."); retourCoureurs(); });
        };

        // =====================================================================
        // CONNEXION
        // =====================================================================
        db.ref('.info/connected').on('value', snap => {
            document.getElementById('connDot').className = "w-3 h-3 rounded-full " + (snap.val() ? "bg-emerald-500" : "bg-red-500");
            document.getElementById('connLabel').textContent = snap.val() ? "En ligne" : "Hors ligne";
        });

        // =====================================================================
        // INIT
        // =====================================================================
        document.addEventListener('DOMContentLoaded', function() {
            const info = document.getElementById('infoSerieVMA');
            const span = document.createElement('span');
            span.id = 'infoFleches';
            span.className = 'text-xs font-bold text-slate-400 ml-2';
            span.textContent = 'Flèches : 2';
            info.appendChild(span);
            document.getElementById('phasePanel').classList.add('hidden');
        });
        console.log("✅ Arcathlon élève - version avec enchaînement des séries");
    </script>
</body>
</html>
