<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Arcathlon | Élève</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
    <style>
        * { touch-action: manipulation; user-select: none; -webkit-user-select: none; }
        body { background: #0f172a; }
        .btn-tap:active { transform: scale(0.96); }
        .cible-circle { cursor: pointer; transition: opacity 0.15s; }
        .cible-circle:active { opacity: 0.6; }
        @keyframes pulse-impact { 0% { transform: scale(1); stroke-width: 0; } 50% { transform: scale(1.05); stroke-width: 4px; stroke: #fff; } 100% { transform: scale(1); stroke-width: 0; } }
        .impact { animation: pulse-impact 0.3s ease-out; }
        .score-badge { background: #1e293b; border-radius: 999px; padding: 2px 10px; font-size: 0.75rem; font-weight: bold; color: #a5b4fc; border: 1px solid #4f46e5; }
        .icone-statut { font-size: 1.1rem; margin: 0 1px; }
        .alerte-triche { color: #ef4444; font-weight: 900; background: rgba(239,68,68,0.2); padding: 4px 8px; border-radius: 8px; border: 1px solid #ef4444; }
    </style>
</head>
<body class="text-white p-4 h-screen flex flex-col font-sans">

    <!-- En-tête Statut -->
    <div class="flex justify-between items-center mb-3 shrink-0 px-2">
        <div id="connStatus" class="flex items-center gap-2 text-xs font-bold uppercase tracking-widest text-slate-400">
            <span id="connDot" class="w-3 h-3 rounded-full bg-slate-600"></span>
            <span id="connLabel">Connexion...</span>
        </div>
        <div id="modeBadge" class="text-xs font-black uppercase tracking-widest text-blue-400 border border-blue-800 px-3 py-1 rounded-full bg-blue-950/40">
            Mode: Sprint | <span id="seanceInfo">Séance non chargée</span>
        </div>
    </div>

    <!-- ZONE PRINCIPALE -->
    <div class="bg-slate-900 border-4 border-slate-800 p-6 rounded-[2.5rem] shadow-2xl flex-1 flex flex-col max-w-4xl mx-auto w-full relative overflow-hidden">
        
        <!-- ECRAN 1 : CHOIX EQUIPE & PIN -->
        <div id="ecranLogin" class="flex flex-col items-center justify-center flex-1">
            <h1 class="text-5xl font-black text-center text-blue-500 uppercase tracking-widest mb-8 italic">Arcathlon</h1>
            <select id="selEquipe" onchange="checkTeamSelection()" class="w-full max-w-md bg-black p-5 rounded-2xl text-2xl font-black uppercase text-center border-4 border-slate-700 outline-none mb-6 text-white">
                <option value="">-- CHOISIR L'ÉQUIPE --</option>
            </select>
            <div id="numpad" class="hidden flex-col items-center">
                <div class="text-xs font-bold text-slate-400 mb-2 uppercase tracking-widest">Code PIN Équipe (3 chiffres)</div>
                <div id="pinDisplay" class="bg-slate-950 border-2 border-slate-700 w-48 h-14 rounded-xl flex items-center justify-center text-3xl font-mono tracking-[0.6em] mb-4 text-emerald-400 shadow-inner"></div>
                <div class="grid grid-cols-3 gap-3">
                    <script>
                        for(let i=1; i<=9; i++) document.write(`<button onclick="addPin(${i})" class="btn-tap bg-slate-800 w-16 h-16 rounded-xl text-2xl font-black active:bg-blue-600">${i}</button>`);
                    </script>
                    <button onclick="clearPin()" class="btn-tap bg-red-950 text-red-400 w-16 h-16 rounded-xl text-xs font-black uppercase border border-red-800 active:bg-red-800">Effacer</button>
                    <button onclick="addPin(0)" class="btn-tap bg-slate-800 w-16 h-16 rounded-xl text-2xl font-black active:bg-blue-600">0</button>
                    <button onclick="validatePin()" class="btn-tap bg-emerald-600 text-white w-16 h-16 rounded-xl text-xs font-black uppercase border-2 border-emerald-400 active:bg-emerald-700">OK</button>
                </div>
            </div>
        </div>

        <!-- ECRAN 2 : CHOIX COUREUR (MAILLOT) -->
        <div id="ecranCoureurs" class="hidden flex-col flex-1">
            <button onclick="resetLogin()" class="text-slate-400 font-bold text-sm uppercase tracking-widest text-left mb-4">↩ Changer d'équipe</button>
            <h2 id="titreEquipe" class="text-3xl font-black text-center text-slate-200 uppercase tracking-widest mb-6">Équipe X</h2>
            <div id="maillotsGrid" class="grid grid-cols-2 gap-4 flex-1 content-center"></div>
            <div class="mt-6 pt-4 border-t border-slate-800 text-center shrink-0">
                <button onclick="toggleHistorique()" class="bg-slate-800 px-6 py-3 rounded-xl font-bold text-xs text-slate-300 uppercase tracking-widest border border-slate-700 active:bg-slate-700">📜 Historique Équipe</button>
            </div>
        </div>

        <!-- ECRAN 3 : CHRONOMÉTRAGE -->
        <div id="ecranChrono" class="hidden flex-col h-full">
            <button onclick="retourCoureurs()" class="text-slate-400 font-bold text-sm uppercase tracking-widest text-left mb-2 shrink-0">↩ Retour</button>
            <div class="text-center font-black text-2xl text-slate-300 mb-4 bg-slate-950 py-3 rounded-xl border-2 border-slate-800 shrink-0">
                <span id="coureurLabel">Maillot</span>
            </div>
            <div class="flex-1 flex flex-col items-center justify-center gap-6">
                <div class="text-6xl font-mono font-bold tabular-nums text-emerald-400 bg-black/40 px-8 py-4 rounded-3xl border border-slate-800" id="chronoDisplay">00:00.00</div>
                <div class="flex gap-4">
                    <button id="btnDepart" onclick="demarrerChrono()" class="btn-tap bg-green-600 text-white w-36 h-20 rounded-2xl font-black text-2xl uppercase tracking-widest shadow-xl active:bg-green-700">Départ</button>
                    <button id="btnArrivee" onclick="arreterChrono()" class="btn-tap bg-red-600 text-white w-36 h-20 rounded-2xl font-black text-2xl uppercase tracking-widest shadow-xl active:bg-red-700 disabled:opacity-40" disabled>Arrivée</button>
                </div>
                <div class="w-full max-w-md bg-slate-800/80 p-4 rounded-2xl border border-slate-700 text-sm">
                    <div class="flex justify-between mb-1"><span class="font-bold text-slate-400">Série :</span><span id="serieActuelle" class="font-bold text-emerald-400">1/3</span></div>
                    <div class="flex justify-between mb-1"><span class="font-bold text-slate-400">Tours :</span><span id="toursInfo" class="font-bold text-emerald-400">3 tours (1200 m)</span></div>
                    <div class="flex justify-between mb-1"><span class="font-bold text-slate-400">Temps :</span><span id="tempsAffiche" class="font-bold text-emerald-400">00:00.00</span></div>
                    <div class="flex justify-between"><span class="font-bold text-slate-400">Vitesse :</span><span id="vitesseAffiche" class="font-bold text-emerald-400">0 km/h</span></div>
                </div>
            </div>
        </div>

        <!-- ECRAN 4 : SAISIE TIR -->
        <div id="ecranSaisie" class="hidden flex-col h-full">
            <button onclick="retourCoureurs()" class="text-slate-400 font-bold text-sm uppercase tracking-widest text-left mb-2 shrink-0">↩ Retour</button>
            <div class="text-center font-black text-xl text-slate-300 mb-3 bg-slate-950 py-2 rounded-xl border border-slate-800 shrink-0" id="labelCoureur"></div>
            <div class="flex-1 flex gap-6 min-h-0">
                <!-- Cible -->
                <div class="flex-1 bg-black rounded-3xl border-2 border-slate-800 p-4 flex flex-col items-center justify-center relative shadow-inner">
                    <span class="absolute top-3 text-[10px] font-black text-slate-500 uppercase tracking-widest">Saisir les impacts 🎯</span>
                    <svg viewBox="0 0 100 100" class="w-full max-w-[240px] mx-auto drop-shadow-2xl">
                        <circle cx="50" cy="50" r="45" fill="#3b82f6" class="cible-circle" onclick="marquerTir(6, 'Zone Bleue')" />
                        <circle cx="50" cy="50" r="30" fill="#ef4444" class="cible-circle" onclick="marquerTir(8, 'Zone Rouge')" />
                        <circle cx="50" cy="50" r="15" fill="#eab308" class="cible-circle" onclick="marquerTir(10, 'Centre Jaune')" />
                    </svg>
                    <div class="grid grid-cols-2 gap-2 mt-4 w-full">
                        <button onclick="marquerTir(5, 'Bord / Touché')" class="btn-tap bg-slate-800 text-xs font-bold py-3 rounded-xl border border-slate-600 text-slate-300">+5 (Bord)</button>
                        <button onclick="marquerTir(0, 'Manqué')" class="btn-tap bg-red-950/50 text-xs font-bold py-3 rounded-xl border border-red-900 text-red-400">0 (Manqué)</button>
                    </div>
                </div>
                <!-- Panneau Flèches -->
                <div class="flex-1 flex flex-col gap-3">
                    <div class="bg-slate-900 p-4 rounded-2xl border border-slate-700 flex flex-col gap-2" id="flechesContainer"></div>
                    <button id="btnValider" onclick="validerPassage()" disabled class="btn-tap bg-emerald-600 border-2 border-emerald-400 py-5 rounded-2xl font-black text-xl uppercase tracking-widest text-white shadow-xl opacity-40 transition-opacity">
                        Valider <span id="totalPreview" class="text-base"></span>
                    </button>
                    <button onclick="annulerTir()" class="btn-tap bg-yellow-600/30 border border-yellow-600/60 py-3 rounded-xl font-bold text-xs uppercase text-yellow-400">↩ Annuler la flèche</button>
                </div>
            </div>
        </div>

        <!-- ECRAN HISTORIQUE -->
        <div id="ecranHistorique" class="hidden flex-col h-full absolute inset-0 bg-slate-950/95 p-6 z-50 backdrop-blur-md">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3 mb-4">
                <h2 class="text-xl font-black text-blue-400 uppercase tracking-widest italic">Historique de l'Équipe</h2>
                <button onclick="toggleHistorique()" class="bg-slate-800 px-4 py-2 rounded-xl font-bold uppercase text-xs text-slate-300">Fermer</button>
            </div>
            <div id="listHistorique" class="flex flex-col gap-3 overflow-y-auto flex-1"></div>
        </div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://arcathlon-eps-default-rtdb.europe-west1.firebasedatabase.app/" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let equipesConfig = {}, seanceConfig = {}, scoresCoureur = {};
        let currentEq = "", currentPin = "", currentMaillot = "", inputPin = "";
        let passageActuel = 1, tirs = [], chronoInterval = null;
        let tempsDepart = 0, tempsEcoule = 0, currentSerie = 0;
        let currentVitesse = 0, currentPointsCourse = 0;

        // Monitoring connexion
        db.ref('.info/connected').on('value', snap => {
            const isConn = !!snap.val();
            document.getElementById('connDot').className = "w-3 h-3 rounded-full " + (isConn ? "bg-emerald-500" : "bg-red-500");
            document.getElementById('connLabel').textContent = isConn ? "En ligne" : "Hors ligne";
        });

        // Sync configuration globale (Sans aucune donnée nominative)
        db.ref('arcathlon/config').on('value', snap => {
            const config = snap.val() || {};
            equipesConfig = config.equipes || {};
            seanceConfig = {
                seanceId: config.seanceId,
                longueurPiste: config.longueurPiste || 400,
                nbTours: config.nbTours || 3,
                nbSeries: config.nbSeries || 3,
                nbFleches: config.nbFleches || 2,
                distanceTotale: config.distanceTotale || 1200,
                vmaReference: config.vmaReference || {}
            };
            
            document.getElementById('seanceInfo').textContent = `Séance ${seanceConfig.seanceId ? seanceConfig.seanceId.substring(7, 15) : 'non chargée'}`;
            document.getElementById('toursInfo').textContent = `${seanceConfig.nbTours} tours (${seanceConfig.distanceTotale} m)`;

            // Initialiser structure locale des scores
            scoresCoureur = {};
            Object.keys(equipesConfig).forEach(eq => {
                (equipesConfig[eq].membres || []).forEach(m => {
                    const key = `${eq}-${m.maillot}`;
                    let nbS = seanceConfig.nbSeries;
                    if (m.remplaceAbsent) nbS += 1;
                    if (m.absent) nbS = 0;
                    scoresCoureur[key] = {
                        series: Array(nbS).fill(0).map(() => ({ course: 0, tir: 0, temps: 0, vitesse: 0 })),
                        complet: false
                    };
                });
            });

            const sel = document.getElementById('selEquipe');
            const valActuelle = sel.value;
            sel.innerHTML = `<option value="">-- CHOISIR L'ÉQUIPE --</option>` +
                Object.keys(equipesConfig).map(eq => `<option value="${eq}">ÉQUIPE ${eq}</option>`).join('');
            if (valActuelle && equipesConfig[valActuelle]) sel.value = valActuelle;

            if (currentEq && !equipesConfig[currentEq]) resetLogin();
            else if (currentEq && currentMaillot) buildCoureursGrid();
        });

        window.checkTeamSelection = function() {
            const val = document.getElementById('selEquipe').value;
            if (val) {
                currentEq = val;
                currentPin = equipesConfig[val].pin;
                inputPin = "";
                document.getElementById('pinDisplay').textContent = "";
                document.getElementById('numpad').classList.remove('hidden');
                document.getElementById('numpad').classList.add('flex');
            } else {
                document.getElementById('numpad').classList.add('hidden');
            }
        };

        window.addPin = function(num) {
            if (inputPin.length < 3) {
                inputPin += num;
                document.getElementById('pinDisplay').textContent = "•".repeat(inputPin.length);
            }
        };
        window.clearPin = function() { inputPin = ""; document.getElementById('pinDisplay').textContent = ""; };

        window.validatePin = function() {
            if (inputPin === currentPin) {
                document.getElementById('ecranLogin').classList.add('hidden');
                document.getElementById('ecranCoureurs').classList.remove('hidden');
                document.getElementById('ecranCoureurs').classList.add('flex');
                document.getElementById('titreEquipe').textContent = `Équipe ${currentEq}`;
                buildCoureursGrid();
            } else {
                alert("Code PIN incorrect.");
                clearPin();
            }
        };

        window.resetLogin = function() {
            clearInterval(chronoInterval);
            currentEq = ""; inputPin = ""; currentMaillot = "";
            document.getElementById('selEquipe').value = "";
            document.getElementById('numpad').classList.add('hidden');
            document.getElementById('ecranCoureurs').classList.add('hidden');
            document.getElementById('ecranChrono').classList.add('hidden');
            document.getElementById('ecranSaisie').classList.add('hidden');
            document.getElementById('ecranLogin').classList.remove('hidden');
            document.getElementById('ecranLogin').classList.add('flex');
            passageActuel = 1; tirs = []; currentSerie = 0;
        };

        function buildCoureursGrid() {
            const grid = document.getElementById('maillotsGrid');
            const membres = equipesConfig[currentEq]?.membres || [];
            let html = "";
            const colorMap = {
                'Rouge': 'bg-red-950/80 border-red-600 text-red-400',
                'Jaune': 'bg-yellow-950/80 border-yellow-600 text-yellow-400',
                'Bleu': 'bg-blue-950/80 border-blue-600 text-blue-400',
                'Vert': 'bg-green-950/80 border-green-600 text-green-400'
            };

            membres.forEach(m => {
                if (m.absent) {
                    html += `
                    <div class="border-4 border-slate-700 py-6 rounded-3xl flex flex-col items-center justify-center bg-slate-900/40 opacity-40">
                        <span class="font-black text-xl uppercase tracking-widest text-slate-400">${m.maillot}</span>
                        <div class="text-xs font-bold text-red-400 mt-2">⚠️ Absent</div>
                    </div>`;
                    return;
                }
                const key = `${currentEq}-${m.maillot}`;
                const scores = scoresCoureur[key] || { series: [], complet: false };
                const idxNonFait = scores.series.findIndex(s => s.course === 0);
                const complet = idxNonFait === -1;
                const total = scores.series.reduce((acc, s) => acc + s.course + s.tir, 0);

                let icones = '';
                scores.series.forEach((s, i) => {
                    let icone = '⬜';
                    if (s.course > 0) icone = s.course >= 2 ? '✅' : '❌';
                    icones += `<span class="icone-statut" title="Série ${i+1}">${icone}</span>`;
                });

                const cClass = colorMap[m.maillot] || 'bg-slate-800 border-slate-600 text-white';
                const disabledClass = complet ? 'opacity-50 pointer-events-none' : 'btn-tap';
                const scoreDisplay = total > 0 ? `<span class="score-badge mt-1">${total} pts</span>` : '';
                const remplaceBadge = m.remplaceAbsent ? ' ⭐' : '';

                html += `
                <button onclick="${complet ? '' : `openChrono('${m.maillot}')`}"
                        class="${cClass} border-4 py-6 rounded-3xl flex flex-col items-center justify-center shadow-lg ${disabledClass}">
                    <span class="font-black text-2xl uppercase tracking-widest">${m.maillot}${remplaceBadge}</span>
                    <span class="text-xs font-bold mt-1 text-slate-300">VMA Cible: ${m.vma || '12'} km/h</span>
                    <div class="flex items-center gap-1 mt-2">${icones}</div>
                    ${scoreDisplay}
                    ${complet ? `<div class="text-xs font-bold text-emerald-400 mt-1">✓ Terminé</div>` : ''}
                </button>`;
            });
            grid.innerHTML = html;
        }

        window.openChrono = function(maillot) {
            currentMaillot = maillot;
            const key = `${currentEq}-${maillot}`;
            const idxNonFait = scoresCoureur[key].series.findIndex(s => s.course === 0);
            currentSerie = idxNonFait !== -1 ? idxNonFait : 0;
            
            document.getElementById('ecranCoureurs').classList.add('hidden');
            document.getElementById('ecranChrono').classList.remove('hidden');
            document.getElementById('ecranChrono').classList.add('flex');
            
            const colorTexte = {'Vert':'text-green-400','Bleu':'text-blue-400','Jaune':'text-yellow-400','Rouge':'text-red-400'}[maillot];
            document.getElementById('coureurLabel').innerHTML = `
                <span class="${colorTexte}">Maillot ${maillot}</span>
                <div class="text-xs font-bold text-slate-400 mt-1">
                    Série ${currentSerie + 1}/${scoresCoureur[key].series.length} |
                    VMA Cible: <span>${seanceConfig.vmaReference[key] || 'N/A'}</span> km/h
                </div>`;
            document.getElementById('serieActuelle').textContent = `${currentSerie + 1}/${scoresCoureur[key].series.length}`;
            resetChrono();
        };

        window.retourCoureurs = function() {
            clearInterval(chronoInterval);
            document.getElementById('ecranChrono').classList.add('hidden');
            document.getElementById('ecranSaisie').classList.add('hidden');
            document.getElementById('ecranCoureurs').classList.remove('hidden');
            document.getElementById('ecranCoureurs').classList.add('flex');
            buildCoureursGrid();
        };

        function demarrerChrono() {
            tempsDepart = Date.now() - tempsEcoule;
            chronoInterval = setInterval(mettreAJourChrono, 30);
            document.getElementById('btnDepart').disabled = true;
            document.getElementById('btnArrivee').disabled = false;
        }

        function mettreAJourChrono() {
            tempsEcoule = Date.now() - tempsDepart;
            const ms = tempsEcoule;
            const minutes = Math.floor(ms / 60000).toString().padStart(2, '0');
            const secondes = Math.floor((ms % 60000) / 1000).toString().padStart(2, '0');
            const centiemes = Math.floor((ms % 1000) / 10).toString().padStart(2, '0');
            document.getElementById('chronoDisplay').textContent = `${minutes}:${secondes}.${centiemes}`;
        }

        function arreterChrono() {
            clearInterval(chronoInterval);
            const secondesTotales = tempsEcoule / 1000;
            if (secondesTotales < 5) {
                alert("Durée trop courte ! Chronomètre réinitialisé.");
                resetChrono();
                return;
            }

            currentVitesse = (seanceConfig.distanceTotale / 1000) / (secondesTotales / 3600);
            document.getElementById('tempsAffiche').textContent = document.getElementById('chronoDisplay').textContent;
            document.getElementById('vitesseAffiche').textContent = `${currentVitesse.toFixed(1)} km/h`;

            let alerteTriche = currentVitesse > 18;
            if (alerteTriche) {
                alert("⚠️ Vitesse très élevée détectée (>18 km/h). Passage signalé au professeur.");
            }

            const key = `${currentEq}-${currentMaillot}`;
            const vmaRef = seanceConfig.vmaReference[key] || 12;
            let ptsVMA = 0;
            if (currentVitesse >= vmaRef + 1) ptsVMA = 3;
            else if (currentVitesse >= vmaRef - 0.5) ptsVMA = 2;
            else if (currentVitesse >= vmaRef - 1) ptsVMA = 1;
            currentPointsCourse = ptsVMA;

            if (currentSerie !== -1 && scoresCoureur[key]) {
                scoresCoureur[key].series[currentSerie].course = ptsVMA;
                scoresCoureur[key].series[currentSerie].vitesse = currentVitesse;
                scoresCoureur[key].series[currentSerie].temps = tempsEcoule;
            }

            document.getElementById('btnArrivee').disabled = true;
            setTimeout(() => {
                document.getElementById('ecranChrono').classList.add('hidden');
                document.getElementById('ecranSaisie').classList.remove('hidden');
                document.getElementById('ecranSaisie').classList.add('flex');
                
                const colorTexte = {'Vert':'text-green-400','Bleu':'text-blue-400','Jaune':'text-yellow-400','Rouge':'text-red-400'}[currentMaillot];
                document.getElementById('labelCoureur').innerHTML = `
                    <span class="${colorTexte}">Maillot ${currentMaillot}</span>
                    <div class="text-xs font-bold text-slate-400 mt-1">
                        Série ${currentSerie + 1}/${scoresCoureur[key].series.length} |
                        Vit: ${currentVitesse.toFixed(1)} km/h (${ptsVMA} pts VMA)
                        ${alerteTriche ? '<span class="alerte-triche ml-2">⚠️ Vitesse Suspecte</span>' : ''}
                    </div>`;
                genererZonesFleches();
                resetChrono();
                window._alerteTriche = alerteTriche;
            }, 400);
        }

        function resetChrono() {
            clearInterval(chronoInterval);
            tempsEcoule = 0;
            document.getElementById('chronoDisplay').textContent = "00:00.00";
            document.getElementById('btnDepart').disabled = false;
            document.getElementById('btnArrivee').disabled = true;
            document.getElementById('tempsAffiche').textContent = "00:00.00";
            document.getElementById('vitesseAffiche').textContent = "0 km/h";
        }

        function genererZonesFleches() {
            const container = document.getElementById('flechesContainer');
            let html = '';
            for (let i = 0; i < seanceConfig.nbFleches; i++) {
                html += `<div id="affF${i+1}" class="bg-black text-slate-500 font-bold text-base py-3 rounded-xl text-center border border-slate-800">Flèche ${i+1} : --</div>`;
            }
            container.innerHTML = html;
            tirs = [];
            updateTotal();
        }

        window.marquerTir = function(pts, zoneName) {
            if (tirs.length >= seanceConfig.nbFleches) return;
            tirs.push(pts);
            const aff = document.getElementById(`affF${tirs.length}`);
            aff.className = "bg-slate-800 text-white font-black text-base py-3 rounded-xl text-center border-2 border-slate-500 shadow impact";
            aff.innerHTML = `Flèche ${tirs.length} : <span class="text-blue-400">${pts} pts</span> <span class="text-[10px] block font-semibold text-slate-400">${zoneName}</span>`;
            updateTotal();
        };

        window.annulerTir = function() {
            if (tirs.length === 0) return;
            const idx = tirs.length;
            tirs.pop();
            const aff = document.getElementById(`affF${idx}`);
            aff.className = "bg-black text-slate-500 font-bold text-base py-3 rounded-xl text-center border border-slate-800";
            aff.textContent = `Flèche ${idx} : --`;
            updateTotal();
        };

        window.updateTotal = function() {
            const btn = document.getElementById('btnValider');
            if (tirs.length === seanceConfig.nbFleches) {
                const ptsTir = tirs.reduce((a, b) => a + b, 0);
                btn.disabled = false;
                btn.classList.remove('opacity-40');
                document.getElementById('totalPreview').textContent = `(${ptsTir} pts Tir)`;
            } else {
                btn.disabled = true;
                btn.classList.add('opacity-40');
                document.getElementById('totalPreview').textContent = `(${tirs.length}/${seanceConfig.nbFleches} flèches)`;
            }
        };

        window.validerPassage = function() {
            const btn = document.getElementById('btnValider');
            btn.disabled = true;
            const key = `${currentEq}-${currentMaillot}`;
            const ptsTir = tirs.reduce((a, b) => a + b, 0);
            scoresCoureur[key].series[currentSerie].tir = ptsTir;

            const complet = scoresCoureur[key].series.every(s => s.course > 0 || s.tir > 0);
            if (complet) scoresCoureur[key].complet = true;

            // Données strictement ANONYMES transmises au réseau
            const passageData = {
                equipe: currentEq,
                maillot: currentMaillot,
                ptsVMA: currentPointsCourse,
                ptsTir: ptsTir,
                vitesse: currentVitesse,
                temps: tempsEcoule,
                passage: passageActuel,
                serie: currentSerie + 1,
                timestamp: Date.now(),
                seanceId: seanceConfig.seanceId,
                alerteTriche: window._alerteTriche || false
            };

            const ref = db.ref('arcathlon/live/passages').push();
            ref.set(passageData).then(() => {
                passageActuel++;
                retourCoureurs();
            }).catch(() => {
                alert("Sauvegarde locale enregistrée. Vérifiez la connexion Wi-Fi.");
                retourCoureurs();
            });
        };

        window.toggleHistorique = function() {
            const panel = document.getElementById('ecranHistorique');
            if (panel.classList.contains('hidden')) {
                panel.classList.remove('hidden');
                panel.classList.add('flex');
                renderHistorique();
            } else {
                panel.classList.add('hidden');
            }
        };

        function renderHistorique() {
            const container = document.getElementById('listHistorique');
            const coureurKey = `${currentEq}-${currentMaillot}`;
            const scores = scoresCoureur[coureurKey] || { series: [] };
            if (!scores.series.length) {
                container.innerHTML = '<p class="text-slate-500 text-center py-6">Aucun passage enregistré pour ce maillot.</p>';
                return;
            }
            let html = `<div class="bg-slate-900 p-4 rounded-xl border border-slate-800"><h3 class="font-black text-blue-400 text-base mb-3">Maillot ${currentMaillot}</h3><div class="space-y-2">`;
            scores.series.forEach((s, idx) => {
                const totalSerie = s.course + s.tir;
                html += `
                <div class="bg-slate-950 p-3 rounded-lg border border-slate-800 flex justify-between items-center text-xs">
                    <div>
                        <div class="font-bold text-slate-200">Série ${idx + 1}</div>
                        <div class="text-slate-400 mt-1">Course: ${s.course} pts | Tir: ${s.tir} pts | Vit: ${s.vitesse ? s.vitesse.toFixed(1) : '-'} km/h</div>
                    </div>
                    <span class="text-emerald-400 font-black text-sm">${totalSerie} pts</span>
                </div>`;
            });
            html += `</div></div>`;
            container.innerHTML = html;
        }
    </script>
</body>
</html>
