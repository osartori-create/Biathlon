<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Arcathlon | Élève</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
    <style>
        * { touch-action: manipulation; user-select: none; -webkit-user-select: none; }
        body { background: #0f172a; font-family: sans-serif; }
        .btn-tap:active { transform: scale(0.96); }
        .cible-circle { cursor: pointer; transition: opacity 0.15s; }
        .cible-circle:active { opacity: 0.6; }
        @keyframes pulse-impact {
            0% { transform: scale(1); stroke-width: 0; }
            50% { transform: scale(1.05); stroke-width: 4px; stroke: #fff; }
            100% { transform: scale(1); stroke-width: 0; }
        }
        .impact { animation: pulse-impact 0.3s ease-out; }
        .score-badge { background: #1e293b; border-radius: 999px; padding: 2px 10px; font-size: 0.75rem; font-weight: bold; color: #a5b4fc; border: 1px solid #4f46e5; }
        .alerte-triche { color: #ef4444; font-weight: 900; background: rgba(239,68,68,0.2); padding: 4px 8px; border-radius: 8px; border: 1px solid #ef4444; }
        .role-badge { background: #1e293b; border-radius: 999px; padding: 2px 12px; font-size: 0.7rem; font-weight: bold; color: #fbbf24; border: 1px solid #f59e0b; }
    </style>
</head>
<body class="text-white p-4 h-screen flex flex-col">

    <!-- En-tête Statut -->
    <div class="flex justify-between items-center mb-3 shrink-0 px-2">
        <div id="connStatus" class="flex items-center gap-2 text-xs font-bold uppercase tracking-widest text-slate-400">
            <span id="connDot" class="w-3 h-3 rounded-full bg-slate-600"></span>
            <span id="connLabel">Connexion...</span>
        </div>
        <div class="text-xs font-black uppercase tracking-widest text-blue-400 border border-blue-800 px-3 py-1 rounded-full bg-blue-950/40">
            Mode: <span id="labelModeActuel">Sprint</span> | <span id="seanceInfo">--</span>
        </div>
    </div>

    <!-- ZONE PRINCIPALE -->
    <div class="bg-slate-900 border-4 border-slate-800 p-6 rounded-[2.5rem] shadow-2xl flex-1 flex flex-col max-w-4xl mx-auto w-full relative overflow-hidden">
        
        <!-- ================= ECRAN 1 : LOGIN ================= -->
        <div id="ecranLogin" class="flex flex-col items-center justify-center flex-1">
            <h1 class="text-5xl font-black text-center text-blue-500 uppercase tracking-widest mb-8 italic">Arcathlon</h1>
            <select id="selEquipe" onchange="checkTeamSelection()" class="w-full max-w-md bg-black p-5 rounded-2xl text-2xl font-black uppercase text-center border-4 border-slate-700 outline-none mb-6 text-white">
                <option value="">-- CHOISIR L'ÉQUIPE --</option>
            </select>
            <div id="numpad" class="hidden flex-col items-center">
                <div class="text-xs font-bold text-slate-400 mb-2 uppercase tracking-widest">Code PIN (3 chiffres)</div>
                <div id="pinDisplay" class="bg-slate-950 border-2 border-slate-700 w-48 h-14 rounded-xl flex items-center justify-center text-3xl font-mono tracking-[0.6em] mb-4 text-emerald-400 shadow-inner"></div>
                <div class="grid grid-cols-3 gap-3">
                    <script>
                        for(let i=1; i<=9; i++) document.write(`<button onclick="addPin(${i})" class="btn-tap bg-slate-800 w-16 h-16 rounded-xl text-2xl font-black active:bg-blue-600">${i}</button>`);
                    </script>
                    <button onclick="clearPin()" class="btn-tap bg-red-950 text-red-400 w-16 h-16 rounded-xl text-xs font-black uppercase border border-red-800 active:bg-red-800">Effacer</button>
                    <button onclick="addPin(0)" class="btn-tap bg-slate-800 w-16 h-16 rounded-xl text-2xl font-black active:bg-blue-600">0</button>
                    <button onclick="validatePin()" class="btn-tap bg-emerald-600 text-white w-16 h-16 rounded-xl text-xs font-black uppercase border-2 border-emerald-400 active:bg-emerald-700">OK</button>
                </div>
            </div>
        </div>

        <!-- ================= ECRAN 2 : GRILLE COUREURS ================= -->
        <div id="ecranCoureurs" class="hidden flex-col flex-1">
            <button onclick="resetLogin()" class="text-slate-400 font-bold text-sm uppercase tracking-widest text-left mb-4">↩ Changer d'équipe</button>
            <h2 id="titreEquipe" class="text-3xl font-black text-center text-slate-200 uppercase tracking-widest mb-6">Équipe X</h2>
            <div id="maillotsGrid" class="grid grid-cols-2 gap-4 flex-1 content-center"></div>
        </div>

        <!-- ================= ECRAN 3 : ACTION ================= -->
        <div id="ecranAction" class="hidden flex-col h-full">
            <button onclick="retourCoureurs()" class="text-slate-400 font-bold text-sm uppercase tracking-widest text-left mb-2 shrink-0">↩ Retour</button>
            
            <div class="text-center font-black text-xl text-slate-300 mb-4 bg-slate-950 py-3 rounded-xl border-2 border-slate-800 shrink-0 flex justify-center items-center gap-4 flex-wrap">
                <span id="coureurLabel">Maillot</span>
                <span id="infoSerieVMA" class="text-sm font-bold text-slate-400"></span>
                <span id="roleActuel" class="role-badge">Rôle : --</span>
            </div>

            <!-- MODULE RELAIS : Cartes Stratégiques -->
            <div id="moduleRelais" class="hidden flex-col items-center mb-4">
                <button id="btnTirerCarte" onclick="tirerCarteRelais()" class="bg-purple-600 px-6 py-3 rounded-xl font-black text-lg uppercase shadow-lg shadow-purple-900/50 btn-tap border-2 border-purple-400">🃏 Tirer une Carte Stratégie</button>
                <div id="carteAffichee" class="text-xl font-bold text-center bg-slate-800 p-4 rounded-xl border-2 border-purple-500 hidden text-purple-300 mt-2 w-full max-w-md"></div>
            </div>

            <!-- MODULE CHRONO CLASSIQUE (Sprint / Poursuite / Relais) -->
            <div id="moduleChrono" class="flex-1 flex flex-col items-center justify-center gap-6 hidden">
                <div class="text-6xl font-mono font-bold tabular-nums text-emerald-400 bg-black/40 px-8 py-4 rounded-3xl border border-slate-800" id="chronoDisplay">00:00.00</div>
                <div class="flex gap-4">
                    <button id="btnDepart" onclick="demarrerChrono()" class="btn-tap bg-green-600 text-white w-32 h-16 rounded-2xl font-black text-xl uppercase tracking-widest shadow-xl active:bg-green-700">Départ</button>
                    <button id="btnArrivee" onclick="arreterChrono()" class="btn-tap bg-red-600 text-white w-32 h-16 rounded-2xl font-black text-xl uppercase tracking-widest shadow-xl active:bg-red-700 disabled:opacity-40" disabled>Arrivée</button>
                </div>
                <div class="w-full max-w-md flex justify-between px-4 text-slate-400 font-bold text-sm">
                    <span>Temps: <span id="tempsAffiche" class="text-emerald-400">00:00.00</span></span>
                    <span>Vitesse: <span id="vitesseAffiche" class="text-emerald-400">0 km/h</span></span>
                </div>
            </div>

            <!-- MODULE "DANS LE 1000" (Compte à rebours 18s) -->
            <div id="moduleMille" class="flex-1 flex flex-col items-center justify-center gap-6 hidden">
                <div id="chrono18s" class="text-8xl font-mono font-black text-emerald-400 bg-black px-12 py-8 rounded-3xl border-4 border-slate-700">18</div>
                <button id="btnStart18" onclick="startTimer18()" class="btn-tap bg-blue-600 px-12 py-6 rounded-2xl font-black text-3xl uppercase border-4 border-blue-400 shadow-xl">Top Départ</button>
            </div>

            <!-- MODULE SAISIE TIR (standard) -->
            <div id="moduleSaisieTir" class="flex-1 gap-4 min-h-0 hidden mt-4">
                <div class="flex-1 bg-black rounded-3xl border-2 border-slate-800 p-2 flex flex-col items-center justify-center relative shadow-inner">
                    <svg viewBox="0 0 100 100" class="w-full max-w-[200px] mx-auto drop-shadow-2xl">
                        <circle cx="50" cy="50" r="45" fill="#3b82f6" class="cible-circle" onclick="marquerTir(6, 'Zone Bleue')" />
                        <circle cx="50" cy="50" r="30" fill="#ef4444" class="cible-circle" onclick="marquerTir(8, 'Zone Rouge')" />
                        <circle cx="50" cy="50" r="15" fill="#eab308" class="cible-circle" onclick="marquerTir(10, 'Centre Jaune')" />
                    </svg>
                    <div class="flex gap-2 mt-4 w-full px-2">
                        <button onclick="marquerTir(5, 'Bord')" class="flex-1 btn-tap bg-slate-800 text-xs font-bold py-3 rounded-xl border border-slate-600 text-slate-300">+5 (Bord)</button>
                        <button onclick="marquerTir(0, 'Manqué')" class="flex-1 btn-tap bg-red-950/50 text-xs font-bold py-3 rounded-xl border border-red-900 text-red-400">0 (Manqué)</button>
                    </div>
                </div>
                <div class="flex-1 flex flex-col gap-2">
                    <div class="bg-slate-900 p-3 rounded-2xl border border-slate-700 flex flex-col gap-2 flex-1" id="flechesContainer"></div>
                    <div id="resultatTirSpecifique" class="text-center font-black text-sm uppercase text-yellow-400 mb-2"></div>
                    <button id="btnValider" onclick="validerPassage()" disabled class="btn-tap bg-emerald-600 border-2 border-emerald-400 py-4 rounded-2xl font-black text-lg uppercase tracking-widest text-white shadow-xl opacity-40 transition-opacity">
                        Valider
                    </button>
                    <button onclick="annulerTir()" class="btn-tap bg-slate-800 border border-slate-600 py-2 rounded-xl font-bold text-xs uppercase text-slate-400">↩ Annuler flèche</button>
                </div>
            </div>

            <!-- MODULE KILL BILL (Duel 2v2) -->
            <div id="moduleKillBill" class="hidden flex-1 flex-col gap-4 mt-2">
                <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700 text-center">
                    <div class="text-sm font-bold text-slate-400">Adversaire : <span id="adversaireLabel" class="text-white">--</span></div>
                    <div class="flex justify-around mt-2 text-2xl font-black">
                        <span>Nous : <span id="scoreNous" class="text-emerald-400">0</span></span>
                        <span>Eux : <span id="scoreEux" class="text-red-400">0</span></span>
                    </div>
                    <div id="messageDuel" class="text-sm font-bold text-yellow-400 mt-2">Tire une flèche pour ton équipe</div>
                </div>
                <div class="flex-1 bg-black rounded-3xl border-2 border-slate-800 p-2 flex flex-col items-center justify-center">
                    <svg viewBox="0 0 100 100" class="w-full max-w-[200px] mx-auto drop-shadow-2xl">
                        <circle cx="50" cy="50" r="45" fill="#3b82f6" class="cible-circle" onclick="tirerDuel(6)" />
                        <circle cx="50" cy="50" r="30" fill="#ef4444" class="cible-circle" onclick="tirerDuel(8)" />
                        <circle cx="50" cy="50" r="15" fill="#eab308" class="cible-circle" onclick="tirerDuel(10)" />
                    </svg>
                    <div class="flex gap-2 mt-4 w-full px-2">
                        <button onclick="tirerDuel(5)" class="flex-1 btn-tap bg-slate-800 text-xs font-bold py-3 rounded-xl border border-slate-600 text-slate-300">+5 (Bord)</button>
                        <button onclick="tirerDuel(0)" class="flex-1 btn-tap bg-red-950/50 text-xs font-bold py-3 rounded-xl border border-red-900 text-red-400">0 (Manqué)</button>
                    </div>
                </div>
                <button id="btnValiderDuel" onclick="validerDuel()" disabled class="btn-tap bg-emerald-600 border-2 border-emerald-400 py-4 rounded-2xl font-black text-lg uppercase tracking-widest text-white shadow-xl opacity-40 transition-opacity">
                    Valider le Duel
                </button>
                <button onclick="annulerDuel()" class="btn-tap bg-slate-800 border border-slate-600 py-2 rounded-xl font-bold text-xs uppercase text-slate-400">↩ Annuler</button>
            </div>
        </div>
    </div>

    <script>
        // =====================================================================
        // CONFIGURATION FIREBASE
        // =====================================================================
        const firebaseConfig = { databaseURL: "https://arcathlon-eps-default-rtdb.europe-west1.firebasedatabase.app/" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // =====================================================================
        // ÉTAT GLOBAL (élève)
        // =====================================================================
        let equipesConfig = {}, seanceConfig = {}, scoresCoureur = {};
        let currentEq = "", currentPin = "", currentMaillot = "", inputPin = "";
        let passageActuel = 1, tirs = [], chronoInterval = null, timer18Interval = null;
        let tempsDepart = 0, tempsEcoule = 0, currentSerie = 0;
        let currentVitesse = 0, currentPointsCourse = 0, modeActuel = "sprint";
        let nbFlechesActuel = 2;
        // Pour les cartes stratégiques
        let effetCarte = null; // fonction à appliquer
        // Pour Kill Bill
        let killBillState = { equipeAdverse: "", scoreNous: 0, scoreEux: 0, tirsNous: 0, tirsEux: 0, maxTirs: 2 };

        // =====================================================================
        // CARTES STRATÉGIQUES (avec effets)
        // =====================================================================
        const cartesRelais = [
            { nom: "Tir mauvaise main !", effet: () => { nbFlechesActuel = 1; document.getElementById('infoFleches').textContent = `Flèches : ${nbFlechesActuel}`; } },
            { nom: "1 tour effacé !", effet: () => { /* pas d'effet direct, juste affiché */ } },
            { nom: "Cible éloignée (7m50)", effet: () => { /* affiché seulement */ } },
            { nom: "Départ retardé (+10s)", effet: () => { tempsEcoule += 10000; } },
            { nom: "Volée > 10 pts = 0 pénalité", effet: () => { /* modifie le calcul des pénalités, on stocke un flag */ effetCarte = 'noPenalty'; } },
            { nom: "Cible Scarface (Moitié compte)", effet: () => { effetCarte = 'halfScore'; } }
        ];

        // =====================================================================
        // ÉCOUTE DE LA CONFIG PROF
        // =====================================================================
        db.ref('arcathlon/config').on('value', snap => {
            const config = snap.val() || {};
            equipesConfig = config.equipes || {};
            modeActuel = config.mode || "sprint";
            seanceConfig = {
                seanceId: config.seanceId,
                distanceTotale: config.distanceTotale || 1200,
                nbSeries: config.nbSeries || 3,
                nbFleches: config.nbFleches || 2,
                vmaReference: config.vmaReference || {}
            };
            document.getElementById('labelModeActuel').textContent = modeActuel;
            document.getElementById('seanceInfo').textContent = seanceConfig.seanceId ? seanceConfig.seanceId.substring(7, 15) : '--';

            // Initialisation des scores locaux
            scoresCoureur = {};
            Object.keys(equipesConfig).forEach(eq => {
                (equipesConfig[eq].membres || []).forEach(m => {
                    scoresCoureur[`${eq}-${m.maillot}`] = {
                        series: Array(seanceConfig.nbSeries).fill(0).map(() => ({ course: 0, tir: 0, temps: 0, vitesse: 0 })),
                        complet: false
                    };
                });
            });

            // Mise à jour du sélecteur d'équipe
            const sel = document.getElementById('selEquipe');
            const valActuelle = sel.value;
            sel.innerHTML = `<option value="">-- CHOISIR L'ÉQUIPE --</option>` + Object.keys(equipesConfig).map(eq => `<option value="${eq}">ÉQUIPE ${eq}</option>`).join('');
            if (valActuelle && equipesConfig[valActuelle]) sel.value = valActuelle;
            if (currentEq && currentMaillot) buildCoureursGrid();
        });

        // =====================================================================
        // LOGIN & GRILLE
        // =====================================================================
        window.checkTeamSelection = function() {
            const val = document.getElementById('selEquipe').value;
            if (val) {
                currentEq = val; currentPin = equipesConfig[val].pin; inputPin = "";
                document.getElementById('pinDisplay').textContent = "";
                document.getElementById('numpad').classList.remove('hidden');
                document.getElementById('numpad').classList.add('flex');
            } else {
                document.getElementById('numpad').classList.add('hidden');
            }
        };

        window.addPin = function(num) {
            if (inputPin.length < 3) { inputPin += num; document.getElementById('pinDisplay').textContent = "•".repeat(inputPin.length); }
        };
        window.clearPin = function() { inputPin = ""; document.getElementById('pinDisplay').textContent = ""; };

        window.validatePin = function() {
            if (inputPin === currentPin) {
                document.getElementById('ecranLogin').classList.add('hidden');
                document.getElementById('ecranCoureurs').classList.remove('hidden');
                document.getElementById('ecranCoureurs').classList.add('flex');
                document.getElementById('titreEquipe').textContent = `Équipe ${currentEq}`;
                buildCoureursGrid();
            } else { alert("Code PIN incorrect."); clearPin(); }
        };

        window.resetLogin = function() {
            clearInterval(chronoInterval); clearInterval(timer18Interval);
            currentEq = ""; inputPin = ""; currentMaillot = "";
            document.getElementById('selEquipe').value = "";
            document.getElementById('numpad').classList.add('hidden');
            document.getElementById('ecranCoureurs').classList.add('hidden');
            document.getElementById('ecranAction').classList.add('hidden');
            document.getElementById('ecranLogin').classList.remove('hidden');
            document.getElementById('ecranLogin').classList.add('flex');
        };

        function buildCoureursGrid() {
            const grid = document.getElementById('maillotsGrid');
            const membres = equipesConfig[currentEq]?.membres || [];
            let html = "";
            const colorMap = {
                'Rouge': 'bg-red-950/80 border-red-600 text-red-400', 'Jaune': 'bg-yellow-950/80 border-yellow-600 text-yellow-400',
                'Bleu': 'bg-blue-950/80 border-blue-600 text-blue-400', 'Vert': 'bg-green-950/80 border-green-600 text-green-400'
            };
            membres.forEach(m => {
                if (m.absent) return;
                const key = `${currentEq}-${m.maillot}`;
                const scores = scoresCoureur[key] || { series: [], complet: false };
                const complet = scores.complet || scores.series.every(s => s.course > 0 || s.tir > 0);
                const cClass = colorMap[m.maillot] || 'bg-slate-800 border-slate-600 text-white';
                const disabledClass = complet ? 'opacity-50 pointer-events-none' : 'btn-tap';
                html += `
                <button onclick="${complet ? '' : `openAction('${m.maillot}')`}" class="${cClass} border-4 py-8 rounded-3xl flex flex-col items-center justify-center shadow-lg ${disabledClass}">
                    <span class="font-black text-2xl uppercase tracking-widest">${m.maillot}</span>
                    <span class="text-xs font-bold mt-1 text-slate-300">VMA: ${m.vma || '12'}</span>
                    ${complet ? `<div class="text-xs font-bold text-emerald-400 mt-2">✓ Terminé</div>` : ''}
                </button>`;
            });
            grid.innerHTML = html;
        }

        // =====================================================================
        // OUVERTURE D'UNE ACTION (ROUTEUR)
        // =====================================================================
        window.openAction = function(maillot) {
            currentMaillot = maillot;
            const key = `${currentEq}-${maillot}`;
            currentSerie = scoresCoureur[key].series.findIndex(s => s.course === 0);
            if(currentSerie === -1) currentSerie = 0;

            document.getElementById('ecranCoureurs').classList.add('hidden');
            document.getElementById('ecranAction').classList.remove('hidden');
            document.getElementById('ecranAction').classList.add('flex');
            
            const colorTexte = {'Vert':'text-green-400','Bleu':'text-blue-400','Jaune':'text-yellow-400','Rouge':'text-red-400'}[maillot] || 'text-white';
            document.getElementById('coureurLabel').innerHTML = `<span class="${colorTexte}">${maillot}</span>`;
            document.getElementById('infoSerieVMA').textContent = `| Série ${currentSerie + 1}/${seanceConfig.nbSeries} | VMA: ${seanceConfig.vmaReference[key] || '?'}`;

            // Rôle (chronométreur, juge, responsable, coureur) selon série et index
            const membres = equipesConfig[currentEq].membres || [];
            const idx = membres.findIndex(m => m.maillot === maillot);
            const roles = ['Chronométreur', 'Juge points', 'Responsable matériel', 'Coureur'];
            const roleIdx = (currentSerie + idx) % roles.length;
            document.getElementById('roleActuel').textContent = `Rôle : ${roles[roleIdx]}`;

            // Reset UI
            ['moduleChrono', 'moduleMille', 'moduleRelais', 'moduleSaisieTir', 'moduleKillBill'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
                document.getElementById(id).classList.remove('flex');
            });
            document.getElementById('carteAffichee').classList.add('hidden');
            document.getElementById('btnTirerCarte').classList.remove('hidden');
            nbFlechesActuel = (modeActuel === 'killbill') ? 1 : seanceConfig.nbFleches;
            effetCarte = null;
            document.getElementById('infoFleches').textContent = `Flèches : ${nbFlechesActuel}`;

            // Routage
            if (modeActuel === 'mille') {
                document.getElementById('moduleMille').classList.remove('hidden');
                document.getElementById('moduleMille').classList.add('flex');
                document.getElementById('chrono18s').textContent = "18";
                document.getElementById('btnStart18').classList.remove('hidden');
            } else if (modeActuel === 'killbill') {
                document.getElementById('moduleKillBill').classList.remove('hidden');
                document.getElementById('moduleKillBill').classList.add('flex');
                initKillBill();
            } else {
                // Sprint, Poursuite, Relais
                if (modeActuel === 'relais') {
                    document.getElementById('moduleRelais').classList.remove('hidden');
                    document.getElementById('moduleRelais').classList.add('flex');
                }
                document.getElementById('moduleChrono').classList.remove('hidden');
                document.getElementById('moduleChrono').classList.add('flex');
                resetChrono();
            }
        };

        window.retourCoureurs = function() {
            clearInterval(chronoInterval); clearInterval(timer18Interval);
            document.getElementById('ecranAction').classList.add('hidden');
            document.getElementById('ecranCoureurs').classList.remove('hidden');
            document.getElementById('ecranCoureurs').classList.add('flex');
            buildCoureursGrid();
        };

        // =====================================================================
        // CARTES RELAIS
        // =====================================================================
        window.tirerCarteRelais = function() {
            const carte = cartesRelais[Math.floor(Math.random() * cartesRelais.length)];
            document.getElementById('btnTirerCarte').classList.add('hidden');
            const affichage = document.getElementById('carteAffichee');
            affichage.textContent = carte.nom;
            affichage.classList.remove('hidden');
            if (carte.effet) carte.effet();
        };

        // =====================================================================
        // CHRONO CLASSIQUE
        // =====================================================================
        function demarrerChrono() {
            tempsDepart = Date.now() - tempsEcoule;
            chronoInterval = setInterval(mettreAJourChrono, 30);
            document.getElementById('btnDepart').disabled = true;
            document.getElementById('btnArrivee').disabled = false;
        }

        function mettreAJourChrono() {
            tempsEcoule = Date.now() - tempsDepart;
            const minutes = Math.floor(tempsEcoule / 60000).toString().padStart(2, '0');
            const secondes = Math.floor((tempsEcoule % 60000) / 1000).toString().padStart(2, '0');
            const centiemes = Math.floor((tempsEcoule % 1000) / 10).toString().padStart(2, '0');
            document.getElementById('chronoDisplay').textContent = `${minutes}:${secondes}.${centiemes}`;
        }

        function arreterChrono() {
            clearInterval(chronoInterval);
            const secondesTotales = tempsEcoule / 1000;
            currentVitesse = (seanceConfig.distanceTotale / 1000) / (secondesTotales / 3600);
            
            document.getElementById('tempsAffiche').textContent = document.getElementById('chronoDisplay').textContent;
            document.getElementById('vitesseAffiche').textContent = `${currentVitesse.toFixed(1)} km/h`;

            const key = `${currentEq}-${currentMaillot}`;
            const vmaRef = seanceConfig.vmaReference[key] || 12;
            currentPointsCourse = (currentVitesse >= vmaRef + 1) ? 3 : (currentVitesse >= vmaRef - 0.5) ? 2 : (currentVitesse >= vmaRef - 1) ? 1 : 0;
            if(scoresCoureur[key]) scoresCoureur[key].series[currentSerie] = { course: currentPointsCourse, vitesse: currentVitesse, temps: tempsEcoule, tir: 0 };

            document.getElementById('btnArrivee').disabled = true;
            setTimeout(() => {
                document.getElementById('moduleChrono').classList.add('hidden');
                document.getElementById('moduleRelais').classList.add('hidden');
                document.getElementById('moduleSaisieTir').classList.remove('hidden');
                document.getElementById('moduleSaisieTir').classList.add('flex');
                genererZonesFleches();
            }, 400);
        }

        function resetChrono() {
            clearInterval(chronoInterval); tempsEcoule = 0;
            document.getElementById('chronoDisplay').textContent = "00:00.00";
            document.getElementById('btnDepart').disabled = false;
            document.getElementById('btnArrivee').disabled = true;
        }

        // =====================================================================
        // DANS LE 1000 (18s)
        // =====================================================================
        window.startTimer18 = function() {
            let timeLeft = 18;
            document.getElementById('btnStart18').classList.add('hidden');
            const display = document.getElementById('chrono18s');
            display.textContent = timeLeft;
            display.classList.replace('text-emerald-400', 'text-yellow-400');
            timer18Interval = setInterval(() => {
                timeLeft--;
                display.textContent = timeLeft;
                if(timeLeft <= 5) display.classList.replace('text-yellow-400', 'text-red-500');
                if(timeLeft <= 0) {
                    clearInterval(timer18Interval);
                    display.classList.replace('text-red-500', 'text-emerald-400');
                    display.textContent = "TIR !";
                    document.getElementById('moduleMille').classList.add('hidden');
                    document.getElementById('moduleSaisieTir').classList.remove('hidden');
                    document.getElementById('moduleSaisieTir').classList.add('flex');
                    genererZonesFleches();
                }
            }, 1000);
        };

        // =====================================================================
        // SAISIE TIR STANDARD
        // =====================================================================
        function genererZonesFleches() {
            const container = document.getElementById('flechesContainer');
            let html = '';
            for (let i = 0; i < nbFlechesActuel; i++) {
                html += `<div id="affF${i+1}" class="bg-black text-slate-500 font-bold text-sm py-3 rounded-xl text-center border border-slate-800">Flèche ${i+1} : --</div>`;
            }
            container.innerHTML = html;
            document.getElementById('resultatTirSpecifique').textContent = "";
            tirs = []; updateTotal();
        }

        window.marquerTir = function(pts, zoneName) {
            if (tirs.length >= nbFlechesActuel) return;
            // Appliquer effet "Scarface" : moitié des points
            if (effetCarte === 'halfScore') pts = Math.floor(pts / 2);
            tirs.push(pts);
            const aff = document.getElementById(`affF${tirs.length}`);
            aff.className = "bg-slate-800 text-white font-black text-sm py-3 rounded-xl text-center border-2 border-slate-500 shadow impact";
            aff.innerHTML = `Flèche ${tirs.length} : <span class="text-blue-400">${pts} pts</span>`;
            updateTotal();
        };

        window.annulerTir = function() {
            if (tirs.length === 0) return;
            const idx = tirs.length; tirs.pop();
            const aff = document.getElementById(`affF${idx}`);
            aff.className = "bg-black text-slate-500 font-bold text-sm py-3 rounded-xl text-center border border-slate-800";
            aff.textContent = `Flèche ${idx} : --`;
            updateTotal();
        };

        window.updateTotal = function() {
            const btn = document.getElementById('btnValider');
            if (tirs.length === nbFlechesActuel) {
                const ptsTir = tirs.reduce((a, b) => a + b, 0);
                btn.disabled = false; btn.classList.remove('opacity-40');
                
                const resDiv = document.getElementById('resultatTirSpecifique');
                // Calcul des pénalités / bonus selon mode
                if (modeActuel === 'poursuite' || modeActuel === 'relais') {
                    let pen = (ptsTir < 7) ? 3 : (ptsTir < 12) ? 2 : (ptsTir < 16) ? 1 : 0;
                    if (effetCarte === 'noPenalty' && ptsTir > 10) pen = 0;
                    resDiv.innerHTML = `Pénalité : <span class="text-red-400 text-lg">${pen} tour(s)</span>`;
                } else if (modeActuel === 'sprint') {
                    let bonus = (ptsTir < 7) ? 0 : (ptsTir < 12) ? 10 : (ptsTir < 16) ? 15 : 20;
                    resDiv.innerHTML = `Bonus : <span class="text-emerald-400 text-lg">-${bonus} sec</span>`;
                } else {
                    resDiv.innerHTML = `Total : <span class="text-blue-400 text-lg">${ptsTir} pts</span>`;
                }
            } else {
                btn.disabled = true; btn.classList.add('opacity-40');
                document.getElementById('resultatTirSpecifique').textContent = "";
            }
        };

        window.validerPassage = function() {
            document.getElementById('btnValider').disabled = true;
            const ptsTir = tirs.reduce((a, b) => a + b, 0);
            
            // Envoi anonyme
            const passageData = {
                equipe: currentEq, maillot: currentMaillot,
                ptsVMA: currentPointsCourse, ptsTir: ptsTir,
                vitesse: currentVitesse, temps: tempsEcoule,
                serie: currentSerie + 1, timestamp: Date.now(), mode: modeActuel
            };
            db.ref('arcathlon/live/passages').push().set(passageData)
                .then(() => {
                    const key = `${currentEq}-${currentMaillot}`;
                    if(scoresCoureur[key]) scoresCoureur[key].series[currentSerie].tir = ptsTir;
                    passageActuel++; retourCoureurs();
                })
                .catch(() => {
                    alert("Erreur réseau. Retour à la grille.");
                    retourCoureurs();
                });
        };

        // =====================================================================
        // KILL BILL (DUEL 2v2)
        // =====================================================================
        function initKillBill() {
            // Trouver une équipe adverse (autre que la sienne)
            const autres = Object.keys(equipesConfig).filter(eq => eq !== currentEq);
            killBillState.equipeAdverse = autres.length ? autres[0] : 'Équipe X';
            document.getElementById('adversaireLabel').textContent = killBillState.equipeAdverse;
            killBillState.scoreNous = 0;
            killBillState.scoreEux = 0;
            killBillState.tirsNous = 0;
            killBillState.tirsEux = 0;
            killBillState.maxTirs = seanceConfig.nbFleches || 2;
            document.getElementById('scoreNous').textContent = '0';
            document.getElementById('scoreEux').textContent = '0';
            document.getElementById('messageDuel').textContent = `Tire une flèche pour ton équipe (${killBillState.tirsNous+1}/${killBillState.maxTirs})`;
            document.getElementById('btnValiderDuel').disabled = true;
            document.getElementById('btnValiderDuel').classList.add('opacity-40');
        }

        window.tirerDuel = function(pts) {
            if (killBillState.tirsNous < killBillState.maxTirs) {
                // Tour de l'élève
                killBillState.scoreNous += pts;
                killBillState.tirsNous++;
                document.getElementById('scoreNous').textContent = killBillState.scoreNous;
                if (killBillState.tirsNous < killBillState.maxTirs) {
                    document.getElementById('messageDuel').textContent = `Tire une flèche pour ton équipe (${killBillState.tirsNous+1}/${killBillState.maxTirs})`;
                } else {
                    // Maintenant c'est au tour de l'adversaire (simulé par l'élève)
                    document.getElementById('messageDuel').textContent = `Tire maintenant pour l'équipe adverse (${killBillState.tirsEux+1}/${killBillState.maxTirs})`;
                }
            } else if (killBillState.tirsEux < killBillState.maxTirs) {
                // Tour de l'adversaire
                killBillState.scoreEux += pts;
                killBillState.tirsEux++;
                document.getElementById('scoreEux').textContent = killBillState.scoreEux;
                if (killBillState.tirsEux < killBillState.maxTirs) {
                    document.getElementById('messageDuel').textContent = `Tire pour l'adversaire (${killBillState.tirsEux+1}/${killBillState.maxTirs})`;
                } else {
                    // Fin du duel
                    document.getElementById('messageDuel').textContent = "Duel terminé ! Clique sur Valider";
                    document.getElementById('btnValiderDuel').disabled = false;
                    document.getElementById('btnValiderDuel').classList.remove('opacity-40');
                }
            }
        };

        window.annulerDuel = function() {
            // Réinitialiser le duel
            initKillBill();
        };

        window.validerDuel = function() {
            // Calcul des pénalités selon écart
            const diff = killBillState.scoreNous - killBillState.scoreEux;
            let penalite = 0;
            if (diff < 0) penalite = (Math.abs(diff) < 5) ? 2 : 3;
            else if (diff > 0) penalite = (diff < 5) ? 0 : 1;
            // Envoyer le résultat (les points de tir sont les scores, mais on peut envoyer les pénalités)
            const ptsTir = killBillState.scoreNous; // ou score total
            const passageData = {
                equipe: currentEq, maillot: currentMaillot,
                ptsVMA: 0, // pas de course pour Kill Bill
                ptsTir: ptsTir,
                penalites: penalite,
                vitesse: 0, temps: 0,
                serie: currentSerie + 1, timestamp: Date.now(), mode: 'killbill'
            };
            db.ref('arcathlon/live/passages').push().set(passageData)
                .then(() => {
                    const key = `${currentEq}-${currentMaillot}`;
                    if(scoresCoureur[key]) scoresCoureur[key].series[currentSerie].tir = ptsTir;
                    passageActuel++; retourCoureurs();
                })
                .catch(() => {
                    alert("Erreur réseau. Retour à la grille.");
                    retourCoureurs();
                });
        };

        // =====================================================================
        // CONNEXION FIREBASE (statut)
        // =====================================================================
        db.ref('.info/connected').on('value', snap => {
            document.getElementById('connDot').className = "w-3 h-3 rounded-full " + (snap.val() ? "bg-emerald-500" : "bg-red-500");
            document.getElementById('connLabel').textContent = snap.val() ? "En ligne" : "Hors ligne";
        });

        // =====================================================================
        // INITIALISATION
        // =====================================================================
        // La config est écoutée via le listener ci-dessus.
        // On ajoute un petit élément pour afficher le nombre de flèches en cours
        // (on ajoute dynamiquement un span dans l'en-tête si besoin)
        // On ajoute un span dans l'info de la série
        document.addEventListener('DOMContentLoaded', function() {
            // Ajouter un affichage du nombre de flèches dans la zone d'info
            const infoDiv = document.getElementById('infoSerieVMA');
            const spanFleches = document.createElement('span');
            spanFleches.id = 'infoFleches';
            spanFleches.className = 'text-xs font-bold text-slate-400 ml-2';
            spanFleches.textContent = 'Flèches : 2';
            infoDiv.appendChild(spanFleches);
        });

        console.log("Arcathlon élève chargé - Mode test");
    </script>
</body>
</html>
